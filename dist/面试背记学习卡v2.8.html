<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>面试背记学习卡 v2.8</title>
<style>
/* ============================================================
   base.css — CSS 变量 · 主题 · 重置 · 顶部导航 · 通用组件
   ============================================================ */
:root {
  --bg-primary: #f5f7fa;
  --bg-secondary: #fff;
  --bg-card-front: #fff;
  --bg-card-back: #f0f7ff;
  --text-primary: #1a1a2e;
  --text-secondary: #4a5568;
  --text-muted: #718096;
  --accent: #4299e1;
  --accent-hover: #3182ce;
  --success: #48bb78;
  --success-hover: #38a169;
  --danger: #f56565;
  --danger-hover: #e53e3e;
  --border: #e2e8f0;
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  --radius: 16px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.dark-mode {
  --bg-primary: #0f172a;
  --bg-secondary: #1e293b;
  --bg-card-front: #1e293b;
  --bg-card-back: #1e3a5f;
  --text-primary: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  --accent: #60a5fa;
  --border: #334155;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background-color: var(--bg-primary); color: var(--text-primary); line-height: 1.6;
  min-height: 100vh; transition: var(--transition); -webkit-font-smoothing: antialiased; padding-bottom: 40px;
}

/* ===== 顶部导航 ===== */
.topbar {
  background-color: var(--bg-secondary); border-bottom: 1px solid var(--border);
  padding: 10px 20px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
}
.topbar-content { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.topbar-title { font-size: 1.05rem; font-weight: 650; white-space: nowrap; }
.search-box { position: relative; flex: 1; min-width: 160px; max-width: 260px; }
.search-box input {
  width: 100%; padding: 7px 12px 7px 32px; border: 1px solid var(--border); border-radius: 8px;
  background-color: var(--bg-primary); color: var(--text-primary); font-size: 0.88rem; transition: var(--transition);
}
.search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(66,153,225,0.15); }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; pointer-events: none; }
.topbar-actions { display: flex; gap: 6px; margin-left: auto; }
.icon-btn {
  width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 8px; background-color: var(--bg-primary);
  color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.95rem;
  transition: var(--transition); flex-shrink: 0;
}
.icon-btn:hover { background-color: var(--accent); color: #fff; border-color: var(--accent); }
.login-btn {
  height: 34px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background-color: var(--bg-primary);
  color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; transition: var(--transition); flex-shrink: 0; white-space: nowrap;
}
.login-btn:hover { background-color: var(--accent); color: #fff; border-color: var(--accent); }
.login-btn.logged-in { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.login-btn.logged-in:hover { color: #fff; }

/* ===== 模式切换标签 ===== */
.mode-tabs { max-width: 900px; margin: 12px auto 0; padding: 0 20px; display: flex; gap: 8px; flex-wrap: wrap; }
.mode-tab {
  padding: 6px 15px; border: 1px solid var(--border); border-radius: 20px; background-color: var(--bg-secondary);
  color: var(--text-secondary); font-size: 0.84rem; cursor: pointer; transition: var(--transition); user-select: none;
}
.mode-tab.active { background-color: var(--accent); color: #fff; border-color: var(--accent); }
.mode-tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

/* ===== 分类标签（弹层内，默认收起） ===== */
.category-pop { display: none; max-width: 900px; margin: 8px auto 0; padding: 0 16px; }
.category-pop.open { display: block; }
.category-pop-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background-color: var(--bg-secondary);
  border: 1px solid var(--border); border-radius: 12px 12px 0 0;
  font-size: 0.88rem; font-weight: 650; color: var(--text-secondary);
}
.category-pop-close {
  width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-primary); color: var(--text-muted); cursor: pointer; font-size: 0.8rem;
}
.category-pop-close:hover { border-color: var(--danger); color: var(--danger); }
.category-bar {
  display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 14px;
  background-color: var(--bg-secondary); border: 1px solid var(--border);
  border-top: none; border-radius: 0 0 12px 12px;
}
.filter-trigger { font-weight: 500; }
.filter-trigger.active { border-color: var(--accent); color: var(--accent); background-color: var(--bg-secondary); }
#filterCount { font-size: 0.72rem; color: var(--text-muted); }
.filter-trigger.active #filterCount { color: var(--accent); }
.category-tag {
  padding: 4px 12px; border: 1px solid var(--border); border-radius: 18px; background-color: var(--bg-primary);
  color: var(--text-secondary); font-size: 0.8rem; cursor: pointer; transition: var(--transition); user-select: none; white-space: nowrap;
}
.category-tag:hover { border-color: var(--accent); color: var(--accent); }
.category-tag.active { background-color: var(--accent); color: #fff; border-color: var(--accent); }

/* ===== 通用按钮 ===== */
.btn {
  padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; background-color: var(--bg-secondary);
  color: var(--text-secondary); font-size: 0.82rem; cursor: pointer; transition: var(--transition);
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background-color: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background-color: var(--accent-hover); }

/* ===== 模式显隐 ===== */
.view { display: none; }
.view.active { display: block; }
/* 分类筛选仅在 指导/编辑 模式隐藏，抽背卡与记背知识模式均显示 */
.mode-guide .category-pop, .mode-editor .category-pop { display: none; }
.mode-guide .filter-trigger, .mode-editor .filter-trigger { display: none; }
.mode-editor .search-box { display: none; }

/* ===== 加载遮罩 ===== */
#dataLoading {
  position: fixed; inset: 0; background: var(--bg-primary); z-index: 999;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
}
#dataLoading .spinner {
  width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
#dataLoading .msg { color: var(--text-muted); font-size: 0.9rem; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 空状态 ===== */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }

/* ===== 题库选择弹窗（v2.7） ===== */
.bank-picker-mask {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 1000;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.bank-picker {
  width: 100%; max-width: 480px; background: var(--bg-secondary); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); padding: 24px; animation: fadeUp 0.25s ease;
}
.bank-picker h3 { font-size: 1.1rem; margin-bottom: 6px; }
.bank-picker-desc { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 16px; }
.bank-options { display: flex; flex-direction: column; gap: 10px; }
.bank-option {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: var(--transition);
}
.bank-option:hover { border-color: var(--accent); }
.bank-option.active { border-color: var(--accent); background-color: rgba(66, 153, 225, 0.08); }
.bank-option input { accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
.bank-option-title { font-weight: 650; font-size: 0.92rem; white-space: nowrap; }
.bank-option-count { color: var(--accent); font-weight: 700; font-size: 0.86rem; margin-left: auto; }
.bank-option-desc { color: var(--text-muted); font-size: 0.76rem; }
.bank-picker-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
.bank-picker-actions .btn:first-child { margin-right: auto; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ===== 登录弹窗（v2.8） ===== */
.login-picker { max-width: 400px; }
.login-field input {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px;
  background-color: var(--bg-primary); color: var(--text-primary); font-size: 0.95rem; transition: var(--transition);
}
.login-field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(66,153,225,0.15); }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* ===== 切换题库 toast（v2.7） ===== */
.bank-toast {
  position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(80px);
  background: rgba(17, 24, 39, 0.92); color: #fff; padding: 10px 18px; border-radius: 24px;
  font-size: 0.85rem; opacity: 0; transition: all 0.3s ease; z-index: 1001; pointer-events: none;
  box-shadow: var(--shadow-lg);
}
.bank-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

</style>
<style>
/* ============================================================
   flashcard.css — 抽背卡 + 进度 + 控制 + markdown 渲染样式
   ============================================================ */

/* 进度区 */
.progress-section { max-width: 700px; margin: 16px auto 14px; padding: 0 20px; }
.progress-stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.8rem; color: var(--text-secondary); flex-wrap: wrap; gap: 6px; }
.stats-badges { display: flex; gap: 10px; }
.stat-badge { font-size: 0.76rem; padding: 2px 8px; border-radius: 10px; background-color: var(--bg-secondary); color: var(--text-muted); }
.stat-badge.mastered { color: var(--success); }
.stat-badge.weak { color: var(--danger); }
.progress-bar { height: 5px; background-color: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: 3px; transition: width 0.4s ease; }

/* 控制栏 */
.controls-bar { max-width: 700px; margin: 0 auto 14px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: nowrap; }
.controls-toggles { display: flex; align-items: center; gap: 14px; flex-wrap: nowrap; white-space: nowrap; }
.toggle-switch { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; color: var(--text-secondary); cursor: pointer; user-select: none; white-space: nowrap; }
.toggle-switch input { display: none; }
.toggle-slider { width: 38px; height: 20px; background-color: var(--border); border-radius: 10px; position: relative; transition: var(--transition); flex-shrink: 0; }
.toggle-slider::after { content: ''; position: absolute; width: 16px; height: 16px; background-color: #fff; border-radius: 50%; top: 2px; left: 2px; transition: var(--transition); }
.toggle-switch input:checked + .toggle-slider { background-color: var(--accent); }
.toggle-switch input:checked + .toggle-slider::after { left: 20px; }
.font-control { display: flex; align-items: center; gap: 6px; }
.font-btn { width: 30px; height: 26px; border: 1px solid var(--border); border-radius: 6px; background-color: var(--bg-secondary); color: var(--text-secondary); font-size: 0.8rem; cursor: pointer; }
.font-btn:hover { border-color: var(--accent); color: var(--accent); }
#fontSizeLabel { font-size: 0.78rem; color: var(--text-muted); min-width: 40px; text-align: center; }

/* 卡片 */
.card-wrapper { max-width: 680px; margin: 0 auto 30px; padding: 0 20px; }
.card-container { perspective: 1500px; width: 100%; }
.flashcard { width: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; min-height: 440px; }
.flashcard.flipped { transform: rotateY(180deg); }
.card-face { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; }
.card-front { background-color: var(--bg-card-front); justify-content: center; align-items: center; text-align: center; padding: 40px 36px 30px; }
.card-front::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: var(--radius) var(--radius) 0 0; }
.card-question { font-size: 1.3rem; font-weight: 650; color: var(--text-primary); line-height: 2; flex: 1; display: flex; align-items: center; justify-content: center; max-width: 560px; margin: 0 auto; padding: 0 8px; }
.card-question .q-inner { display: block; text-align: center; word-break: break-word; }
.card-question code { background-color: rgba(66, 153, 225, 0.13); padding: 2px 7px; border-radius: 6px; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.85em; color: var(--accent); }
.card-front-footer { margin-top: 24px; display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--text-muted); }
.card-category-badge { background-color: var(--accent); color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 0.74rem; font-weight: 500; }
.stars { color: #f6ad55; font-size: 0.78rem; letter-spacing: 1px; }
.stars .stars-empty { color: var(--border); }
.flip-hint { margin-top: 16px; font-size: 0.8rem; color: var(--text-muted); opacity: 0.7; }
.card-back { background-color: var(--bg-card-back); transform: rotateY(180deg); }
.card-answer-wrapper { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 24px 28px 16px; -webkit-overflow-scrolling: touch; scrollbar-gutter: stable; }
.card-answer-wrapper::-webkit-scrollbar { width: 6px; }
.card-answer-wrapper::-webkit-scrollbar-thumb { background-color: var(--border); border-radius: 3px; }
.card-back-actions { padding: 12px 20px 18px; border-top: 1px solid var(--border); display: flex; gap: 12px; flex-shrink: 0; }
.review-btn { flex: 1; padding: 12px 16px; min-height: 44px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: #fff; transition: var(--transition); }
.review-btn:active { transform: scale(0.97); }
.btn-know { background-color: var(--success); }
.btn-know:hover { background-color: var(--success-hover); }
.btn-unknown { background-color: var(--danger); }
.btn-unknown:hover { background-color: var(--danger-hover); }
.card-back-footer { padding: 0 20px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.76rem; color: var(--text-muted); flex-shrink: 0; }

/* 导航 */
.nav-buttons { max-width: 680px; margin: 0 auto 24px; padding: 0 20px; display: flex; gap: 12px; justify-content: center; }
.nav-btn { flex: 1; max-width: 160px; padding: 12px 18px; min-height: 44px; border: 1px solid var(--border); border-radius: 10px; background-color: var(--bg-secondary); color: var(--text-secondary); font-size: 0.92rem; cursor: pointer; box-shadow: var(--shadow); transition: var(--transition); }
.nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.footer { max-width: 680px; margin: 0 auto 16px; padding: 0 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.shortcuts-hint { max-width: 680px; margin: 0 auto 24px; padding: 0 20px; text-align: center; font-size: 0.74rem; color: var(--text-muted); opacity: 0.8; }
.shortcuts-hint kbd { display: inline-block; padding: 2px 6px; background-color: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px; font-family: monospace; font-size: 0.72rem; margin: 0 2px; }

/* ===== markdown 渲染（card-answer）===== */
.card-answer { font-size: 0.95rem; color: var(--text-primary); line-height: 2; }
.card-answer p { margin-bottom: 12px; }
.card-answer strong { color: var(--accent); font-weight: 650; }
.card-answer p.answer-point { padding: 4px 12px 4px 14px; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; margin-bottom: 12px; background: linear-gradient(90deg, rgba(66, 153, 225, 0.07), transparent 75%); }
.card-answer ul, .card-answer ol { margin: 10px 0 12px; padding-left: 2px; }
.card-answer ul { list-style: none; }
.card-answer li { margin-bottom: 7px; padding-left: 22px; position: relative; }
.card-answer ul li::before { content: '▸'; position: absolute; left: 4px; color: var(--accent); font-size: 0.9em; }
.card-answer ol { padding-left: 2px; }
.card-answer ol li { list-style: none; }
.card-answer ol li::before { content: attr(data-n) '.'; position: absolute; left: 2px; color: var(--accent); font-weight: 700; }
.card-answer code { background-color: rgba(66, 153, 225, 0.12); padding: 2px 7px; border-radius: 5px; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.88em; color: var(--accent); }
.card-answer h3 { margin: 18px 0 10px; font-size: 1.02rem; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
.card-answer h3::before { content: '◆'; font-size: 0.75em; color: var(--accent); }
.card-answer table { border-collapse: separate; border-spacing: 0; width: 100%; margin: 12px 0; font-size: 0.86em; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.card-answer th, .card-answer td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.card-answer th:last-child, .card-answer td:last-child { border-right: none; }
.card-answer tr:last-child td { border-bottom: none; }
.card-answer th { background: rgba(66, 153, 225, 0.12); font-weight: 650; }
.card-answer tr:nth-child(even) { background: rgba(66, 153, 225, 0.05); }
.card-answer img.md-img { max-width: 100%; border-radius: 8px; margin: 8px 0; }

/* 代码块：换行适配（长行折行，移动端不横向滚动） */
.card-answer pre.code-block {
  background-color: var(--bg-primary); padding: 14px 16px; border-radius: 10px;
  overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); font-size: 0.85em;
  white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04);
}
.card-answer pre.code-block code { background: none; border: none; padding: 0; color: var(--text-primary); font-size: 0.9em; line-height: 1.8; white-space: pre-wrap; }

@media (max-width: 600px) {
  .card-front { padding: 28px 22px; }
  .card-question { font-size: 1.14rem; line-height: 1.95; max-width: 100%; }
  .card-answer-wrapper { padding: 18px 18px 12px; }
  .card-answer { font-size: 0.9rem; }
  .category-bar, .controls-bar { justify-content: center; }
  /* 窄屏允许控制栏开关换行，避免横向溢出 */
  .controls-bar, .controls-toggles { flex-wrap: wrap; }
}

</style>
<style>
/* ============================================================
   memo.css — 记背知识（学习模式）
   ============================================================ */
#memoView { max-width: 800px; width: min(800px, 92vw); margin: 0 auto 40px; padding: 0 16px; box-sizing: border-box; }
.memo-toolbar { display: flex; align-items: center; gap: 10px; margin: 14px 0 12px; flex-wrap: wrap; }
.memo-toolbar h2 { font-size: 1.05rem; font-weight: 650; }
#memoTotal { font-size: 0.8rem; color: var(--text-muted); }
.memo-actions { margin-left: auto; display: flex; gap: 8px; }
.memo-group { margin-bottom: 16px; }
.memo-group-header {
  display: flex; align-items: center; gap: 10px; padding: 9px 14px;
  background-color: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 0; cursor: pointer; user-select: none;
}
.memo-group-header::before { content: '▸'; color: var(--accent); transition: transform 0.2s; font-size: 0.85em; }
.memo-group.open .memo-group-header::before { transform: rotate(90deg); }
.memo-group-name { font-weight: 650; color: var(--accent); font-size: 0.95rem; }
.memo-group-count { font-size: 0.8rem; color: var(--text-muted); }
/* 分组默认收起：未展开时不显示题目列表 */
.memo-group:not(.open) .memo-item { display: none; }
.memo-group.open .memo-group-header { border-radius: 10px 10px 0 0; border-bottom: 1px dashed var(--border); }
.memo-item { background-color: var(--bg-secondary); border: 1px solid var(--border); border-top: none; overflow: hidden; transition: var(--transition); }
.memo-group.open .memo-item:last-child { border-radius: 0 0 12px 12px; }
/* 题目条目：块级布局，▸ 绝对定位，避免 flex 拉伸到屏幕两边 */
.memo-item-question {
  padding: 12px 16px 12px 34px; font-size: 1.0rem; font-weight: 600; color: var(--text-primary);

<script>
/* ============================================================
   markdown.js — Markdown 渲染 + 题面关键词高亮 + 代码换行适配
   ============================================================ */
(function (global) {
  'use strict';

  /* 转义 HTML 特殊字符 */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* 代码块：保护起来，避免被后续替换破坏；渲染时做折行适配 */
  function renderMarkdown(text) {
    if (!text) return '';
    let h = esc(text);

    // 1. 保护代码块 ```...```
    const blocks = [];
    h = h.replace(/```([\s\S]*?)```/g, function (m, code) {
      const langMatch = code.match(/^\s*(\w+)/);
      const lang = langMatch ? langMatch[1] : '';
      const body = code.replace(/^\s*\w+\s*/, '').replace(/\s+$/, '');
      blocks.push('<pre class="code-block"><code data-lang="' + lang + '">' + body + '</code></pre>');
      return '\x00BLOCK' + (blocks.length - 1) + '\x00';
    });

    // 2. 表格
    h = h.replace(/(\n|^)(\|[^\n]+\|)\s*\n\s*\|[-:| ]+\|\s*\n\s*(\|[^\n]+\|(?:\s*\n\s*\|[^\n]+\|)*)/g,
      function (m, pre, head, body) {
        const hc = head.replace(/^\||\|$/g, '').split('|').map(s => '<th>' + s.trim() + '</th>').join('');
        const rows = body.trim().split('\n').map(r => {
          const cells = r.replace(/^\||\|$/g, '').split('|').map(s => '<td>' + s.trim() + '</td>').join('');
          return '<tr>' + cells + '</tr>';
        }).join('');
        return '<table class="md-table"><thead><tr>' + hc + '</tr></thead><tbody>' + rows + '</tbody></table>';
      });

    // 3. 图片 ![](...)
    h = h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img class="md-img" src="$2" alt="$1" loading="lazy">');

    // 4. 行内代码
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');

    // 5. 加粗
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    // 6. 无序列表
    h = h.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
    h = h.replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m.replace(/\n/g, '') + '</ul>');

    // 7. 有序列表
    h = h.replace(/^(\d+)[.、] (.+)$/gm, '<li data-n="$1">$2</li>');
    h = h.replace(/(<li data-n="\d+">.*<\/li>\n?)+/g, m => '<ol>' + m.replace(/\n/g, '') + '</ol>');

    // 8. h3 标题
    h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');

    // 9. 分段
    h = h.split(/\n\n+|\n(?=<strong>)/).map(function (seg) {
      if (!seg.trim()) return '';
      if (/^\x00BLOCK/.test(seg) || /^<table/.test(seg) || /^<ul/.test(seg) || /^<h3>/.test(seg) || /^<ol>/.test(seg)) return seg;
      const embedded = seg.match(/<(ul|table|ol)[\s\S]*?<\/(ul|table|ol)>/);
      if (embedded) {
        const rest = seg.replace(/<(ul|table|ol)[\s\S]*?<\/(ul|table|ol)>/, '').replace(/\n/g, '<br>').replace(/^<br>/, '').replace(/<br>$/, '').trim();
        return (rest ? ('<p' + (/^\s*<strong>/.test(rest) ? ' class="answer-point"' : '') + '>' + rest + '</p>') : '') + embedded[0].replace(/\n/g, '');
      }
      const inner = seg.replace(/\n/g, '<br>');
      const cls = /^\s*<strong>/.test(inner) ? ' class="answer-point"' : '';
      return '<p' + cls + '>' + inner + '</p>';
    }).join('');

    // 10. 还原代码块
    h = h.replace(/\x00BLOCK(\d+)\x00/g, (m, i) => blocks[parseInt(i)] || '');
    return h;
  }

  /* 题面渲染：高亮代码关键词 */
  function renderQuestion(text) {
    if (!text) return '';
    let h = esc(text);
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/__(?:new|init|del|slots|call|str|len|repr|iter|next|eq|hash|enter|exit|getattr|setattr|getitem|setitem|getattribute|closure|dict|mro|name|main|class|doc|all|future)__(\.\w+)?/g, m => '<code>' + m + '</code>');
    h = h.replace(/@(?:property|classmethod|staticmethod|abstractmethod)\b/g, m => '<code>' + m + '</code>');
    h = h.replace(/\b(None|True|False)\b/g, '<code>$1</code>');
    return h;
  }

  /* 代码换行适配：按标点/运算符在长行内插入软换行（零宽空格，复制时不影响原码） */
  function wrapCodeLines(code, maxLen) {
    maxLen = maxLen || 100;
    return code.split('\n').map(function (line) {
      if (line.length <= maxLen) return line;
      let out = '';
      let col = 0;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        out += ch;
        col++;
        // 在运算符/标点/空格后，且已超过阈值时，插入软换行机会
        if (col >= maxLen && /[\s,;\)\]\}:.+\-*\/%=&|^<>]/.test(ch)) {
          out += '\u200B'; // 零宽空格
          col = 0;
        }
      }
      return out;
    }).join('\n');
  }

  global.MD = { renderMarkdown: renderMarkdown, renderQuestion: renderQuestion, wrapCodeLines: wrapCodeLines };
})(window);

</script>
<script>
/* ============================================================
   data-loader.js — 数据加载器（v2.7：多题库档位）
   策略：内联 banks(单文件版) → 分片 banks/*.json(dist版) → 整包回退
   兼容 file:// 与 http(s)。
   banks 结构：{ 1:[bank==1 的题], 2:[...], 3:[...], 4:[...] }（单档，无重叠）
   meta 结构：{ total, counts:{1:244,2:209,3:174,4:95} }
   v2.8：fetch 加 8s 超时保护，避免 SW 或网络异常时永久卡在加载页
   ============================================================ */
(function (global) {
  'use strict';

  // fetch 加超时：超时返回 reject，避免永久挂起
  const fetchWithTimeout = (url, opts, ms) => {
    return new Promise(function (resolve, reject) {
      const timer = setTimeout(function () { reject(new Error('timeout ' + ms + 'ms')); }, ms);
      fetch(url, opts).then(
        function (r) { clearTimeout(timer); resolve(r); },
        function (e) { clearTimeout(timer); reject(e); }
      );
    });
  };

  const Loader = {
    /* 加载题库，回调 onProgress(loaded,total,msg) / onDone(banks, meta) / onFail(err) */
    load: function (opts) {
      opts = opts || {};
      const onProgress = opts.onProgress || function () {};
      const onDone = opts.onDone || function () {};
      const onFail = opts.onFail || function () {};

      // 1. 内联 banks（单文件版）
      if (global.__FC_BANKS) {
        onDone(global.__FC_BANKS, global.__FC_BANK_META || {});
        return;
      }

      // 2. 分片 banks（dist 版）：读 banks.manifest.json 后 fetch bank-N.json
      const base = './';
      const TIMEOUT = 8000;
      fetchWithTimeout(base + 'banks.manifest.json', { cache: 'no-cache' }, TIMEOUT)
        .then(r => r.json())
        .then(function (manifest) {
          const banks = (manifest.banks || [1, 2, 3, 4]);
          let i = 0;
          const result = {};
          function next() {
            if (i >= banks.length) {
              const total = Object.keys(result).reduce((s, k) => s + result[k].length, 0);
              onDone(result, { total: total, counts: manifest.counts || {} });
              return;
            }
            const b = banks[i++];
            onProgress(i, banks.length, '加载题库 ' + b + '…');
            fetchWithTimeout(base + 'banks/bank-' + b + '.json', { cache: 'no-cache' }, TIMEOUT)
              .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
              .then(function (arr) { result[b] = arr || []; next(); })
              .catch(function () {
                // 单档失败重试一次
                fetchWithTimeout(base + 'banks/bank-' + b + '.json', { cache: 'no-cache' }, TIMEOUT)
                  .then(r => r.json())
                  .then(function (arr) { result[b] = arr || []; next(); })
                  .catch(function (err) { onFail('题库分片加载失败: bank-' + b + '（' + (err.message || err) + '）'); });
              });
          }
          next();
        })
        .catch(function (err) {
          onFail('未找到题库数据（banks.manifest.json）：' + (err.message || err));
        });
    }
  };

  global.Loader = Loader;
})(window);

</script>
<script>
/* ============================================================
   cloud.js — 云端同步层（v2.8：Supabase + 简单昵称登录）
   原理：直接调用 Supabase PostgREST（REST API），无需引入 SDK。
   数据模型：profiles 表一行一个用户，data(jsonb) 存该用户全部状态。
   同步范围：学习进度 + 设置(档位/主题/字体) + 编辑后的题库。
             （存档点 archives / 操作日志 oplog 属编辑本地辅助，不同步）
   未配置 key 时 enabled=false，自动回退为纯本地（localStorage），
   离线或请求失败时静默降级，不影响本地使用。
   ============================================================ */
(function (global) {
  'use strict';

  /* ★★★ 在这里填入你的 Supabase 项目配置（开通步骤见 docs/supabase-setup.md）★★★ */
  const SUPABASE_URL = 'https://imbzbrtgexcpofllelok.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltYnpicnRnZXhjcG9mbGxlbG9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTE1ODgsImV4cCI6MjEwNDI2NzU4OH0.SXadb7QX287584mCvJHjGCb9X8433kfY6SBGop-cJiY';

  const NICK_KEY = 'v27_nickname';   // 本地记住「当前登录昵称」（不同步上云）
  const USERID_KEY = 'v27_userid';   // 当前登录用户的 Supabase userId（不同步上云）
  const PUSH_DELAY = 500;            // 停止操作后多久自动推送（毫秒）

  const Cloud = {
    enabled: false,
    nickname: null,
    userId: null,
    _data: null,     // 云上该用户的数据快照 { key: value }
    _timer: null,

    /* ---------- 初始化 ---------- */
    init: function () {
      this.enabled = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
      if (!this.enabled) return;
      try {
        this.nickname = localStorage.getItem(NICK_KEY) || null;
        this.userId = localStorage.getItem(USERID_KEY) || null;
        // ★ 防御：旧版未记 userId，强制降级为本地模式（避免 fetch id=eq.null 400 报错）
        if (this.nickname && !this.userId) {
          console.warn('[cloud] 检测到旧登录态（缺 userId），自动降级为本地模式，请重新登录');
          this.nickname = null;
          this.userId = null;
          try { localStorage.removeItem(NICK_KEY); } catch (e) {}
        }
      } catch (e) { this.nickname = null; this.userId = null; }
    },

    isLoggedIn: function () { return this.enabled && !!this.nickname; },
    getNickname: function () { return this.nickname; },

    /* ---------- 底层请求 ---------- */
    _headers: function () {
      return {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        Prefer: 'return=representation',
      };
    },
    _req: function (method, path, body) {
      return fetch(SUPABASE_URL + '/rest/v1/' + path, {
        method: method,
        headers: this._headers(),
        body: body == null ? undefined : JSON.stringify(body),
      }).then(function (r) {
        if (!r.ok) throw new Error('云端请求失败 HTTP ' + r.status);
        const ct = r.headers.get('content-type') || '';
        return ct.indexOf('json') >= 0 ? r.json() : null;
      });
    },

    /* ---------- 登录：查昵称，不存在则创建 ---------- */
    login: function (nickname) {
      if (!this.enabled) return Promise.reject(new Error('云端未配置（见 docs/supabase-setup.md）'));
      nickname = String(nickname == null ? '' : nickname).trim();
      if (!nickname) return Promise.reject(new Error('昵称不能为空'));
      if (nickname.length > 30) return Promise.reject(new Error('昵称最长 30 个字符'));
      const self = this;
      const enc = encodeURIComponent(nickname);
      return this._req('GET', 'profiles?nickname=eq.' + enc + '&select=id,nickname,data')
        .then(function (rows) {
          if (rows && rows.length) return { userId: rows[0].id, data: rows[0].data || {} };
          return self._req('POST', 'profiles', { nickname: nickname, data: {} })
            .then(function (created) {
              const row = Array.isArray(created) ? created[0] : created;
              return { userId: row.id, data: row.data || {} };
            });
        })
        .then(function (res) {
          self.nickname = nickname;
          self.userId = res.userId;
          self._data = res.data || {};
          try { localStorage.setItem(NICK_KEY, nickname); localStorage.setItem(USERID_KEY, res.userId); } catch (e) {}
          return res;
        });
    },

    logout: function () {
      this.nickname = null;
      this.userId = null;
      this._data = null;
      try { localStorage.removeItem(NICK_KEY); localStorage.removeItem(USERID_KEY); } catch (e) {}
    },

    /* ---------- 数据收集 / 落盘 ---------- */
    /* 剥掉用户前缀（u_<userId>_xxx → xxx），便于按"业务 key 名"判断 */
    _stripPrefix: function (k) {
      return k.replace(/^u_[^_]+_/, '');
    },
    /* 判断某个 localStorage key 是否要同步上云（按剥前缀后的业务 key 判断） */
    _shouldSync: function (key) {
      const k = this._stripPrefix(key);
      if (k === NICK_KEY) return false;
      if (/archives|oplog/.test(k)) return false;   // 编辑辅助数据不同步
      return k.indexOf('v25_') === 0 || k.indexOf('v27_') === 0;
    },
    /* 收集本地所有可同步 key → { 业务key: value }（已剥前缀，云端按业务 key 存） */
    collect: function () {
      const map = {};
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || !this._shouldSync(k)) continue;
          map[this._stripPrefix(k)] = JSON.parse(localStorage.getItem(k));
        }
      } catch (e) {}
      return map;
    },
    /* 把云数据 map 写回本地 localStorage（按当前用户加前缀，userId 在登录后已设置） */
    applyToLocal: function (data) {
      const map = data || {};
      const prefix = 'u_' + (this.userId || 'unknown') + '_';
      Object.keys(map).forEach(function (k) {
        try { localStorage.setItem(prefix + k, JSON.stringify(map[k])); } catch (e) {}
      });
    },

    /* ---------- 推送（debounce，停止操作后自动） ---------- */
    markDirty: function () {
      if (!this.isLoggedIn()) return;
      clearTimeout(this._timer);
      this._timer = setTimeout(function () { Cloud.push(); }, PUSH_DELAY);
    },
    push: function () {
      if (!this.isLoggedIn()) return Promise.resolve();
      clearTimeout(this._timer);
      const data = this.collect();
      this._data = data;
      return this._req('PATCH', 'profiles?id=eq.' + this.userId, {
        data: data,
        updated_at: new Date().toISOString(),
      }).catch(function (err) {
        console.warn('[cloud] 推送失败，稍后重试：', err && err.message);
      });
    },

    /* 拉取云数据并写回本地（登录态） */
    pullAndApply: function () {
      if (!this.isLoggedIn()) return Promise.reject(new Error('未登录'));
      const self = this;
      return this._req('GET', 'profiles?id=eq.' + this.userId + '&select=id,nickname,data')
        .then(function (rows) {
          if (!rows || !rows.length) throw new Error('用户不存在');
          self._data = rows[0].data || {};
          self.applyToLocal(self._data);
          return self._data;
        });
    },
  };

  global.Cloud = Cloud;
})(window);

</script>
<script>
/* ============================================================
   store.js — 本地持久化（进度 / 主题 / 字体 / 题库档位 / 编辑存档）
   v2.7：新增「题库档位」概念，进度与编辑存档按当前档位分 key 存储，
        库1（完整版）沿用 v2.6 的 v25_ 老 key，保证老用户进度无缝迁移。
   v2.8：所有用户维度数据（v25_*/v27_*）按当前登录用户自动加前缀 u_<userId>_，
        实现多用户数据隔离。未登录用户保持原 key 命名（纯本地模式兼容）。
   ============================================================ */
(function (global) {
  'use strict';

  const KEY = {
    activeBank: 'v27_activeBanks', // 当前题库档位 1-4（null=未选过）
    dark: 'v25_dark',
    font: 'v25_font',
  };

  // 唯一不分用户的本地 key（跨用户保留"上次登录的昵称"提示）
  const NICK_KEY = 'v27_nickname';

  // 判定某个 key 是否属于「用户维度数据」（需要按用户隔离）
  const isUserKey = (k) => k !== NICK_KEY && (/^v25_/.test(k) || /^v27_/.test(k));

  // 当前登录用户的 key 前缀（未登录返回空）
  const userPrefix = () => {
    if (global.Cloud && Cloud.isLoggedIn() && Cloud.userId) return 'u_' + Cloud.userId + '_';
    return '';
  };

  const Store = {
    get: function (k, def) {
      try {
        const final = isUserKey(k) ? userPrefix() + k : k;
        const v = localStorage.getItem(final);
        return v === null ? def : JSON.parse(v);
      } catch (e) { return def; }
    },
    set: function (k, v) {
      try {
        const final = isUserKey(k) ? userPrefix() + k : k;
        localStorage.setItem(final, JSON.stringify(v));
      } catch (e) {}
      // 登录态下标记云端脏数据，稍后自动推送（见 cloud.js）
      if (global.Cloud) global.Cloud.markDirty();
    },
    getRaw: function (k) {
      try {
        const final = isUserKey(k) ? userPrefix() + k : k;
        return localStorage.getItem(final);
      } catch (e) { return null; }
    },
    setRaw: function (k, v) {
      try {
        const final = isUserKey(k) ? userPrefix() + k : k;
        localStorage.setItem(final, v);
      } catch (e) {}
    },
    key: KEY,

    /* ---- 动态 key（依赖 App.activeBank，库1 沿用老 key 兼容）---- */
    /* 这些方法返回「裸 key」，调用方需通过 Store.get/set 访问（自动加用户前缀） */
    progressKey: function () {
      const b = (global.App && App.activeBank) || 1;
      return b === 1 ? 'v25_progress' : 'v27_progress_' + b;
    },
    bankKey: function () {
      const b = (global.App && App.activeBank) || 1;
      return b === 1 ? 'v25_bank' : 'v27_bank_' + b;
    },
    archivesKey: function () {
      const b = (global.App && App.activeBank) || 1;
      return b === 1 ? 'v25_archives' : 'v27_archives_' + b;
    },
    oplogKey: function () {
      const b = (global.App && App.activeBank) || 1;
      return b === 1 ? 'v25_oplog' : 'v27_oplog_' + b;
    },

    /* ---- 用户维度辅助（外部需要直接构造带前缀 key 时使用）---- */
    isUserKey: isUserKey,
    userPrefix: userPrefix,
    /** 清空 localStorage 里所有带当前用户前缀的 key（切用户/退出登录时调用） */
    clearUserLocal: function () {
      const prefix = userPrefix();
      if (!prefix) return 0;
      const toRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(prefix) === 0) toRemove.push(k);
      }
      toRemove.forEach(k => localStorage.removeItem(k));
      return toRemove.length;
    },
    /** 清空所有用户维度数据（不论哪个用户，用于「重置所有」类操作） */
    clearAllUsersLocal: function () {
      const toRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && isUserKey(k)) toRemove.push(k);
      }
      toRemove.forEach(k => localStorage.removeItem(k));
      return toRemove.length;
    },
  };

  global.Store = Store;
})(window);
</script>
<script>
/* ============================================================
   flashcard.js — 抽背卡（测试模式）
   ============================================================ */
(function (global) {
  'use strict';

  const FC = {
    cards: [],          // 筛选后的卡片
    index: 0,
    flipped: false,
    completed: false,

    /* 生成星级 HTML（★实星 + ☆空星） */
    starHtml: function (card) {
      const n = card.star || 0;
      if (!n) return '';
      return ' <span class="stars" title="' + n + '星">' + '★'.repeat(n) + '<span class="stars-empty">' + '☆'.repeat(5 - n) + '</span></span>';
    },

    init: function (data) {
      this.cards = [];
      this.index = 0;
      this.flipped = false;
      this.completed = false;
      this._data = data;
    },

    /* 应用筛选（分类/搜索/薄弱/随机），由 App 传入条件 */
    filter: function (cond) {
      const data = this._data || [];
      let cards = [].concat(data);
      cards = cards.filter(c => App.starMatch(c)); // 必刷/拓展组合过滤
      if (cond.categories && cond.categories.length) {
        cards = cards.filter(c => cond.categories.indexOf(c.category) >= 0);
      }
      if (cond.weakOnly) {
        cards = cards.filter(c => App.getStatus(c.id).status === 'weak');
      }
      if (cond.keyword) {
        const kw = cond.keyword.toLowerCase();
        cards = cards.filter(c =>
          (c.question || '').toLowerCase().indexOf(kw) >= 0 ||
          (c.answer || '').toLowerCase().indexOf(kw) >= 0);
      }
      if (cond.random && cards.length > 1) {
        for (let i = cards.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = cards[i]; cards[i] = cards[j]; cards[j] = t;
        }
      }
      this.cards = cards;
      this.index = 0;
      this.flipped = false;
      this.completed = false;
      return cards;
    },

    current: function () { return this.cards[this.index]; },

    renderCard: function () {
      const total = this.cards.length;
      const el = document.getElementById('flashcard');
      const card = this.current();

      document.getElementById('progressText').textContent = '第 ' + (total ? this.index + 1 : 0) + ' / ' + total + ' 题';
      if (!card) {
        document.getElementById('cardQuestion').innerHTML = '暂无题目';
        document.getElementById('frontCategory').textContent = '无';
        document.getElementById('frontIndex').textContent = '第 0 题';
        el.classList.remove('flipped');
        return;
      }
      document.getElementById('cardQuestion').innerHTML = '<span class="q-inner">' + MD.renderQuestion(card.question) + '</span>';
      document.getElementById('frontCategory').textContent = card.category;
      document.getElementById('frontIndex').innerHTML = (card.code || '') + FC.starHtml(card);
      document.getElementById('cardAnswer').innerHTML = MD.renderMarkdown(card.answer);
      document.getElementById('backCategory').textContent = card.category;
      document.getElementById('backIndex').innerHTML = (card.code || '') + FC.starHtml(card);
      el.classList.toggle('flipped', this.flipped);

      const backWrapper = document.querySelector('.card-answer-wrapper');
      if (backWrapper) backWrapper.scrollTop = 0;
    },

    flip: function () {
      if (!this.cards.length || this.completed) return;
      this.flipped = !this.flipped;
      document.getElementById('flashcard').classList.toggle('flipped', this.flipped);
    },

    goPrev: function () {
      if (this.index > 0) { this.index--; this.flipped = false; this.renderCard(); }
    },
    goNext: function () {
      if (this.index < this.cards.length - 1) { this.index++; this.flipped = false; this.renderCard(); }
    },

    markAndNext: function (status) {
      if (!this.cards.length) return;
      const card = this.current();
      App.mark(card.id, status);
      App.updateStats();
      const isLast = this.index >= this.cards.length - 1;
      setTimeout(function () {
        if (!isLast) { FC.goNext(); }
        else { FC.completed = true; FC.flipped = false; FC.renderCard(); }
      }, 220);
    },

    shuffle: function () {
      if (this.cards.length > 1) {
        for (let i = this.cards.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = this.cards[i]; this.cards[i] = this.cards[j]; this.cards[j] = t;
        }
        this.index = 0; this.flipped = false; this.completed = false;
        this.renderCard();
      }
    },
  };

  global.FC = FC;
})(window);

</script>
<script>
/* ============================================================
   memo.js — 记背知识（学习模式）：分类分组 + 展开 + 知识扩展
   ============================================================ */
(function (global) {
  'use strict';

  const Memo = {
    render: function (cards) {
      const list = document.getElementById('memorizeList');
      const total = document.getElementById('memoTotal');
      if (!list) return;
      if (total) total.textContent = '共 ' + cards.length + ' 题';
      if (!cards.length) { list.innerHTML = '<div class="empty-state">🔍 没有符合条件的题目</div>'; return; }

      const groups = {}, order = [];
      cards.forEach(function (c) {
        if (!groups[c.category]) { groups[c.category] = []; order.push(c.category); }
        groups[c.category].push(c);
      });

      let html = '';
      // 仅筛选单个分类时，自动展开该分组，避免「看到分类名还要再点一次」
      const autoOpen = order.length === 1;
      order.forEach(function (cat) {
        const g = groups[cat];
        html += '<div class="memo-group' + (autoOpen ? ' open' : '') + '"><div class="memo-group-header"><span class="memo-group-name">' + cat + '</span><span class="memo-group-count">' + g.length + ' 题</span></div>';
        g.forEach(function (c) {
          const star = c.star ? '<span class="stars">' + '★'.repeat(c.star) + '</span> ' : '';
          const code = c.code ? '<span class="memo-item-code">' + c.code + '</span>' + star : '';
          const ext = c.extend ? '<div class="memo-item-extend"><div class="memo-extend-title">📚 知识扩展</div>' + MD.renderMarkdown(c.extend) + '</div>' : '';
          html += '<div class="memo-item">'
            + '<div class="memo-item-question">' + code + MD.renderQuestion(c.question) + '</div>'
            + '<div class="memo-item-answer card-answer">' + MD.renderMarkdown(c.answer) + ext + '</div>'
            + '</div>';
        });
        html += '</div>';
      });
      list.innerHTML = html;
    },

    toggleAll: function (expand) {
      // 同时控制「分组」与「题目答案」的展开/收起
      document.querySelectorAll('.memo-group').forEach(function (el) { el.classList.toggle('open', expand); });
      document.querySelectorAll('.memo-item').forEach(function (el) { el.classList.toggle('open', expand); });
    },
  };

  global.Memo = Memo;
})(window);

<script>
/* ============================================================
   editor.js — 编辑模式（CRUD + 操作日志 + 手动/自动存档 + 回滚）
   入口：URL ?edit=1
   持久化：localStorage.v25_bank（题库） / v25_archives（存档点） / v25_oplog（日志）
   ============================================================ */
(function (global) {
  'use strict';

  const Editor = {
    history: [],   // 操作日志 [{type, code, before, after}]
    redoStack: [],
    archives: [],
    editing: null, // 正在编辑的题 id
    step: 0,

    init: function () {
      this.history = Store.get(Store.oplogKey(), []);
      this.archives = Store.get(Store.archivesKey(), []);
      this.redoStack = [];
    },

    /* 记录操作日志（快照） */
    log: function (type, before, after, code) {
      this.history.push({ type, code: code || (after ? after.code : before.code), before: before ? JSON.parse(JSON.stringify(before)) : null, after: after ? JSON.parse(JSON.stringify(after)) : null, time: Date.now() });
      if (this.history.length > 200) this.history.shift();
      this.redoStack = [];
      Store.set(Store.oplogKey(), this.history);
      this.step++;
      // 自动存档：每 10 步
      if (this.step % 10 === 0) this.archive('自动存档（第 ' + this.step + ' 步）');
      this.saveBank();
    },

    /* 保存题库到 localStorage */
    saveBank: function () {
      Store.set(Store.bankKey(), App.data);
    },

    /* 存档点 */
    archive: function (note) {
      this.archives.push({ time: Date.now(), note: note || '手动存档', data: JSON.parse(JSON.stringify(App.data)) });
      if (this.archives.length > 30) this.archives.shift();
      Store.set(Store.archivesKey(), this.archives);
    },
    restore: function (idx) {
      const a = this.archives[idx];
      if (!a) return;
      if (!confirm('回滚到存档「' + a.note + '」（' + new Date(a.time).toLocaleString() + '）？当前未保存改动将丢失。')) return;
      App.data = JSON.parse(JSON.stringify(a.data));
      this.saveBank();
      App.reload();
      this.render();
      this.log('restore', null, null, '—');
    },

    /* 撤销 / 重做 */
    undo: function () {
      const op = this.history.pop();
      if (!op) return;
      this.redoStack.push(op);
      if (op.type === 'add') this._removeByCode(op.after.code);
      else if (op.type === 'delete') App.data.push(op.before);
      else if (op.type === 'edit') this._replace(op.after, op.before);
      else if (op.type === 'restore') { /* 忽略 */ }
      Store.set(Store.oplogKey(), this.history);
      this.saveBank();
      this._renumber();
      this.render();
    },
    redo: function () {
      const op = this.redoStack.pop();
      if (!op) return;
      this.history.push(op);
      if (op.type === 'add') App.data.push(op.after);
      else if (op.type === 'delete') this._removeByCode(op.before.code);
      else if (op.type === 'edit') this._replace(op.before, op.after);
      Store.set(Store.oplogKey(), this.history);
      this.saveBank();
      this._renumber();
      this.render();
    },

    _removeByCode: function (code) { App.data = App.data.filter(c => c.code !== code); },
    _replace: function (oldItem, newItem) {
      const i = App.data.findIndex(c => c.code === oldItem.code);
      if (i > -1 && newItem) App.data[i] = newItem;
      else if (i > -1) App.data.splice(i, 1);
    },
    _renumber: function () {
      App.data.forEach((c, i) => c.id = i + 1);
    },

    /* ---------- 渲染 ---------- */
    render: function () {
      const box = document.getElementById('editorView');
      if (!box) return;
      const cards = App.data;
      let rows = '';
      cards.forEach(c => {
        rows += '<div class="ed-row">'
          + '<span class="ed-code">' + (c.code || '') + '</span>'
          + '<span class="ed-cat">' + (c.category || '') + '</span>'
          + '<span class="ed-q">' + esc((c.question || '').slice(0, 40)) + '</span>'
          + '<span class="ed-ops"><button class="ed-btn" data-act="edit" data-code="' + c.code + '">✏️</button><button class="ed-btn danger" data-act="del" data-code="' + c.code + '">🗑</button></span>'
          + '</div>';
      });

      const form = this.editing ? this._formHtml(this.editing) : '';

      box.innerHTML = '<div class="ed-toolbar">'
        + '<button class="btn primary" id="edAdd">➕ 新增题目</button>'
        + '<button class="btn" id="edBankSwitch">📚 切换题库</button>'
        + '<button class="btn" id="edUndo">↩️ 撤销</button>'
        + '<button class="btn" id="edRedo">↪️ 重做</button>'
        + '<button class="btn" id="edArchive">💾 手动存档</button>'
        + '<button class="btn" id="edExport">⬇️ 导出JSON</button>'
        + '<button class="btn" id="edImport">⬆️ 导入JSON</button>'
        + '<button class="btn" id="edReset">♻️ 恢复内置题库</button>'
        + '<span class="ed-note">共 ' + cards.length + ' 题 · 操作日志 ' + this.history.length + ' 条 · 存档点 ' + this.archives.length + ' 个</span>'
        + '</div>'
        + form
        + '<div class="ed-list">' + rows + '</div>'
        + '<div class="ed-archives"><h4>存档点（点击回滚）</h4>'
        + (this.archives.length ? this.archives.map((a, i) => '<button class="btn" data-arch="' + i + '">' + new Date(a.time).toLocaleString() + ' · ' + esc(a.note || '') + '</button>').join('') : '<span class="muted">暂无存档点</span>')
        + '</div>';

      this._bind();
    },

    _formHtml: function (item) {
      return '<div class="ed-form"><h4>' + (item._isNew ? '新增题目' : '编辑题目') + '</h4>'
        + '<label>题码 <input id="f-code" value="' + esc(item.code || '') + '"></label>'
        + '<label>分类 <input id="f-cat" value="' + esc(item.category || '') + '" list="cat-list"></label>'
        + '<datalist id="cat-list">' + App.getAllCategories().map(c => '<option value="' + esc(c) + '">').join('') + '</datalist>'
        + '<label>题目 <textarea id="f-q" rows="2">' + esc(item.question || '') + '</textarea></label>'
        + '<label>答案（markdown）<textarea id="f-a" rows="6">' + esc(item.answer || '') + '</textarea></label>'
        + '<label>扩展 <textarea id="f-e" rows="3">' + esc(item.extend || '') + '</textarea></label>'
        + '<div class="ed-form-ops"><button class="btn primary" id="f-save">保存</button><button class="btn" id="f-cancel">取消</button></div>'
        + '</div>';
    },

    _bind: function () {
      const box = document.getElementById('editorView');
      box.querySelectorAll('.ed-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const code = btn.dataset.code;
          if (btn.dataset.act === 'edit') this.openEdit(code);
          else if (btn.dataset.act === 'del') this.del(code);
        });
      });
      const add = document.getElementById('edAdd');
      if (add) add.addEventListener('click', () => { this.editing = { _isNew: true, code: '', category: '', question: '', answer: '', extend: '' }; this.render(); });
      const bankSwitch = document.getElementById('edBankSwitch');
      if (bankSwitch) bankSwitch.addEventListener('click', () => App.openBankPicker());
      const undo = document.getElementById('edUndo'); if (undo) undo.addEventListener('click', () => this.undo());
      const redo = document.getElementById('edRedo'); if (redo) redo.addEventListener('click', () => this.redo());
      const archive = document.getElementById('edArchive'); if (archive) archive.addEventListener('click', () => { const n = prompt('存档备注（可选）：', '手动存档'); this.archive(n || '手动存档'); this.render(); });
      const exp = document.getElementById('edExport'); if (exp) exp.addEventListener('click', () => App.download(JSON.stringify(App.data, null, 2), 'questions-edit.json', 'application/json'));
      const imp = document.getElementById('edImport'); if (imp) imp.addEventListener('click', () => this._import());
      const reset = document.getElementById('edReset'); if (reset) reset.addEventListener('click', () => { if (confirm('恢复内置题库？所有编辑将丢失。')) { Store.set(Store.bankKey(), []); App.data = JSON.parse(JSON.stringify(App.builtin)); this.saveBank(); App.reload(); this.render(); } });
      box.querySelectorAll('[data-arch]').forEach(b => b.addEventListener('click', () => this.restore(parseInt(b.dataset.arch, 10))));
      const save = document.getElementById('f-save'); if (save) save.addEventListener('click', () => this.save());
      const cancel = document.getElementById('f-cancel'); if (cancel) cancel.addEventListener('click', () => { this.editing = null; this.render(); });
    },

    _import: function () {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.json';
      input.onchange = () => {
        const f = input.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const list = JSON.parse(r.result);
            if (!Array.isArray(list)) throw new Error('非数组');
            this.archive('导入前存档');
            App.data = list;
            this._renumber();
            this.saveBank();
            this.log('import', null, null, '—');
            App.reload();
            this.render();
          } catch (e) { alert('导入失败：' + e.message); }
        };
        r.readAsText(f);
      };
      input.click();
    },

    openEdit: function (code) {
      const item = App.data.find(c => c.code === code);
      if (item) { this.editing = JSON.parse(JSON.stringify(item)); this.render(); }
    },

    save: function () {
      const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
      const code = g('f-code'), cat = g('f-cat'), q = g('f-q'), a = g('f-a'), e = g('f-e');
      if (!code || !q || !a) { alert('题码/题目/答案不能为空'); return; }
      const newItem = { code, category: cat, question: q, answer: a, extend: e, source: 'edited' };

      if (this.editing && this.editing._isNew) {
        if (App.data.some(c => c.code === code)) { alert('题码已存在：' + code); return; }
        const before = null;
        newItem.id = App.data.length + 1;
        App.data.push(newItem);
        this.log('add', before, newItem);
      } else {
        const old = App.data.find(c => c.code === this.editing.code);
        if (old && code !== old.code && App.data.some(c => c.code === code)) { alert('题码已存在：' + code); return; }
        const before = JSON.parse(JSON.stringify(old));
        Object.assign(old, newItem);
        this.log('edit', before, JSON.parse(JSON.stringify(old)));
      }
      this._renumber();
      this.saveBank();
      this.editing = null;
      App.reload();
      this.render();
    },

    del: function (code) {
      const item = App.data.find(c => c.code === code);
      if (!item) return;
      if (!confirm('删除题目「' + item.question.slice(0, 30) + '」？')) return;
      App.data = App.data.filter(c => c.code !== code);
      this._renumber();
      this.log('delete', item, null);
      this.saveBank();
      this.render();
    },
  };

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  global.Editor = Editor;
})(window);

</script>
<script>
/* ============================================================
   app.js — 主控制器：状态管理 · 模式切换 · 初始化 · 事件绑定
   ============================================================ */
(function (global) {
  'use strict';

  const App = {
    data: [],             // 全量题库（当前生效）
    builtin: [],          // 内置题库（合并后的 bank>=activeBank 题集）
    banks: null,          // 分档题集 {1:[],2:[],3:[],4:[]}（单档，无重叠）
    bankMeta: {},         // { total, counts:{1:244,2:209,3:174,4:95} }
    activeBank: 1,        // 当前题库档位 1-4（1=完整 4=极简）
    mode: 'flash',        // flash | memo | guide | editor
    selectedCategories: [],
    keyword: '',
    weakOnly: false,
    random: true,
    includeCore: true,     // 必刷题(4-5星)，默认开
    includeExtra: false,   // 拓展题(1-3星)，默认关
    progress: {},
    fontScale: 1,

    /* 星级匹配：必刷=4-5星，拓展=1-3星；两开关组合决定范围 */
    starMatch: function (c) {
      const core = (c.star || 4) >= 4;
      const extra = (c.star || 4) <= 3;
      if (this.includeCore && this.includeExtra) return true; // 都选 = 完整题库
      if (this.includeCore) return core;   // 只选必刷
      if (this.includeExtra) return extra; // 只选拓展
      return false;                        // 都不选 = 空
    },

    /* ---------- 进度 ---------- */
    loadProgress: function () {
      this.progress = Store.get(Store.progressKey(), {});
    },
    saveProgress: function () {
      Store.set(Store.progressKey(), this.progress);
    },
    getStatus: function (id) { return this.progress[id] || { status: 'new', count: 0 }; },
    mark: function (id, status) {
      this.progress[id] = { status: status, count: (this.progress[id] ? this.progress[id].count : 0) + 1, time: Date.now() };
      this.saveProgress();
    },
    resetAll: function () { this.progress = {}; this.saveProgress(); this.updateStats(); },

    updateStats: function () {
      const all = this.data.length;
      let mastered = 0, weak = 0;
      this.data.forEach(c => { const s = this.getStatus(c.id).status; if (s === 'mastered') mastered++; else if (s === 'weak') weak++; });
      const learned = mastered + weak, unlearned = all - learned;
      const set = function (id, v) { const el = document.getElementById(id); if (el) el.textContent = v; };
      set('totalCount', '总计: ' + all);
      set('masteredCount', '已掌握: ' + mastered);
      set('weakCount', '薄弱: ' + weak);
      set('unlearnedCount', '未学: ' + unlearned);
      const fill = document.getElementById('progressFill');
      if (fill) fill.style.width = (all ? Math.round(learned / all * 100) : 0) + '%';
    },

    /* ---------- 分类 ---------- */
    getAllCategories: function () {
      const s = new Set();
      this.data.forEach(c => c.category && s.add(c.category));
      return Array.from(s);
    },
    renderCategories: function () {
      const bar = document.getElementById('categoryBar');
      bar.innerHTML = '';
      const all = document.createElement('span');
      all.className = 'category-tag active'; all.textContent = '全部';
      all.onclick = () => App.selectCategory('');
      bar.appendChild(all);
      this.getAllCategories().forEach(cat => {
        const t = document.createElement('span');
        t.className = 'category-tag'; t.textContent = cat;
        t.onclick = () => App.selectCategory(cat);
        bar.appendChild(t);
      });
    },
    selectCategory: function (cat) {
      if (!cat) this.selectedCategories = [];
      else {
        const i = this.selectedCategories.indexOf(cat);
        if (i > -1) this.selectedCategories.splice(i, 1);
        else this.selectedCategories.push(cat);
      }
      this.updateCategoryUI();
      this.refresh();
    },
    updateCategoryUI: function () {
      document.querySelectorAll('.category-tag').forEach(tag => {
        const c = tag.textContent === '全部' ? '' : tag.textContent;
        tag.classList.toggle('active', c === '' ? this.selectedCategories.length === 0 : this.selectedCategories.indexOf(c) >= 0);
      });
      // 更新分类按钮上的计数
      const count = document.getElementById('filterCount');
      if (count) count.textContent = this.selectedCategories.length ? '(' + this.selectedCategories.length + ')' : '';
      const trig = document.getElementById('filterTriggerBtn');
      if (trig) trig.classList.toggle('active', this.selectedCategories.length > 0);
    },

    /* ---------- 筛选 ---------- */
    cond: function () {
      return { categories: this.selectedCategories, keyword: this.keyword, weakOnly: this.weakOnly, random: this.random, includeCore: this.includeCore, includeExtra: this.includeExtra };
    },

    /* ---------- 模式切换 ---------- */
    switchMode: function (mode) {
      this.mode = mode;
      document.body.classList.toggle('mode-memo', mode === 'memo');
      document.body.classList.toggle('mode-guide', mode === 'guide');
      document.body.classList.toggle('mode-editor', mode === 'editor');
      ['flash', 'memo', 'guide', 'editor'].forEach(m => {
        const tab = document.getElementById('mode' + m[0].toUpperCase() + m.slice(1) + 'Btn');
        if (tab) tab.classList.toggle('active', m === mode);
        const view = document.getElementById(m + 'View');
        if (view) view.classList.toggle('active', m === mode);
      });
      this.refresh();
    },

    /* ---------- 刷新当前视图 ---------- */
    refresh: function () {
      if (this.mode === 'memo') {
        Memo.render(this.filteredCards());
      } else if (this.mode === 'guide') {
        Guide.render();
      } else if (this.mode === 'editor') {
        Editor.render();
      } else {
        const cards = FC.filter(this.cond());
        FC.renderCard();
        this.updateStats();
      }
    },

    filteredCards: function () {
      let cards = [].concat(this.data).filter(c => this.starMatch(c));
      if (this.selectedCategories.length) cards = cards.filter(c => this.selectedCategories.indexOf(c.category) >= 0);
      if (this.weakOnly) cards = cards.filter(c => this.getStatus(c.id).status === 'weak');
      if (this.keyword) {
        const kw = this.keyword.toLowerCase();
        cards = cards.filter(c => (c.question || '').toLowerCase().indexOf(kw) >= 0 || (c.answer || '').toLowerCase().indexOf(kw) >= 0);
      }
      return cards;
    },

    /* ---------- 主题 / 字体 ---------- */
    applyTheme: function () {
      const dark = Store.get(Store.key.dark, false);
      document.body.classList.toggle('dark-mode', !!dark);
      const btn = document.getElementById('themeBtn');
      if (btn) btn.textContent = dark ? '☀️' : '🌙';
    },
    toggleTheme: function () {
      const dark = !document.body.classList.contains('dark-mode');
      document.body.classList.toggle('dark-mode', dark);
      Store.set(Store.key.dark, dark);
      const btn = document.getElementById('themeBtn');
      if (btn) btn.textContent = dark ? '☀️' : '🌙';
    },
    applyFont: function () {
      document.documentElement.style.fontSize = (16 * this.fontScale) + 'px';
      const label = document.getElementById('fontSizeLabel');
      if (label) label.textContent = Math.round(this.fontScale * 100) + '%';
    },
    changeFont: function (d) {
      this.fontScale = Math.min(1.5, Math.max(0.8, Math.round((this.fontScale + d) * 10) / 10));
      Store.set(Store.key.font, this.fontScale);
      this.applyFont();
    },

    /* ---------- 导出 ---------- */
    getWeakList: function () {
      return this.data.filter(c => this.getStatus(c.id).status === 'weak');
    },

    /* ---------- 联动跳转（指导页） ---------- */
    gotoCategory: function (cat) {
      this.keyword = '';
      this.weakOnly = false;
      this.selectedCategories = [cat];
      const si = document.getElementById('searchInput'); if (si) si.value = '';
      const wt = document.getElementById('weakOnlyToggle'); if (wt) wt.checked = false;
      this.updateCategoryUI();
      this.switchMode('flash');
    },
    startWeakDrill: function () {
      this.keyword = '';
      this.selectedCategories = [];
      const si = document.getElementById('searchInput'); if (si) si.value = '';
      this.weakOnly = true;
      const wt = document.getElementById('weakOnlyToggle'); if (wt) wt.checked = true;
      this.updateCategoryUI();
      this.switchMode('flash');
    },

    exportJson: function () {
      const list = this.getWeakList();
      if (!list.length) { alert('当前没有薄弱题'); return; }
      App.download(JSON.stringify(list, null, 2), '薄弱题.json', 'application/json');
    },
    exportTxt: function () {
      const list = this.getWeakList();
      if (!list.length) { alert('当前没有薄弱题'); return; }
      let txt = '';
      list.forEach((c, i) => {
        txt += '【第' + (i + 1) + '题】' + c.question + '\n【分类】' + (c.category || '') + '\n【答案】\n' + (c.answer || '').replace(/[*#`|>-]/g, '') + '\n\n' + '='.repeat(50) + '\n\n';
      });
      App.download(txt, '薄弱题.txt', 'text/plain');
    },
    download: function (content, filename, type) {
      const blob = new Blob([content], { type: type + ';charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },

    /* ---------- 题库档位 ---------- */
    /* 合并 bank>=n 的单档题，按 id 升序 */
    mergeBanks: function (n) {
      const out = [];
      for (let b = 4; b >= n; b--) {
        const arr = (this.banks && this.banks[b]) || [];
        for (let i = 0; i < arr.length; i++) out.push(arr[i]);
      }
      out.sort((a, b) => (a.id || 0) - (b.id || 0));
      return out;
    },

    /* 应用当前档位：合并题集 + 覆盖编辑存档判断 + 重载进度 */
    applyActiveBank: function (saved) {
      const n = this.activeBank || 1;
      this.builtin = this.banks ? this.mergeBanks(n) : [];
      this.data = (saved && saved.length) ? saved : this.builtin;
      this.loadProgress();
    },

    /* 打开选择题库弹窗（首次 or 编辑模式手动触发） */
    openBankPicker: function () {
      const mask = document.getElementById('bankPicker');
      if (!mask) return;
      const counts = (this.bankMeta && this.bankMeta.counts) || { 1: 244, 2: 209, 3: 174, 4: 95 };
      const names = { 1: '库1 完整版', 2: '库2 标准版', 3: '库3 精简版', 4: '库4 极简版' };
      const desc = { 1: '必刷+拓展全量，无删减', 2: '去冷门与细微分枝', 3: '只留主干高频', 4: '面试冲刺最核心' };
      const cur = this.activeBank || 1;
      const box = document.getElementById('bankOptions');
      box.innerHTML = [1, 2, 3, 4].map(function (b) {
        return '<label class="bank-option' + (b === cur ? ' active' : '') + '">'
          + '<input type="radio" name="bankChoice" value="' + b + '"' + (b === cur ? ' checked' : '') + '>'
          + '<span class="bank-option-title">' + names[b] + '</span>'
          + '<span class="bank-option-count">' + (counts[b] != null ? counts[b] : '?') + ' 题</span>'
          + '<span class="bank-option-desc">' + desc[b] + '</span>'
          + '</label>';
      }).join('');
      mask.style.display = 'flex';
      box.querySelectorAll('input[name="bankChoice"]').forEach(function (r) {
        r.addEventListener('change', function () {
          box.querySelectorAll('.bank-option').forEach(function (o) { o.classList.remove('active'); });
          const opt = r.closest('.bank-option'); if (opt) opt.classList.add('active');
        });
      });
    },

    confirmBankPicker: function () {
      const r = document.querySelector('input[name="bankChoice"]:checked');
      const n = r ? parseInt(r.value, 10) : 1;
      const changed = n !== this.activeBank;
      this.activeBank = n;
      Store.set(Store.key.activeBank, n);
      const saved = Store.get(Store.bankKey(), null);
      this.applyActiveBank(saved);
      const mask = document.getElementById('bankPicker');
      if (mask) mask.style.display = 'none';
      this.reload();
      if (changed) {
        const names = { 1: '库1 完整版', 2: '库2 标准版', 3: '库3 精简版', 4: '库4 极简版' };
        const hint = document.getElementById('bankToast');
        if (hint) { hint.textContent = '已切换至 ' + names[n] + '（' + this.data.length + ' 题）'; hint.classList.add('show'); setTimeout(function () { hint.classList.remove('show'); }, 2500); }
      }
    },

    cancelBankPicker: function () {
      const mask = document.getElementById('bankPicker');
      if (mask) mask.style.display = 'none';
    },

    /* ---------- 云端登录（Supabase，简单昵称） ---------- */
    updateLoginUI: function () {
      const btn = document.getElementById('loginBtn');
      if (!btn) return;
      if (Cloud.isLoggedIn()) {
        btn.textContent = '👤 ' + Cloud.getNickname();
        btn.title = '已登录（云端同步中），点击切换账号或退出';
        btn.classList.add('logged-in');
      } else {
        btn.textContent = '🔑 登录';
        btn.title = '登录后学习进度可云端同步、跨设备恢复';
        btn.classList.remove('logged-in');
      }
    },

    openLogin: function () {
      const mask = document.getElementById('loginPicker');
      if (!mask) return;
      const input = document.getElementById('loginNick');
      if (input) input.value = Cloud.getNickname() || '';
      const logoutBtn = document.getElementById('loginLogout');
      if (logoutBtn) logoutBtn.style.display = Cloud.isLoggedIn() ? '' : 'none';
      mask.style.display = 'flex';
      if (input) setTimeout(function () { input.focus(); }, 50);
    },
    closeLogin: function () {
      const mask = document.getElementById('loginPicker');
      if (mask) mask.style.display = 'none';
    },
    confirmLogin: function () {
      const input = document.getElementById('loginNick');
      const nick = input ? input.value.trim() : '';
      if (!nick) { alert('请输入昵称'); return; }
      const btn = document.getElementById('loginConfirm');
      const originText = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = '登录中…'; }
      Cloud.login(nick)
        .then(function (res) {
          // ★ 切用户前：清空本地所有「带用户前缀」的旧 key，避免新用户继承旧用户的进度/编辑题库
          Store.clearAllUsersLocal();
          // 云有数据 → 覆盖本地（applyToLocal 会按当前 userId 加前缀写入）；云空 → 本地为空
          if (res.data && Object.keys(res.data).length) {
            Cloud.applyToLocal(res.data);
          } else {
            // 新用户：把当前干净的 localStorage 状态推上云（其实为空）
            Cloud.markDirty();
          }
          location.reload();
        })
        .catch(function (err) {
          alert('登录失败：' + (err && err.message ? err.message : err));
          if (btn) { btn.disabled = false; btn.textContent = originText; }
        });
    },
    doLogout: function () {
      if (!confirm('退出登录？\n\n· 你的数据仍保存在本地与云端，不会删除\n· 退出后本页面将以「本地数据」继续使用')) return;
      Cloud.logout();
      location.reload();
    },

    /* ---------- 初始化 ---------- */
    init: function () {
      Cloud.init();

      // 主题字体（本地，立即应用）
      this.fontScale = Store.get(Store.key.font, 1);
      this.applyTheme();
      this.applyFont();

      const boot = () => {
        // 读取档位（null=首次，未选过）
        const bankVal = Store.get(Store.key.activeBank, null);
        App.activeBank = (bankVal == null) ? 1 : bankVal;
        const isFirst = bankVal == null;

        const saved = Store.get(Store.bankKey(), null);

        // 内联 banks（单文件版）直接进入；否则走分片加载
        if (global.__FC_BANKS) {
          App.banks = global.__FC_BANKS;
          App.bankMeta = global.__FC_BANK_META || {};
          App.applyActiveBank(saved);
          App.afterDataReady(isFirst);
        } else {
          Loader.load({
            onProgress: function (loaded, total, msg) {
              const m = document.getElementById('loadingMsg');
              if (m) m.textContent = msg + ' (' + loaded + '/' + total + ')';
            },
            onDone: function (banks, meta) {
              App.banks = banks;
              App.bankMeta = meta || {};
              App.applyActiveBank(saved);
              App.afterDataReady(isFirst);
            },
            onFail: function (err) {
              const m = document.getElementById('loadingMsg');
              if (m) m.textContent = err;
            },
          });
        }
      };

      // 已登录：先从云拉最新数据覆盖本地再启动；失败/未登录则直接用本地
      if (Cloud.isLoggedIn()) {
        Cloud.pullAndApply().then(boot, boot);
      } else {
        boot();
      }
    },

    afterDataReady: function (isFirst) {
      if (this._ready) return; // 防止重复初始化
      this._ready = true;
      FC.init(this.data);
      this.renderCategories();
      this.bindEvents();
      this.updateStats();
      this.updateLoginUI();
      this.refresh();
      const dl = document.getElementById('dataLoading');
      if (dl) dl.style.display = 'none';
      // 编辑模式入口 ?edit=1
      if (/[?&]edit=1/.test(location.search)) this.switchMode('editor');
      // 首次打开：弹题库选择（数据就绪后再弹，确保 meta 可用）
      if (isFirst) this.openBankPicker();
    },

    /* 数据变化后刷新（编辑模式增删改/回滚后调用，不重复绑事件） */
    reload: function () {
      FC.init(this.data);
      this.renderCategories();
      this.updateStats();
      this.refresh();
    },

    bindEvents: function () {
      // 卡片翻转
      document.getElementById('cardFront').addEventListener('click', () => FC.flip());
      document.querySelector('.card-answer-wrapper').addEventListener('click', () => FC.flip());
      document.getElementById('prevBtn').addEventListener('click', () => FC.goPrev());
      document.getElementById('nextBtn').addEventListener('click', () => FC.goNext());
      document.getElementById('shuffleBtn').addEventListener('click', () => FC.shuffle());
      document.getElementById('themeBtn').addEventListener('click', () => App.toggleTheme());
      document.getElementById('knowBtn').addEventListener('click', e => { e.stopPropagation(); FC.markAndNext('mastered'); });
      document.getElementById('unknownBtn').addEventListener('click', e => { e.stopPropagation(); FC.markAndNext('weak'); });

      // 模式切换
      document.getElementById('modeFlashBtn').addEventListener('click', () => App.switchMode('flash'));
      document.getElementById('modeMemoBtn').addEventListener('click', () => App.switchMode('memo'));
      document.getElementById('modeGuideBtn').addEventListener('click', () => App.switchMode('guide'));
      const eb = document.getElementById('modeEditorBtn');
      if (eb) eb.addEventListener('click', () => App.switchMode('editor'));

      // 分类弹层开关
      const ft = document.getElementById('filterTriggerBtn');
      const cp = document.getElementById('categoryPop');
      const cc = document.getElementById('categoryPopClose');
      if (ft && cp) {
        ft.addEventListener('click', e => { e.stopPropagation(); cp.classList.toggle('open'); });
        if (cc) cc.addEventListener('click', e => { e.stopPropagation(); cp.classList.remove('open'); });
        document.addEventListener('click', e => {
          if (cp.classList.contains('open') && !cp.contains(e.target) && !ft.contains(e.target)) cp.classList.remove('open');
        });
      }

      // 记背展开
      document.getElementById('memorizeList').addEventListener('click', function (e) {
        const hdr = e.target.closest('.memo-group-header');
        if (hdr) { hdr.parentElement.classList.toggle('open'); return; }
        // 仅点击题目文字行才展开/收起答案，避免点击答案内部（如代码块/链接）时误收起
        const q = e.target.closest('.memo-item-question');
        if (q) q.parentElement.classList.toggle('open');
      });
      document.getElementById('memoExpandAllBtn').addEventListener('click', () => Memo.toggleAll(true));
      document.getElementById('memoCollapseAllBtn').addEventListener('click', () => Memo.toggleAll(false));

      // 字体
      document.getElementById('fontDownBtn').addEventListener('click', () => App.changeFont(-0.1));
      document.getElementById('fontUpBtn').addEventListener('click', () => App.changeFont(0.1));

      // 搜索
      let timer;
      document.getElementById('searchInput').addEventListener('input', e => {
        clearTimeout(timer);
        timer = setTimeout(() => { App.keyword = e.target.value.trim(); App.refresh(); }, 250);
      });
      document.getElementById('weakOnlyToggle').addEventListener('change', e => { App.weakOnly = e.target.checked; App.refresh(); });
      document.getElementById('randomToggle').addEventListener('change', e => { App.random = e.target.checked; App.refresh(); });
      const coreToggle = document.getElementById('coreToggle');
      if (coreToggle) coreToggle.addEventListener('change', e => { App.includeCore = e.target.checked; App.refresh(); });
      const extraToggle = document.getElementById('extraToggle');
      if (extraToggle) extraToggle.addEventListener('change', e => { App.includeExtra = e.target.checked; App.refresh(); });

      // 导出
      document.getElementById('exportJsonBtn').addEventListener('click', () => App.exportJson());
      document.getElementById('exportTxtBtn').addEventListener('click', () => App.exportTxt());
      document.getElementById('resetBtn').addEventListener('click', () => { if (confirm('确定重置所有学习进度吗？此操作不可撤销。')) App.resetAll(); });

      // 题库选择弹窗
      const bpc = document.getElementById('bankPickerConfirm');
      if (bpc) bpc.addEventListener('click', () => App.confirmBankPicker());
      const bpx = document.getElementById('bankPickerCancel');
      if (bpx) bpx.addEventListener('click', () => App.cancelBankPicker());

      // 登录按钮 / 登录弹窗
      const loginBtn = document.getElementById('loginBtn');
      if (loginBtn) loginBtn.addEventListener('click', () => {
        if (Cloud.isLoggedIn()) {
          if (confirm('当前已登录「' + Cloud.getNickname() + '」。\n\n确定 = 退出登录\n取消 = 切换账号')) App.doLogout();
          else App.openLogin();
        } else {
          App.openLogin();
        }
      });
      const lc = document.getElementById('loginConfirm');
      if (lc) lc.addEventListener('click', () => App.confirmLogin());
      const lx = document.getElementById('loginCancel');
      if (lx) lx.addEventListener('click', () => App.closeLogin());
      const lo = document.getElementById('loginLogout');
      if (lo) lo.addEventListener('click', () => App.doLogout());
      const li = document.getElementById('loginNick');
      if (li) li.addEventListener('keydown', e => { if (e.key === 'Enter') App.confirmLogin(); });

      // 键盘
      document.addEventListener('keydown', e => {
        const tag = e.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        switch (e.code) {
          case 'Space': e.preventDefault(); if (App.mode === 'flash') FC.flip(); break;
          case 'ArrowLeft': e.preventDefault(); if (App.mode === 'flash') FC.goPrev(); break;
          case 'ArrowRight': e.preventDefault(); if (App.mode === 'flash') FC.goNext(); break;
          case 'KeyG': if (FC.flipped) { e.preventDefault(); FC.markAndNext('mastered'); } break;
          case 'KeyB': if (FC.flipped) { e.preventDefault(); FC.markAndNext('weak'); } break;
          case 'KeyM': e.preventDefault(); {
            const order = ['flash', 'memo', 'guide', 'editor'];
            const ni = (order.indexOf(App.mode) + 1) % order.length;
            App.switchMode(order[ni]);
          } break;
        }
      });

      // 移动端滑动
      let sx = null;
      const swipeEl = document.querySelector('.card-wrapper');
      swipeEl.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
      swipeEl.addEventListener('touchend', e => {
        if (sx === null) return;
        const dx = e.changedTouches[0].clientX - sx; sx = null;
        if (Math.abs(dx) < 60) return;
        if (dx < 0) FC.goNext(); else FC.goPrev();
      }, { passive: true });
    },
  };

  global.App = App;
})(window);

</script>
