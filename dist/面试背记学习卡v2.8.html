加载完整登录环境(家目录/PATH等)。\n**代码：**\n```bash\nsu root       # 仅获得root权限\nsu - root     # 完整登录环境\n```\n**易错：** 混用导致命令找不到(PATH差异)；频繁切root不如sudo安全；exit退回原用户。\n**面试追问：** sudo -s/sudo -i与su的区别；环境变量PATH是否更新是核心考点。","source":"v2.4-reimport","star":3,"bank":3},{"id":445,"code":"LNX-24","category":"Linux","question":"find命令的用法？","answer":"**作用：** find指令从指定目录向下递归遍历其各个子目录，将满足条件的文件显示在终端。\n\n**基本语法：** find [搜索范围] [选项]\n\n**常用选项：**\n- -name 文件名：按文件名查找（支持通配符），如 find ./ -name \"*.txt\"\n- -user 用户名：查找属于指定用户的所有文件，如 find ./ -user \"wukong\"\n- -size 大小：按文件大小查找，单位c(字节)、k、M、G；+n大于、-n小于、n等于，如 find ./ -size \"+200c\"查找大于200字节的文件","extend":"**补充：** find [范围] -name/-user/-size按文件名/属主/大小查找，支持通配符。\n**代码：**\n```bash\nfind ./ -name '*.txt'\nfind ./ -user 'wukong'\nfind ./ -size +200c   # 大于200字节\n```\n**易错：** size单位c字节/k/M/G；+n大于、-n小于、n等于；-name区分大小写(-iname忽略)。\n**面试追问：** find与管道grep组合过滤；find -mtime -7找7天内修改文件；find ... -exec rm {} 批量删除。","source":"v2.4-reimport","star":3,"bank":3},{"id":446,"code":"LNX-25","category":"Linux","question":"crontab定时任务的格式和特殊符号？","answer":"**基本语法：** crontab -e编辑定时任务、-l查询任务、-r删除当前用户所有任务\n\n**时间格式：** 五个字段：分 时 日 月 周\n- 分钟（0-59）、小时（0-23）、一个月中的第几天（1-31）、月份（1-12）、星期几（0-7，0和7都代表星期日）\n\n**特殊符号：**\n- *：代表任何时间\n- ,：代表不连续的时间（如 0 8,12,16 每天8点、12点、16点）\n- -：代表连续的时间范围（如 1-6）\n- */n：代表每隔多久执行一次（如 */10 每10分钟）\n\n**示例：**\n- 45 22 * * *：每天22:45\n- 0 17 * * 1：每周一17:00\n- 0 5 1,15 * *：每月1号和15号05:00\n- */10 4 * * *：每天4点，每10分钟一次\n\n**注意：** 星期几和几号最好不要同时出现，因为他们定义的都是天，容易造成混乱","extend":"**补充：** crontab五字段=分 时 日 月 周；特殊符号*(任意)、,(不连续)、-(范围)、*/n(每隔)。\n**代码：**\n```bash\n45 22 * * *      # 每天22:45\n0 17 * * 1       # 每周一17:00\n*/10 4 * * *     # 每天4点每10分钟\n```\n**易错：** 星期0和7都表示周日；日与周同时出现易混乱，最好只用一种；crontab -e编辑/-l查看/-r删除。\n**面试追问：** 大模型训练/数据备份脚本常挂crontab；cron环境PATH不继承需写绝对路径；任务输出重定向到日志文件。","source":"v2.4-reimport","star":3,"bank":3},{"id":447,"code":"LNX-26","category":"Linux","question":"df、du、basename、dirname的用法？","answer":"**df -h：** 列出文件系统的整体磁盘使用量（-h以GB、MB、KB等易读格式显示）\n**du -a：** 显示每个文件和目录的磁盘使用空间（-a显示当前目录下所有的文件、目录及子目录大小）\n\n**basename：** 删掉路径的所有前缀（包括最后一个/），显示文件名部分\n- basename /home/weihongjun/project/mytest3.txt → mytest3.txt\n- basename /home/weihongjun/project/mytest3.txt .txt → mytest3（指定后缀则去掉后缀）\n\n**dirname：** 从绝对路径中去除文件名，返回目录部分\n- dirname /home/weihongjun/project/mytest3.txt → /home/weihongjun/project","extend":"**代码：**\n```bash\ndf -h               # 磁盘整体使用量(易读格式)\ndu -sh 目录          # 目录总大小\ndu -a               # 每个文件/目录明细\nbasename /a/b/c.txt # 输出 c.txt\nc dirname /a/b/c.txt # 输出 /a/b\n```\n**易错：** df看文件系统整体，du看具体目录；-h以GB/MB显示；basename带后缀参数可去后缀。\n**面试追问：** 磁盘满排查——du -sh *从大到小找大目录；清理/var/log日志；df -h显示100%时优先清理。","source":"v2.4-reimport","star":3,"bank":3},{"id":448,"code":"ML-49","category":"机器学习","question":"机器学习三要素：模型、策略、算法分别是什么？","answer":"**模型：** 带系数的公式，描述输入到输出的映射——类比：体重 ≈ 身高 × 0.55 + 50，其中0.55和50是参数\n**策略：** 判断模型好不好的标准（损失函数）——比较预测体重与真实体重的差距，差距小说明模型好\n**算法：** 自动调整参数让模型变好的方法——梯度下降，自动找到最优的系数值\n\n**一句话：** 模型是公式，策略是\"怎样算好\"，算法是\"怎么找到好公式\"。","extend":"**补充：** 模型=带参数的公式(y=wx+b描述映射)；策略=损失函数(衡量模型好坏)；算法=优化方法(梯度下降自动调参)。\n**易错：** 三要素是统计学习理论框架(李航《统计学习方法》核心)；面试常举房价预测例子说明。\n**面试追问：** 对应到逻辑回归——模型=sigmoid(wx+b)、策略=交叉熵损失、算法=梯度下降；三要素贯穿所有ML算法。","source":"v2.4-reimport","star":4,"bank":3},{"id":449,"code":"ML-50","category":"机器学习","question":"机器学习的标准建模流程是什么？","answer":"**六步流程：**\n1. 数据收集：获取业务相关原始数据（表格、图片、文本等）——数据质量决定模型上限\n2. 数据预处理：清洗脏数据、处理缺失值、整理格式——缺失值填充、异常值删除\n3. 数据集划分：拆分为训练集、测试集——两者互斥，不能交叉\n4. 模型选择与训练：挑选合适算法，用训练集学习规律——回归/分类不同算法\n5. 模型评估：用测试集评估最终效果——准确率、召回率、F1等\n6. 模型落地：训练合格后部署到实际业务中——封装成API服务\n\n**注意：** 全程可迭代优化。","extend":"**补充：** 六步流程——数据收集→预处理→划分→选择训练→评估→部署落地；全程可迭代优化。\n**易错：** 数据质量决定模型上限(垃圾进垃圾出)；预处理包括清洗脏数据/缺失值/格式整理。\n**面试追问：** 工程化补充——特征工程、超参数调优、交叉验证、模型监控；部署成API服务(FastAPI/Flask)供业务调用。","source":"v2.4-reimport","star":4,"bank":3},{"id":451,"code":"ML-52","category":"机器学习-逻辑回归","question":"天气预报中为什么召回率比精确率更重要？如何调整？","answer":"**原因：** 漏报（预测不下雨但下了，没带伞被淋湿）比误报（预测下雨但没下，白带伞）代价严重得多，所以优先“不漏报”。\n**调整方法：** 降低分类阈值（如从默认 0.5 降到 0.4），让模型更容易判为“下雨” → 召回率提高、漏报减少（可能牺牲部分精确率）。\n**代码：** 用 model.predict_proba 取下雨概率，再与自定义阈值比较。\n**注意：** 大数据真实场景不会像小样例那样准确率 1.0，但流程完全一样。","extend":"**补充：** 漏报代价>误报——降低分类阈值(如0.5→0.4)让模型更容易判'下雨'，召回率提高、漏报减少(牺牲部分精确率)。\n**代码：**\n```python\nprob = model.predict_proba(X)[:, 1]\npred = (prob >= 0.4).astype(int)\n```\n**易错：** 降阈值=召回↑精确↓；阈值本质是业务代价权衡，不是模型参数。\n**面试追问：** ROC曲线/AUC与阈值无关，评价模型本身优劣；调阈值是部署时的业务决策；precision-recall曲线帮选阈值。","source":"v2.4-reimport","star":4,"bank":3},{"id":453,"code":"DL-28","category":"深度学习","question":"请描述人工神经元的完整计算过程？","answer":"**三步计算：**\n1. 加权求和：z = w₁x₁ + w₂x₂ + ... + b（权重×输入+偏置）\n2. 激活函数：a = σ(z) 做非线性变换\n3. 输出：y = a 传给下一层\n\n**对应生物神经元：** 树突接收信号→细胞体汇总判断→轴突传出。\n\n**关键：** 单个神经元只能做'线性变换+非线性激活'，很弱；但大量神经元组合可拟合任意复杂函数（通用近似定理）。","extend":"**面试追问：** 偏置b相当于'门槛'(阈值)；权重越大该输入越重要；学习率控制权重更新步长(太大震荡发散、太小收敛慢)。\n**通用近似定理：** 只要隐藏层神经元够多，单隐藏层网络可逼近任意连续函数——像乐高积木，单个很普通，几万块能拼出任何东西。\n**感知器局限：** 单层+阶跃函数只能解决线性可分问题(AND/OR)；XOR需两条直线→多层感知器(MLP)+可导激活函数+反向传播。","source":"v2.4-reimport","star":4,"bank":3},{"id":455,"code":"DL-30","category":"深度学习","question":"什么是因果掩码和填充掩码？","answer":"**因果掩码(Causal Mask)：** 上三角矩阵，当前位置只能看自己和左边——防止看未来词(自回归模型GPT训练时防作弊：能看到未来就直接复制答案，学不会预测)。\n\n**填充掩码(Padding Mask)：** 屏蔽<PAD>填充符——batch内句子长度不同需填充，不屏蔽模型会把<PAD>当有效token学。\n\n**实现：** 掩码矩阵M中禁止位置为-∞(或masked_fill置-1e9)，softmax后权重≈0；PyTorch用torch.tril生成因果掩码。","extend":"**面试追问：** 掩码时机——softmax之前masked_fill；因果掩码用于Decoder自注意力(上三角)，填充掩码用于Encoder/Decoder自注意力+交叉注意力。\n**因果性数学本质：** 词4对词5分数-∞→softmax权重0→梯度不回流，信息只从左到右不反向泄漏。\n**实现：** torch.tril(torch.ones(seq,seq))下三角=1允许看上三角=0禁止；masked_fill(mask==0,-1e9)；GPT每生成一步重新生成掩码。","source":"v2.4-reimport","star":4,"bank":3},{"id":459,"code":"FS-17","category":"FastAPI","question":"APIRouter模块化路由的作用与用法？","answer":"**作用：** 按功能模块把接口拆分到不同文件，main.py统一注册——项目结构清晰、团队协作互不干扰。\n\n**用法：**\n```python\n# routers/users.py\nfrom fastapi import APIRouter\nrouter = APIRouter(prefix=\"/users\", tags=[\"用户管理\"])\n@router.get(\"/{user_id}\")\nasync def get_user(user_id: int): ...\n```\n```python\n# main.py 注册\napp.include_router(users.router)\n```\n**核心参数：**\n- prefix：路由前缀，/users → 所有路由自动加前缀\n- tags：接口文档分组标签\n\n**对比：** 单文件(❌几百行难维护) vs 模块化(✅每人负责一个文件)。","extend":"**代码：** `router = APIRouter(prefix=\"/users\", tags=[\"用户管理\"])`；main.py里`app.include_router(users.router)`。\n**易错：** prefix自动加前缀(/users/实际路径是/users/)；tags用于接口文档分组。\n**追问：** 项目大了把所有接口写main.py会混乱难维护；按模块拆文件+main只注册，团队每人负责一个模块文件。","source":"v2.4-reimport","star":4,"bank":3},{"id":460,"code":"FS-18","category":"FastAPI","question":"表单数据Form与JSON请求体有何区别？表单处理需要什么依赖？","answer":"**两者区别：**\n| 传参方式 | Content-Type | 数据格式 | 声明方式 |\n|---|---|---|---|\n| JSON请求体 | application/json | {\"key\":\"value\"} | Pydantic BaseModel |\n| 表单数据 | application/x-www-form-urlencoded | key=value&key2=val2 | Form(...) |\n\n**Form用法：**\n```python\nfrom fastapi import Form\n@app.post(\"/login\")\nasync def login(username: str = Form(...), password: str = Form(...)):\n    ...\n```\n**关键：** 使用Form前必须 `pip install python-multipart`。\n**场景：** 传统登录页面、搜索表单等HTML表单提交。","extend":"**代码：** `username: str = Form(...)`、`remember_me: bool = Form(False)`。\n**易错：** 用Form必须pip install python-multipart，否则报错。\n**追问：** 表单数据格式key1=value1&key2=value2(application/x-www-form-urlencoded)；JSON格式{\"key\":\"value\"}(application/json)。","source":"v2.4-reimport","star":3,"bank":3},{"id":461,"code":"SK-9","category":"软技能","question":"描述团队协作中 Git 分支开发的标准工作流程（从创建分支到合并到主分支）？","answer":"1. **创建分支**：基于本地最新代码创建新分支（new branch），并默认切换到该分支。\n2. **编写代码**：在分支上开发功能。注意：分支若没有 push 到远程，远程仓库是看不到这个分支的。\n3. **提交并推送**：将代码 commit 到本地分支，再 push 推送到远程仓库，保证远程有该分支。\n4. **合并到 master**：\n   - checkout 切换到 master 分支；\n   - 先更新（pull）master 最新代码，避免基于旧版本合并；\n   - 选择要合并的分支（如 oy0903_1），执行 merge（merge 分支 into master）；\n   - 解决冲突后提交代码。","extend":"核心思想：用分支隔离开发、保证主干稳定。合并前一定先更新主干再合并，减少冲突；合并后要回归测试。命令行等价操作：`git checkout -b feat`（创建并切换）→ `git add . && git commit -m \"...\"` → `git push -u origin feat` → `git checkout master && git pull` → `git merge feat` → 处理冲突 → `git push`。团队常用 PR/MR 做代码评审后再合并。","source":"905","star":4,"bank":3},{"id":467,"code":"LLM-16","category":"大模型应用","question":"LangChain 是什么？它有哪些核心能力？","answer":"LangChain 是用于构建 LLM（大语言模型）应用的开源框架，把大模型接上\"数据、工具、流程、记忆\"，从单纯的聊天接口变成能完成复杂任务的工程框架。\n核心能力：\n1. **模型调用**：统一接口对接 GPT/Claude/Gemini/Qwen/Llama/本地模型，方便切换。\n2. **Prompt 管理**：提供模板、few-shot 示例、动态变量等构建与管理提示词的工具。\n3. **Chain 链式调用**：把多个步骤（如\"提问→检索→总结→返回\"）串联成处理流程。\n4. **Agent 智能体**：自主决定下一步，调用工具、查库、搜网页、执行代码、访问 API。\n5. **Memory 记忆**：保存历史对话，让模型具备上下文记忆。\n6. **文档加载与检索**：读取 PDF/Word/网页/Markdown/数据库并切分、向量化，配合向量库做 RAG。","extend":"适用场景：知识库问答、AI Agent、聊天机器人、工作流自动化。缺点：抽象层多、学习曲线陡；版本迭代快、API 常变；复杂项目可能过度封装，有时不如自己写逻辑清晰。","source":"LLM0903","star":4,"bank":3},{"id":468,"code":"LLM-17","category":"大模型应用","question":"什么是 LCEL？`prompt | llm | output_parser` 链式调用为什么能串联所有组件？","answer":"LCEL（LangChain Expression Language）是 LangChain 的声明式组合语法，用管道符 `|` 把各组件串成一条 Runnable 链。\n为什么能串联：每个组件（PromptTemplate、ChatModel、StrOutputParser 等）都实现了 Runnable 接口，`|` 运算符会把左边组件的输出作为右边组件的输入自动传递，因此可以任意组合。\n示例：`chain = prompt | llm | outputParser`，调用 `chain.invoke({\"topic\":\"咖啡\"})` 依次执行：模板填充变量 → 模型生成 → 解析器提取字符串。\n优点：可读性强、组件可复用、统一支持流式/批处理/异步调用。","extend":"三个组件职责：PromptTemplate 负责把输入格式化成提示词；ChatModel 负责生成（返回 AIMessage）；StrOutputParser 把 AIMessage 转成纯字符串。LCEL 是 LangChain 现代 API 的核心，也是 RAG 链式编排的基础。","source":"LLM0903","star":4,"bank":3},{"id":469,"code":"LLM-18","category":"大模型应用","question":"用 LangChain 实现 RAG 的完整代码流程是什么？涉及哪些核心组件？","answer":"1. **加载文档**：创建 Document 对象，正文存入 page_content。\n2. **切分**：用 RecursiveCharacterTextSplitter（chunk_size、chunk_overlap 控制块大小与重叠）把长文档切成小块。\n3. **向量化**：创建 Embedding 模型（如 DashScopeEmbeddings / OpenAIEmbeddings）把文本块转成向量。\n4. **建库**：用 FAISS.from_documents(documents, embeddings) 建立向量索引，并可 save_local 持久化。\n5. **检索**：vector_store.as_retriever(search_type=\"similarity\", search_kwargs={\"k\":3}) 检索语义最相似的 Top-K 块。\n6. **生成**：把检索内容作为 {context} 拼进 PromptTemplate，与问题一起走 chain（prompt | llm | parser），chain.invoke 生成最终答案。","extend":"关键：检索质量决定 RAG 上限。chunk_size 太小则语义不完整、太大则检索不精准；chunk_overlap 用于保留跨块的上下文连贯；k 值控制拼进提示词的上下文长度，避免超窗口。","source":"LLM0903","star":4,"bank":3},{"id":470,"code":"LLM-19","category":"大模型应用","question":"RAG 和 Fine-tuning（微调）有什么区别？什么场景用哪个？","answer":"| 维度 | RAG | 微调 |\n|------|-----|------|\n| 知识更新 | 改文档即可 | 需重新训练 |\n| 成本 | 较低 | 较高 |\n| 事实准确性 | 高（有检索依据） | 中（仍可能幻觉） |\n| 可追溯性 | 能引用来源 | 黑盒 |\n| 领域风格内化 | 一般 | 较好 |\n选择：需要实时/频繁更新的知识、要求可追溯 → RAG；需要改变模型风格/特定领域表达、知识相对稳定 → 微调。实际项目常二者组合使用。","extend":"一句话记忆：RAG = 给模型\"外接知识库\"，微调 = \"改变模型本身\"。RAG 先检索再生成，回答有据可依；微调把知识固化进权重。","source":"LLM0903","star":4,"bank":3}],"4":[{"id":11,"code":"PY-11","category":"数据结构","question":"请详细描述Python中可变与不可变对象的区别及其重要性？","answer":"**不可变对象** 创建后值不能修改：int、float、bool、str、tuple、frozenset、bytes。\"修改\"=创建新对象。\n**可变对象** 创建后可修改：list、dict、set、自定义类实例。在原地址操作。\n\n**重要性三方面：**\n- ①函数参数：可变对象内部修改影响外部，不可变安全\n- ②字典键：只有不可变(可哈希)才能作键\n- ③线程安全：不可变天然线程安全\n\n**陷阱：**\n- `def add_item(lst=[]):`默认参数只初始化一次\n- 多次调用累积值\n- 应改为lst=None内部判断","extend":"**内存细节：** 不可变对象\"修改\"=创建新对象(新地址)；可变对象方法在原地址操作(id不变)。\n**易错陷阱：** `a=b=[]`两个名字指向同一列表，append互相影响；`a=b=0`不可变则互不影响。\n**面试追问：** 自定义类默认可变；想实现不可变可用__slots__+重写__setattr__或直接使用namedtuple。","source":"v2.4","star":4,"bank":4},{"id":13,"code":"PY-13","category":"数据结构","question":"请详细说明赋值(=)、浅拷贝和深拷贝三者的区别？","answer":"**赋值(=)：** 两个变量指向同一对象，id相同，修改任一变另一方也变。\n\n**浅拷贝：**\n- 新建外层容器，内部元素仍是原引用\n- copy.copy()/list[:]\n- 修改嵌套可变元素→相互影响\n- 替换第一层→互不影响\n\n**深拷贝：**\n- 递归复制所有层级，完全独立\n- copy.deepcopy()\n- 任何修改互不影响\n- 不可变类型元素仍用原引用(优化)\n\n**性能：**\n- 浅拷贝快但嵌套共享风险\n- 深拷贝完全隔离但开销大。选择：完全独立→深拷\n- 仅第一层独立→浅拷\n- 共享→赋值","extend":"**代码：** 浅拷贝copy.copy()/lst[:]/dict(d)；深拷贝copy.deepcopy()。\n**易错：** 浅拷贝只复制最外层，内层嵌套list/dict仍共享引用，修改内层互相影响；替换第一层才互不影响。\n**面试追问：** NumPy/Pandas的视图与副本语义不同(numpy切片默认视图)；copyreg可自定义深拷贝行为。","source":"v2.4","star":4,"bank":4},{"id":14,"code":"PY-14","category":"数据结构","question":"请详细说明列表和元组除了可变性外的本质区别及适用场景？","answer":"**内存：** 元组更小(不需动态扩容缓冲)。\n**创建速度：** 元组更快(无需预分配)。\n**底层：**\n- 列表动态数组中间插入O(n)\n- 元组无修改天然保护\n\n**适用：**\n- 元组→固定数据(坐标/配置)、多返回值、字典键、变量交换\n- 列表→动态数据、频繁增删改","extend":"**性能数据：** 元组更省内存(无过度分配)且创建更快；元组可哈希可作字典键/集合元素，列表不行。\n**易错：** 单元素元组必须写(1,)，(1)只是括号优先级；元组不可变但可包含可变元素。\n**补充：** namedtuple兼具元组轻量与字段访问可读性，常用于数据记录/DTO。","source":"v2.4","star":4,"bank":4},{"id":15,"code":"PY-15","category":"数据结构","question":"请解释为什么字典的键必须是可哈希的？字典的查找原理？","answer":"**哈希要求：**\n- 字典底层哈希表\n- 键的__hash__()计算存储位置→键可变→哈希值变→找不到\n- 须同时实现__hash__()和__eq__()且相等对象哈希相同\n\n**查找原理：** 计算哈希→取模得槽位→开放地址法(二次探测)解决碰撞→O(1)。取值：d[key]不存在抛KeyError；d.get(key,default)返回None/默认值(推荐)。","extend":"**补充：** 自定义类作字典键必须同时实现__hash__和__eq__且相等对象哈希相同；可变对象作键直接TypeError: unhashable。\n**性能：** 哈希表平均O(1)；Python3.6+字典保序(插入序)；d.get(k,默认)避免KeyError。\n**实战：** collections.defaultdict给缺失键自动默认值；Counter统计元素频次；setdefault实现一次性写入。","source":"v2.4","star":5,"bank":4},{"id":18,"code":"PY-18","category":"函数与作用域","question":"请详细描述装饰器的本质原理及如何实现带参数的装饰器？","answer":"**本质：** 接收函数作参数返回新函数的可调用对象，核心是闭包。@decorator=func=decorator(func)。\n\n**作用：** 不修改原函数添加功能(日志/计时/权限/缓存)，实现AOP。\n**带参数装饰器：** 三层嵌套——外层收参数、中层收函数、内层包装。\n**类装饰器：** __init__收函数，__call__当包装。\n**多装饰器：** 从下到上等价调用，从上到下执行。\n**设计原则：** 开闭原则——对扩展开放，对修改关闭。","extend":"**代码模板：**\n```python\nimport functools, time\ndef timer(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        t = time.time(); r = func(*args, **kwargs)\n        print(f'{func.__name__}: {time.time()-t:.4f}s'); return r\n    return wrapper\n```\n**易错：** 不包functools.wraps时被装饰函数名/文档变成wrapper；带参装饰器三层嵌套——外层收参数、中层收函数、内层包装。\n**面试追问：** 多个装饰器从下往上装饰、从上往下执行；类装饰器用__init__收函数+__call__包装；装饰器实现AOP(日志/计时/缓存/权限)。","source":"v2.4","star":5,"bank":4},{"id":23,"code":"PY-23","category":"函数与作用域","question":"请解释Python中闭包的概念、与装饰器的关系及自由变量？","answer":"**闭包：**\n- 内部函数引用外部函数的变量(自由变量)，外部返回内部\n- 三条件：函数嵌套+内部引用外部变量+外部返回内部\n- 作用：数据封装、状态保持\n\n**与装饰器：**\n- 装饰器本质是闭包应用\n- 接收函数作自由变量返回包装新函数\n- 自由变量存__closure__属性中\n- 查看：func.__code__.co_freevars\n- 修改需nonlocal\n- 注意循环中捕获变量的延迟绑定","extend":"**易错：** 循环中创建闭包延迟绑定——`funcs=[lambda: i for i in range(3)]`结果全是2；用`lambda i=i: i`立即绑定。\n**补充：** 自由变量存在func.__closure__元组；`func.__code__.co_freevars`查看自由变量名。\n**面试追问：** 闭包三条件=嵌套+引用外部变量+外部返回内部；用途：计数器、惰性计算、数据封装；装饰器本质是闭包。","source":"v2.4","star":5,"bank":4},{"id":24,"code":"PY-24","category":"函数与作用域","question":"请详细解释迭代器协议、迭代器和可迭代对象的区别？","answer":"**迭代器协议：** 实现__iter__()+__next__()。__iter__返回自身，__next__返回下一元素，耗尽抛StopIteration。\n\n**可迭代对象(Iterable)：** 实现__iter__()返回迭代器(list/str/tuple等)，可多次迭代。\n**迭代器(Iterator)：** 带状态对象，记录当前位置，只能迭代一次不能回退。\n\n**iter()两种：** ①iter(obj)找__iter__→__getitem__ ②iter(callable,sentinel)哨兵。\n**for原理：** iter()→next()→捕获StopIteration退出。","extend":"**补充：** 可迭代对象实现__iter__()返回迭代器；迭代器同时实现__iter__和__next__；生成器函数自动实现两者。\n**易错：** 迭代器有状态不可回退、耗尽后继续next抛StopIteration；想重新遍历要新建迭代器。\n**面试追问：** iter(callable, sentinel)哨兵模式——iter(f, 'end')持续调f直到返回'end'，常用于按块读取文件；enumerate/zip底层都靠迭代协议。","source":"v2.4","star":5,"bank":4},{"id":25,"code":"PY-25","category":"函数与作用域","question":"请详细描述生成器定义、yield用法、send/close/throw及与普通函数的区别？","answer":"**生成器：** 有yield的函数，调用返回生成器对象(即迭代器)。惰性求值，按需生成。\n\n**yield vs return：** return终止性→状态销毁，只能一次；yield暂挂性→状态保留，可多次。在生成器中return触发StopIteration。\n\n**方法：**\n- send(value)传值(首次须None或next启动)\n- close()手动关闭\n- throw(exc)暂停位置抛异常\n**生成器表达式：** (x for x in range(10))惰性vs [x...]一次性。\n\n**vs普通函数：**\n- 普通函数立即执行return一次返回\n- 生成器惰性按需生成，内存效率高，可保留状态\n**场景：** 大数据集、无限序列、协程、流式管道。","extend":"**代码：**\n```python\ndef gen():\n    v = yield 1\n    print('收到:', v)\n    yield 2\n```\n**易错：** 首次send必须send(None)或先next()启动；生成器已耗尽后再send抛StopIteration；close()后再迭代报RuntimeError。\n**面试追问：** yield from(3.3+)委托子生成器简化嵌套；生成器逐行yield处理GB级文件省内存；协程是生成器的演进(async/await)。","source":"v2.4","star":5,"bank":4},{"id":35,"code":"PYH-1","category":"并发编程","question":"请详细对比Python中多线程、多进程和协程三者的本质区别和适用场景？","answer":"| 特性 | 多线程 | 多进程 | 协程 |\n|------|--------|--------|------|\n| 调度者 | OS内核 | OS内核 | 用户态事件循环 |\n| 内存 | 共享 | 独立 | 共享 |\n| GIL影响 | 受限 | 不受限 | 不受限 |\n| 创建开销 | 小 | 大 | 极小(μs级) |\n| 通信 | 共享变量(需锁) | IPC(Queue/Pipe) | 共享变量(无锁) |\n| 崩溃影响 | 一个崩全崩 | 互不影响 | 一个崩全崩 |\n| 多核利用 | 不能(GIL) | 能(并行) | 不能 |\n\n**适用：** CPU密集→多进程 | 普通I/O→多线程 | 超高并发I/O(数万连接)→协程(asyncio) | 混合可组合。\n\n**多线程：** 同进程共享内存OS调度，轻量切换开销小，CPython受GIL限制。\n**多进程：** 独立进程独立GIL，创建开销大可真正并行。\n**协程：** 用户态单线程事件循环调度，切换极小无锁竞争。","extend":"**补充：** GIL下多线程只能并发不能并行，但I/O等待时释放GIL，所以网络/文件密集任务多线程仍有效；CPU密集必须多进程。\n**易错：** 协程里调用阻塞同步库(如requests)会卡住整个事件循环——改用httpx/aiohttp异步库。\n**选型口诀：** CPU密集→进程；普通I/O→线程；超高并发I/O→协程；混合任务可组合(线程池+协程混用)。","source":"v2.4","star":5,"bank":4},{"id":36,"code":"PYH-2","category":"并发编程","question":"请详细解释GIL的影响、释放时机及如何规避？","answer":"**GIL：** CPython中的互斥锁，保证同一时刻只有一个线程执行Python字节码。原因：引用计数内存管理非线程安全，GIL简化实现。\n\n**释放时机：**\n- ①I/O操作主动释放\n- ②时间片耗尽(每~5ms或100条字节码)强制释放\n- ③time.sleep()等阻塞操作释放\n**影响：**\n- CPU密集型多线程频繁争抢GIL+切换开销→性能下降\n- I/O密集型多线程仍有效\n\n**规避方案：** ①多进程(multiprocessing)每个进程独立GIL→CPU密集型；②异步(asyncio)单线程事件循环→高并发I/O；③C扩展(C层面释放GIL，NumPy/Pandas)；④进程池(ProcessPoolExecutor)；⑤换Jython/IronPython无GIL。","extend":"**补充：** GIL是CPython解释器级互斥锁，保护引用计数；约每5ms或100条字节码强制切换；I/O/sleep自动释放。\n**易错：** 多线程跑CPU密集任务因频繁抢GIL+切换反而更慢；规避用多进程、asyncio、C扩展(如NumPy底层释放GIL)。\n**面试追问：** Python3.13+提供实验性free-threaded(no-GIL)构建；PyPy用STM优化；生态兼容仍是推广难点。","source":"v2.4","star":5,"bank":4},{"id":37,"code":"PYH-3","category":"并发编程","question":"请详细对比threading.Lock和RLock的区别及死锁预防？","answer":"**Lock：** 最简单互斥锁，不可重入(同线程重复获取→死锁)。场景：简单互斥。\n**RLock：**\n- 可重入锁\n- 同线程多次获取，内部计数，释放减1到0才真正释放\n- 场景：递归/嵌套\n\n**死锁四条件：** ①互斥②占有并等待③不可抢占④循环等待。\n**预防：** 打破占有并等待→一次性申请所有资源；打破不可抢占→超时锁acquire(timeout=...)；打破循环等待→资源有序分配法(按相同顺序获取锁)。用with语句自动管理、减少嵌套锁。","extend":"**代码：**\n```python\nlock = threading.RLock()\nwith lock:\n    with lock:   # RLock可重入；普通Lock此处死锁\n        pass\n```\n**易错：** 同线程对普通Lock二次acquire直接死锁；死锁四条件(互斥/占有等待/不可抢占/循环等待)打破任一条即可解除。\n**面试追问：** 避免死锁——多把锁按固定顺序获取、acquire(timeout=...)、with语句自动释放；threading.local隔离线程数据减少锁竞争。","source":"v2.4","star":5,"bank":4},{"id":38,"code":"PYH-4","category":"并发编程","question":"请说明with语句如何简化锁管理及Lock在上下文管理器中的行为？","answer":"**with简化：**\n- Lock实现__enter__/__exit__→可作上下文管理器\n- with lock:进入自动acquire()退出自动release()，即使异常也释放\n- 好处：避免遗漏释放、异常安全、代码简洁\n\n**注意：** with不能用于超时/非阻塞获取锁场景(需手动acquire(timeout=...))；with块中不要提前break/return。","extend":"**补充：** Lock实现__enter__/__exit__可作上下文管理器；with lock:等价acquire+try/finally release，异常时同样释放。\n**易错：** with无法处理超时/非阻塞获取场景(需手动acquire(timeout=...))；with块内提前return/break锁也已自动释放(这正是优势)。\n**面试追问：** 自定义上下文管理器用contextlib.contextmanager装饰器+yield，比实现__enter__/__exit__的类简洁。","source":"v2.4","star":5,"bank":4},{"id":41,"code":"PYH-7","category":"并发编程","question":"请解释async/await如何实现\"无锁并发\"？为什么协程不需要锁？","answer":"**原理：**\n- 协程在单线程运行，协作式调度(非抢占)\n- 只有await才让出控制权不随意中断\n- 无await的代码段无上下文切换→无竞态条件\n\n**不需要锁原因：**\n- 锁防多线程并行修改共享资源\n- 协程是交替执行非并行，切换点可控\n- 临界区内无await→该段代码原子\n\n**例外(仍要锁)：**\n- 协程中调线程池(run_in_executor)\n- 多事件循环(多线程)同时运行","extend":"**补充：** 协程在单线程协作式调度，切换点只有await——临界区内无await则该段代码原子，天然无竞态。\n**易错：** run_in_executor把阻塞调用丢线程池后多线程共享状态仍需锁；多事件循环(多线程)同时运行也需锁。\n**面试追问：** 对比线程抢占式调度——协程切换可控可预测，无锁竞争、无上下文切换开销，数万协程内存占用远小于线程。","source":"v2.4","star":5,"bank":4},{"id":45,"code":"PYH-11","category":"并发编程","question":"请解释协程和生成器的关系、async/await实现及演进？","answer":"**关系：**\n- 生成器是协程前身\n- yield可实现简单协程(返回值+send双向通信)\n- async/await底层仍基于生成器但提供更高级异步抽象\n\n**演进：**\n- 2.5:PEP342引入send()→生成器双向通信\n- 3.3:yield from简化委托\n- 3.5:async/await正式引入\n\n**实现：**\n- async def协程函数→await挂起等待Awaitable\n- 遇await暂停→事件循环接管→条件满足恢复\n\n**区别：**\n- 生成器协程yield/yield from手动驱动\n- async/await事件循环自动驱动，接近同步写法可读性好","extend":"**补充：** 演进史——PEP342(send双向通信)→PEP380(yield from委托)→PEP492(async/await)；async/await是生成器协程的语法糖升级。\n**易错：** 生成器协程需手动驱动(send/next)，async/await由事件循环自动驱动；asyncio内部仍基于生成器实现。\n**面试追问：** await只能挂起可等待对象(协程/Task/Future/IO)；生成器适合惰性数据流，协程适合双向通信与并发控制。","source":"v2.4","star":5,"bank":4},{"id":51,"code":"PY-40","category":"Python基础","question":"请详细对比TCP和UDP协议及三次握手/四次挥手？","answer":"**TCP：**\n- 面向连接(三次握手)、可靠(分片编号+ACK重传+校验+有序)\n- 较慢\n- 适用文件传输/HTTP/数据库\n**UDP：**\n- 无连接(不需握手)、不可靠(无ACK无重传)、无序\n- 快\n- 适用直播/视频/游戏\n\n**三次握手：** SYN(客户端→可连接?)→SYN-ACK(服务端→收到，你能收?)→ACK(客户端→收到)→连接建立。双向验证收发能力。\n**四次挥手：** FIN→ACK→FIN→ACK。双向通信分别关闭各自发送通道。","extend":"**补充：** TCP三次握手SYN→SYN-ACK→ACK验证双向收发；四次挥手FIN→ACK→FIN→ACK各自关闭发送通道；TIME_WAIT状态常见于主动关闭方。\n**易错：** TCP是字节流无消息边界——粘包/拆包需应用层定义边界(长度前缀/分隔符)；UDP报文最大约64KB。\n**面试追问：** 对比——TCP可靠有序慢(文件/HTTP/数据库)；UDP快可能丢包乱序(直播/游戏)；QUIC基于UDP实现可靠传输。","source":"v2.4","star":4,"bank":4},{"id":56,"code":"PYH-15","category":"综合进阶","question":"请对比列表推导式、生成器表达式、字典推导式和集合推导式？","answer":"**列表推导式：** [x*2 for x in range(10)]一次性生成→占内存但访问快。适用数据量不大需反复访问。\n**生成器表达式：** (x*2 for x in range(10))惰性求值→省内存只能遍历一次。适用大数据集。\n**字典推导式：** {x:x`**`2 for x in range(5)}生成字典。\n**集合推导式：** {x for x in range(10) if x%2==0}自动去重。","extend":"**代码：**\n```python\nlst = [x*2 for x in range(10) if x % 2]   # 列表\ngen = (x*2 for x in range(10))            # 生成器\nnum = {x: x**2 for x in range(5)}         # 字典\nst  = {x for x in range(10) if x % 2 == 0} # 集合\n```\n**易错：** 生成器表达式加括号才是生成器，外面再套()是元组推导(3.8+才支持)；推导式嵌套超过两层可读性差。\n**面试追问：** 内存——列表推导一次性占内存但可重复访问；生成器惰性省内存只遍历一次；字典推导常用于键值转换/去重。","source":"v2.4","star":5,"bank":4},{"id":57,"code":"PYH-16","category":"综合进阶","question":"请对比迭代器和生成器的异同点？","answer":"**相同：**\n- 都遵循迭代器协议(__iter__+__next__)\n- 惰性取值\n- 只能遍历一次\n- 都可用于for循环\n\n**不同：**\n- 迭代器需手动实现协议和状态管理+手动抛StopIteration\n- 生成器用yield关键字自动实现协议自动抛异常\n\n**生成器额外能力：**\n- send()双向传值\n- close()关闭\n- throw()抛入异常\n- 生成器表达式(x for x in...)更简洁\n\n**选择：**\n- 简单遍历→生成器\n- 复杂状态管理→自定义迭代器类。生成器是迭代器的语法糖","extend":"**补充：** 相同——都遵循迭代器协议、惰性取值、只能遍历一次；不同——迭代器手动实现协议+状态管理，生成器yield自动实现。\n**易错：** 生成器额外支持send/close/throw；生成器表达式比自定义迭代器类简洁。\n**面试追问：** 选型——简单遍历用生成器；复杂状态机/需要双向通信用迭代器类；生成器本质是迭代器的语法糖。","source":"v2.4","star":5,"bank":4},{"id":74,"code":"DB-15","category":"MySQL","question":"请说明INNER JOIN、LEFT/RIGHT JOIN的区别和语法？","answer":"**INNER JOIN(内连接)：**\n- 只保留两表能匹配上的数据，不匹配全丢弃\n- 相当于交集\n- 无ON→笛卡尔积(A×B行数)\n```sql\nSELECT字段FROM A INNER JOIN B ON 条件;\n```\n\n**LEFT JOIN(左连接)：** 以左表为基础，右表匹配→带出数据，不匹配→NULL填充。\n**RIGHT JOIN(右连接)：** 以右表为基础，左匹配→带出，不匹配→NULL。右连接可改写为左连接：A RIGHT JOIN B = B LEFT JOIN A(推荐)。\n\n**自连接：** 一张表自连起两个别名。例：查员工及领导→emp LEFT JOIN mgr ON emp.mid=mgr.eid。\n\n**UNION vs UNION ALL：** UNION合并多条SELECT自动去重+排序；UNION ALL不去重不排序性能更快。前提：列数/字段名/数据类型一致。","extend":"**补充：** INNER只保留两表匹配行；LEFT以左表为主右表不匹配补NULL；RIGHT反之(可改写成LEFT)；无ON条件=笛卡尔积。\n**易错：** ON条件错误导致结果翻倍(一对多)；UNION自动去重+排序开销大，UNION ALL不去重更快。\n**面试追问：** 自连接——员工表LEFT JOIN自身查领导；被驱动表JOIN字段必须建索引；多表JOIN控制数量(一般≤3)。","source":"v2.4","star":4,"bank":4},{"id":78,"code":"DB-19","category":"MySQL","question":"什么是索引？MySQL InnoDB的B+树结构是怎样的？","answer":"**索引：** 预先构建的、排序的数据结构，帮助数据库引擎快速定位数据，无需全表扫描。\n\n**B+树结构（InnoDB默认）：**\n- 整棵树分两层——非叶子层(索引层)+叶子层(数据层)，每页16KB\n- 非叶子节点只存索引值和子节点磁盘页指针做导航\n- 叶子节点按主键排序的**双向链表**存完整行数据\n- 查找用二分查找快速定位\n\n**叶子节点为何是双向链表？** 支持ORDER BY DESC反向遍历、范围查询的快速前后扫描。\n**为何不用哈希表？**\n- Hash只能等值查询不支持区间/排序/模糊匹配\n- Hash冲突时退化为链表查询","extend":"**补充：** 为什么选B+树——矮胖(3~4层支撑千万级数据)、非叶子只存索引键有更多扇出、叶子有序双向链表天然支持范围查询。\n**易错：** 主键无序(UUID)导致插入页分裂、索引碎片；哈希索引只支持等值查询不支持范围/排序。\n**面试追问：** InnoDB页默认16KB；B+树 vs B树——B树每节点都存数据，B+树数据只在叶子且叶子双向链表，范围扫描更快更稳。","source":"v2.4","star":5,"bank":4},{"id":79,"code":"DB-20","category":"MySQL","question":"请详细说明聚簇索引和非聚簇索引的区别？什么是回表操作？","answer":"**聚簇索引(主键索引)：**\n- 表数据本身就是一棵B+树，叶子节点存完整一行数据\n- 叶节点双向链表按主键排序\n- 一张表只能有一棵\n- 主键应有序递增→新增永远追到末尾\n\n**非聚簇索引(二级/普通索引)：**\n- 单独一棵B+树，叶子节点不存完整数据只存**索引列值+主键值**\n- 叶链表按索引字段排序\n- 一张表可创建多棵\n\n**回表操作：** 如查name='张三'→先查name的非聚簇索引得主键id=10→再拿id=10去聚簇索引查完整行。两次B+树查询→多查一次叫回表。","extend":"**补充：** 聚簇索引=InnoDB主键索引，叶子直接存整行数据；二级索引叶子存(索引列值+主键)；回表=二级索引→查主键→再查聚簇索引，两次B+树查找。\n**易错：** 没有显式主键时InnoDB选第一个非空唯一索引，否则生成隐藏rowid；主键有序递增减少页分裂。\n**面试追问：** 避免回表=覆盖索引；回表是二级索引查询的主要开销，设计联合索引让高频查询字段被覆盖。","source":"v2.4","star":5,"bank":4},{"id":80,"code":"DB-21","category":"MySQL","question":"什么是覆盖索引？相比回表有什么优势？","answer":"**覆盖索引：** 查询字段只含索引列+主键，二级索引叶子节点上已有这些数据→不需要再访问聚簇索引→避免回表操作。\n\n**示例：** `SELECT id,ename FROM user WHERE ename='张三'` — id和ename都在二级索引叶子上，无需回表。\n\n**优势：** 减少一次B+树查询，性能显著提升。设计索引时应尽量让常用查询字段被索引覆盖。\n**局限：** 索引列越多B+树越大写入性能下降，需读写权衡。","extend":"**补充：** 覆盖索引=查询列全部包含在索引树中(含主键)，二级索引叶子已有数据，无需回表聚簇索引；EXPLAIN的Extra显示Using index。\n**易错：** SELECT *几乎不可能被覆盖(索引含全部列不现实)；索引列越多B+树越大、写入越慢，需读写权衡。\n**面试追问：** 覆盖索引示例——idx(name,age)上SELECT id,name,age WHERE name='张三'直接命中；少用SELECT *是覆盖优化前提。","source":"v2.4","star":5,"bank":4},{"id":81,"code":"DB-22","category":"MySQL","question":"请对比InnoDB和MyISAM两种存储引擎的区别？","answer":"InnoDB(5.5+默认)：支持事务/行锁/外键，B+树聚簇索引(数据+索引一起存在.ibd)，业务系统唯一推荐。\n\nMyISAM：不支持事务/外键，表锁。数据索引完全分离(.MYD数据+.MYI索引)，索引叶子节点只存数据行磁盘地址。适合读多写少(已淘汰)。\n\n文件对比：InnoDB=.frm+.ibd；MyISAM=.frm+.MYD+.MYI。","extend":"**补充：** InnoDB(5.5+默认)——事务/行锁/外键/崩溃恢复(redo log+undo log)；MyISAM——表锁/无事务/压缩读快/全文索引早期独有。\n**易错：** MyISAM索引叶子存数据行磁盘地址(非聚簇)；文件对比InnoDB=.frm+.ibd，MyISAM=.frm+.MYD+.MYI。\n**面试追问：** MyISAM已事实淘汰，即使读多写少也优先InnoDB；Memory引擎存临时表(数据重启丢失)。","source":"v2.4","star":4,"bank":4},{"id":82,"code":"DB-23","category":"MySQL","question":"MySQL中有哪几种索引类型？如何创建和删除？","answer":"**1.主键索引：** 一张表只能有一个，字段NOT NULL+UNIQUE，叶节点存整行(聚簇索引)。建表：`id BIGINT PRIMARY KEY`；追加：`ALTER TABLE user ADD PRIMARY KEY(id);`\n\n**2.唯一索引：** 可多个，列值不能重复。二级索引单独B+树。`CREATE UNIQUE INDEX idx_user_phone ON user(phone);`删除：`DROP INDEX idx_user_phone ON user;`\n\n**3.普通索引：** 最基础，无唯一约束，允许重复和NULL。`CREATE INDEX idx_user_name ON user(name);`\n\n**4.联合索引(复合索引)：** 多字段共用一棵B+树，遵循最左匹配原则。`CREATE INDEX idx_name_age ON user(name,age);`","extend":"**代码：**\n```sql\nCREATE UNIQUE INDEX uk_phone ON user(phone);\nCREATE INDEX idx_name_age ON user(name, age);\nDROP INDEX idx_name_age ON user;\n```\n**易错：** 主键索引一张表只能一个；唯一索引可多个但列值不能重复(可多个NULL)；联合索引遵循最左前缀。\n**面试追问：** 还有全文索引FULLTEXT(中文需分词器)、空间索引SPATIAL(8.0支持)；命名规范idx_列名/uk_列名；SHOW INDEX查看索引。","source":"v2.4","star":5,"bank":4},{"id":83,"code":"DB-24","category":"MySQL","question":"什么是联合索引的最左匹配原则？请举例说明？","answer":"**最左匹配原则：** 联合索引中查询条件必须从索引的最左列开始且不跳过中间列，才能使用该索引。\n\n**示例：** 联合索引`idx_name_age ON user(name,age)`\n- ✅ `WHERE name='张三'` — 匹配最左列，走索引\n- ✅ `WHERE name='张三' AND age=18` — 从最左连续匹配，走索引\n- ✅ `WHERE age=18 AND name='张三'` — 优化器自动调整顺序，走索引\n- ❌ `WHERE age=18` — 跳过最左列，不走索引\n\n**原理：** 联合索引B+树先按name排序，name相同再按age排序。跳过name直接查age→无法利用有序性→全表扫描。","extend":"**补充：** 原理——联合索引B+树先按第一列排序、第一列相同再按第二列，跳过最左列查询无法利用有序性。\n**易错：** 范围条件右侧列失效——WHERE a=1 AND b>10 AND c=3中c不走索引(a、b可用)；优化器可调整等值条件顺序。\n**面试追问：** 设计索引列顺序=等值条件放前、范围条件放后；MySQL8.0的索引跳跃扫描(Skip Scan)缓解部分跳过场景。","source":"v2.4","star":5,"bank":4},{"id":84,"code":"DB-25","category":"MySQL","question":"什么是事务？事务的ACID四大特性是什么？","answer":"**事务：** 一组不可分割的DML(增删改)SQL语句的执行单元。所有SQL全成功→整体生效；任意一条失败→全部撤销回滚到执行前。\n\n**ACID四大特性：**\n1. **原子性(A)：** 事务是最小执行单元不可拆分，要么全成功要么全失败。解决数据部分更新/错乱问题。\n2. **一致性(C)：** 事务执行前后数据库整体数据状态合法合规一致。如转账前后账户总余额不变。\n3. **隔离性(I)：** 多事务并发执行时互不干扰。一个事务失败不影响另一个成功。\n4. **持久性(D)：** 事务一旦提交成功，数据永久写入磁盘，即使服务器断电/重启也不丢失。","extend":"**补充：** 原子性靠undo log回滚；持久性靠redo log刷盘；隔离性靠锁+MVCC；一致性是前三者的综合目标。\n**易错：** 事务里混入长查询/外部调用会长时间持锁；DDL隐式提交会结束当前事务；事务过大undo膨胀。\n**面试追问：** 大模型应用批量写入——分批提交(如每500条)减少锁竞争与回滚代价；RocketMQ等消息事务也是ACID思想。","source":"v2.4","star":5,"bank":4},{"id":85,"code":"DB-26","category":"MySQL","question":"事务并发会引发哪三种问题？不可重复读和幻读的区别？","answer":"**三种并发问题：**\n1. **脏读：** 事务A读取了事务B修改但未提交的数据。B回滚→A读到脏数据。\n2. **不可重复读：** 同一事务内两次读取同一条记录结果不同（被其他事务UPDATE修改并提交）。\n3. **幻读：** 同一事务内两次执行同一查询条件，结果集行数不一样（其他事务INSERT/DELETE了数据）。\n\n**不可重复读 vs 幻读的区别：**\n- 不可重复读=同一条记录的**内容**变了(UPDATE导致)\n- 幻读=结果集的**行数**变了(INSERT/DELETE导致)","extend":"**补充：** 脏读=读未提交数据(B回滚A白读)；不可重复读=同记录内容被UPDATE改变；幻读=结果集行数被INSERT/DELETE改变。\n**易错：** 面试高频——区分不可重复读(内容变)与幻读(行数变)；MVCC解决不可重复读，间隙锁(Gap Lock)解决幻读。\n**面试追问：** 快照读(普通SELECT) vs 当前读(SELECT...FOR UPDATE/LOCK IN SHARE MODE)——当前读加锁才能防幻读；RR级别下快照读无幻读。","source":"v2.4","star":5,"bank":4},{"id":86,"code":"DB-27","category":"MySQL","question":"MySQL有哪四种事务隔离级别？各自的原理和适用场景？","answer":"**四种隔离级别（安全性与并发性能的平衡）：**\n- **READ UNCOMMITTED：** 最低级别，可读未提交数据。三个并发问题全存在。原理：所有修改实时可见不等提交。生产几乎不用。\n- **READ COMMITTED：** 只能读已提交数据。解决脏读，存在不可重复读和幻读。原理：只读已持久化数据。适用高并发查询业务。\n- **REPEATABLE READ(InnoDB默认)：** 同事务内多次读同数据结果始终一致。解决脏读+不可重复读，大部分解决幻读。原理：事务开启时生成数据快照(Snapshot)整个事务期间读自己副本。适用支付/金融等一致性要求高的业务。\n- **SERIALIZABLE：** 最高级别，所有事务串行执行。彻底解决三个并发问题但性能极差。原理：所有查询/修改/新增加锁不能同时执行。适用一致性极高且并发极低的场景。","extend":"**补充：** READ UNCOMMITTED三个问题全有；READ COMMITTED解决脏读(RC)；REPEATABLE READ解决脏读+不可重复读，快照读下基本解决幻读(RR，InnoDB默认)；SERIALIZABLE全解决但并发极差。\n**易错：** 隔离级别影响锁范围——RR用间隙锁防幻读，RC只锁行并发更高；MySQL默认RR，Oracle默认RC。\n**面试追问：** MVCC原理——行隐藏字段(trx_id/roll_pointer)+undo log构造快照；RR首次读生成快照整个事务复用，RC每次读生成新快照。","source":"v2.4","star":5,"bank":4},{"id":88,"code":"DB-29","category":"MySQL","question":"索引在哪些场景下会失效？（高频面试题）","answer":"**1. 字段类型隐式转换：** `WHERE str_col=123` 字符串与数字对比→索引失效。\n**2. 索引列做运算/函数：** `WHERE year(create_time)=2026`、`WHERE id+1=100`。\n**3. LIKE %前缀模糊：**\n- `name LIKE '%张三'` 失效\n- `name LIKE '张%'` 可走索引\n**4. OR两边无索引：** `WHERE a=1 OR b=2` a/b只有一个有索引→全表扫描。\n**5. NOT IN / != / NOT LIKE：** 大概率不走索引（优化器判断）。\n**6. 联合索引不满足最左前缀：** 跳过最左列直接查后面的列。\n**7. MySQL预估全表扫描更快：** 数据量少或区分度低时自动放弃索引。\n**8. 范围条件后的索引列失效：** `WHERE a=1 AND b>10 AND c=3` — c不走索引。","extend":"**补充：** 失效8大场景——隐式转换/索引列运算函数/前缀模糊/OR两边无索引/NOT IN与!=/最左不满足/优化器判断全表更快/范围条件后列。\n**易错：** 避免索引列计算：WHERE create_time>='2026-01-01'而非YEAR(create_time)=2026；OR改写UNION。\n**面试追问：** 参数化查询防SQL注入+复用执行计划；用EXPLAIN验证key字段是否真的走了索引。","source":"v2.4","star":5,"bank":4},{"id":90,"code":"DB-31","category":"MySQL","question":"请详细说明EXPLAIN执行计划的关键字段和含义？","answer":"**EXPLAIN关键字段（从优到差）：**\n**id：**\n- 执行顺序，id越大越先执行\n- 相同id从上到下\n**select_type：** SIMPLE简单查询、PRIMARY主查询、SUBQUERY子查询、DERIVED派生表。\n**type（核心！访问类型从优到差）：** system>const>eq_ref>ref>range>index>ALL。至少达到range级别，生产避免ALL全表扫描。\n**key：** 实际使用的索引；**key_len：** 索引占用长度，判断联合索引中几个字段被使用。\n**rows：** 扫描预估行数，越小越好。\n**Extra（重要！）：** Using filesort（文件排序，需优化）、Using temporary（临时表，严重性能问题）、Using index（覆盖索引，最优）。","extend":"**补充：** type访问类型从优到差system>const>eq_ref>ref>range>index>ALL；生产查询至少range级别。\n**易错：** key为NULL说明未走索引；rows是估算值非精确；Extra的Using filesort/Using temporary是性能警报。\n**面试追问：** Using index=覆盖索引(最优)；key_len可判断联合索引用到几列；filtered列是过滤比例；select_type的SUBQUERY/DERIVED也要留意。","source":"v2.4","star":5,"bank":4},{"id":118,"code":"PD-19","category":"Pandas","question":"NumPy的切片和索引语法？二维数组如何取行列？","answer":"**语法：** arr[start:end:step]，左闭右开，步长可以省略默认1\n**常用切片：**\n- arr[::2]：从头取到尾，步长为2\n- arr[5:1:-1]：逆序切片\n- arr[::-1]：倒序\n- arr[-1]：取倒数第一个元素\n\n**二维数组：** arr2d[行,列]\n- arr2d[0] 或 arr2d[0,:]：取第0行全部列\n- arr2d[0:2,1:]：取第0~1行、第1列到末尾\n- arr2d[:,::2]：所有行，隔一列取一列","extend":"**补充：** 语法arr[start:end:step]左闭右开；负步长逆序；二维arr[行,列]逗号分隔。\n**代码：**\n```python\narr2d[0]         # 第0行\narr2d[:, 1]      # 第1列\narr2d[::2, ::-1] # 隔行取+列倒序\n```\n**易错：** 切片返回视图修改影响原数组；负索引-1倒数第一个；花式索引arr[[0,2]]返回副本。\n**面试追问：** 省略号arr[..., -1]取最后一列(任意维度)；冒号全省略arr[:]取全部(视图)。","source":"v2.4","star":5,"bank":4},{"id":125,"code":"PD-26","category":"Pandas","question":"Series和DataFrame的区别与联系？","answer":"**对比表格：**\n| 名称 | 维度 | 通俗理解 | 适合存放 |\n|------|------|----------|----------|\n| Series | 一维 | 带标签的一列数据 | 一个字段/一组序列 |\n| DataFrame | 二维 | 带行列标签的表格 | 整张表，类似数据库表 |\n\n**联系：** DataFrame相当于把若干条Series按同一个索引并排放在一起得到的表，单独抽出一列就是Series。","extend":"**补充：** DataFrame由若干Series按同一索引并排组成；抽出一列df['列']即Series；Series本质是带标签的一维数组。\n**易错：** Series索引可重复(非唯一索引)；DataFrame行索引+列名双标签。\n**面试追问：** 一维带标签数据用Series；二维表格用DataFrame；groupby聚合结果通常是Series；多列结果才是DataFrame。","source":"v2.4","star":4,"bank":4},{"id":128,"code":"PD-29","category":"Pandas","question":"loc和iloc的区别？切片端点规则是什么？","answer":"**loc：** 按\"标签\"取值、切片时**包含右端点**\n- s2.loc[\"数学\"]：按标签取一个元素\n- s2.loc[\"语文\":\"英语\"]：按标签切片（含\"英语\"）\n\n**iloc：** 按\"位置\"取值、切片时**不包含右端点**\n- s2.iloc[0]：按位置取第0个\n- s2.iloc[1:3]：按位置切片（不含位置3）\n\n**注意：** 这两者的差异是初学者最容易踩的坑，务必记牢。","extend":"**补充：** loc按'标签'取值、切片含右端点；iloc按'位置'取值、切片不含右端点；二维用df.loc[行,列]。\n**代码：**\n```python\ns2.loc['语文':'英语']   # 含'英语'\ns2.iloc[1:3]            # 不含位置3\n```\n**易错：** loc切片含右端点、iloc不含——最易踩的坑；loc的键不存在抛KeyError。\n**面试追问：** df.loc['甲':'乙', ['姓名','成绩']]行标签切片+选列；df.iloc[1:3, 0:2]位置切片；df.loc[条件, 列]条件选行列。","source":"v2.4","star":4,"bank":4},{"id":130,"code":"PD-31","category":"Pandas","question":"Series的条件筛选（布尔索引）怎么用？","answer":"**核心思路：** 先写出一个\"真值表\"（每个元素是否满足条件），再用真值表当索引去取数，满足条件的位置留下，不满足的舍去。\n\n**步骤：**\n1. 生成真值表：mask = s > s.mean()（比平均分高的标True）\n2. 用真值表筛选：s[mask]\n\n**示例：** s = pd.Series({\"语文\":85,\"数学\":90,\"英语\":76,\"体育\":63})，s[s > s.mean()] 得到语文、数学两科","extend":"**补充：** 核心思路——先写'真值表'(布尔Series)再当索引取数，满足条件留下、不满足舍去。\n**代码：**\n```python\ns = pd.Series({'语文':85,'数学':90,'英语':76,'体育':63})\ns[s > s.mean()]   # 高于平均分的留下\n```\n**易错：** 布尔索引返回新Series不修改原数据；多条件用& |且每个条件加括号。\n**面试追问：** 筛选异常值s[(s>下限)&(s<上限)]；s.between(a,b)区间筛选更简洁；字符串筛选s[s.str.contains('关键词')]。","source":"v2.4","star":5,"bank":4},{"id":157,"code":"LNX-9","category":"Linux","question":"root用户和sudo的区别？为什么Ubuntu默认锁定root？","answer":"**root用户：** 具有最高权限的超级用户，拥有系统的所有权限，可进行任何操作；权限过大，不当操作可能导致系统严重问题。\n\n**Ubuntu默认情况：** root用户默认被锁定，没有设置默认密码，推荐使用普通用户 + sudo获取临时root权限。\n\n**sudo：** 临时以root身份执行单条命令，如 sudo apt install package_name，用完即恢复普通权限。\n\n**启用root：** sudo passwd root可以给root设置密码并启用。\n\n**锁定/解锁用户：** sudo passwd -l test1锁定用户，sudo passwd -u test1解锁用户","extend":"**补充：** root拥有最高权限；Ubuntu默认锁定root，推荐普通用户+sudo临时提权；sudo passwd root可启用root。\n**易错：** 日常不用root操作(误删风险)；sudo只对单条命令生效；passwd -l锁定、-u解锁用户。\n**面试追问：** /etc/sudoers配置sudo权限(visudo编辑)；NOPASSWD免密sudo；sudo -i进入root shell。","source":"v2.4","star":5,"bank":4},{"id":189,"code":"ML-10","category":"机器学习","question":"有监督学习、无监督学习、半监督学习、强化学习的区别？","answer":"**有监督学习：** 有特征+有标签——老师给答案，学生做题。典型应用：房价预测、垃圾邮件识别\n**无监督学习：** 有特征+无标签——学生自己分类整理。典型应用：用户分群、图片聚类\n**半监督学习：** 部分有标签——少量例题+大量自学。典型应用：手写数字识别（少量标注）\n**强化学习：** 机器通过不断试错，获得奖励或惩罚来优化行为——小动物训练。典型应用：自动驾驶、游戏AI","extend":"**补充：** 监督(有特征+有标签)、无监督(有特征无标签：聚类/降维)、半监督(少量标签+大量无标签)、强化(试错+奖励信号)。\n**易错：** 分类/回归属于监督学习；聚类/降维属于无监督；强化学习没有标签只有奖励。\n**面试追问：** 自监督学习(大模型预训练=预测下一个词)是监督的变体；RLHF用强化学习对齐大模型与人类偏好。","source":"v2.4","star":4,"bank":4},{"id":192,"code":"ML-13","category":"机器学习","question":"什么是线性回归？它的核心思想是什么？","answer":"**定义：** 用一条直线去拟合已知数据，让直线最大程度接近真实数据点，再用这条直线预测未知数据。\n\n**核心思想：** 找到最优的 w 和 b，使直线 y=wx+b 与数据点的误差最小。\n\n**线性 = 直线关系：** 自变量变化一点点，因变量均匀变化（如面积增加10平米，房价平均增加5万）。\n**回归 = 回归真实规律：** 从数据中找出一条直线，尽量接近真实房价。\n\n**一句话：** 找关系——从历史数据中找到自变量与因变量的线性关系，拿它去预测新数据。","extend":"**补充：** 核心=找最优w和b使直线y=wx+b与数据点误差最小；'线性'指参数线性，'回归'指拟合规律。\n**易错：** 线性指参数关系而非特征关系——多项式特征(x²)依然可用线性回归拟合曲线。\n**面试追问：** 线性回归是逻辑回归、神经网络、大模型理解的基础；房价预测是经典入门案例。","source":"v2.4","star":5,"bank":4},{"id":200,"code":"ML-21","category":"机器学习","question":"MAE、MSE、RMSE 三种损失函数的区别？如何选择？","answer":"| 对比项 | MAE | MSE | RMSE |\n|---|---|---|---|\n| 全称 | 平均绝对误差 | 均方误差 | 均方根误差 |\n| 对异常值敏感度 | 不敏感 | 敏感 | 敏感 |\n| 单位 | 和原始数据一致 | 原始单位的平方 | 和原始数据一致 |\n\n**选择：**\n- 异常值较多 → 用 MAE 更稳健\n- 想重点优化大误差样本 → 用 MSE\n- 需要单位可解释 → 用 RMSE\n\n**推荐：** 线性回归最常用 MSE。","extend":"**补充：** 选择依据——异常值多→MAE稳健；想重点优化大误差样本→MSE；需要单位可解释→RMSE；线性回归默认MSE。\n**易错：** 三种指标侧重点不同，面试常让比较敏感度与单位；RMSE≥MAE恒成立。\n**面试追问：** Huber损失是MAE与MSE的折中——小误差用平方、大误差用绝对值，兼顾稳健与可导。","source":"v2.4","star":5,"bank":4},{"id":202,"code":"ML-23","category":"机器学习","question":"请解释梯度下降法的核心思想？","answer":"**比喻（蒙眼下山）：** 蒙眼站在山顶，任务是走到山底——感觉哪个方向坡度最大，往最陡方向迈一步，重复直到山底。\n\n**对应关系：**\n- 山 = 损失函数曲线（横轴 w，纵轴 loss）\n- 山顶 = 初始的 w\n- 山底 = 最优的 w（loss 最小）\n- 坡度 = 梯度（导数）\n- 步长 = 学习率\n\n**过程：** ①选起点 ②算梯度判断下坡方向 ③w = w - 学习率×梯度 ④重复直到损失不再明显下降。\n**关键：** 线性回归损失函数是凸函数，梯度下降一定能找到全局最优解。","extend":"**补充：** 核心思想=蒙眼下山——沿最陡方向(梯度)迈步，重复直到山底(损失最小)。\n**对应：** 山=损失曲线、山底=最优w、坡度=梯度、步长=学习率。\n**易错：** 线性回归损失是凸函数，梯度下降必达全局最优；神经网络非凸可能陷入局部最优。\n**面试追问：** 三种变体——批量(全样本)、随机SGD(单样本)、小批量Mini-batch(折中，现代主流)。","source":"v2.4","star":5,"bank":4},{"id":208,"code":"ML-29","category":"机器学习","question":"线性回归模型如何评估？好的模型应该满足什么？","answer":"**评估指标：**\n- MSE：误差平方的平均值\n- RMSE：√MSE，单位和原始数据一致，最好解释\n- MAE：平均每个样本差多少\n\n**好模型的标准：**\n- 训练集和测试集误差都较小\n- 两者差距不大（训练集误差小、测试集误差大 = 过拟合）\n- RMSE 相对目标值范围较小（如房价范围 20-40 万，RMSE=2 万就不错）\n\n**终极目标：** 在“没见过”的数据（测试集）上表现也好。","extend":"**补充：** 评估指标——MSE/RMSE/MAE；好模型=训练集测试集误差都小且差距不大。\n**易错：** 训练误差小测试误差大=过拟合(学得太死)；RMSE相对目标值范围小才算好。\n**面试追问：** R²决定系数也常用——1-残差平方和/总平方和，越接近1拟合越好；终极目标是'没见过'的数据(测试集)上表现好。","source":"v2.4","star":5,"bank":4},{"id":210,"code":"ML-31","category":"机器学习","question":"什么是数据归一化（Min-Max）？公式是什么？","answer":"**定义：** 把数据按比例缩放到 [0,1] 区间，保留原始分布的形状。\n**公式：** X' = (X - Xmin) / (Xmax - Xmin)\n**API：** MinMaxScaler()，先 scaler.fit_transform(X_train)，再 scaler.transform(X_test)\n**特点：** 受最大值和最小值影响，对异常值敏感（异常值会压缩正常数据的分布）。","extend":"**补充：** Min-Max公式X'=(X-Xmin)/(Xmax-Xmin)缩放到[0,1]并保留分布形状；API用MinMaxScaler。\n**易错：** 受最大值最小值影响，对异常值敏感——极端值会压缩正常数据分布；训练集fit_transform、测试集只transform。\n**代码：**\n```python\nfrom sklearn.preprocessing import MinMaxScaler\nscaler = MinMaxScaler(); X_train = scaler.fit_transform(X_train)\n```\n**面试追问：** feature_range=(a,b)可缩放任意区间；图像像素/255本质就是Min-Max缩放。","source":"v2.4","star":5,"bank":4},{"id":212,"code":"ML-33","category":"机器学习","question":"归一化和标准化的区别？","answer":"| 对比项 | 归一化 Min-Max | 标准化 Z-Score |\n|---|---|---|\n| 公式 | (X-Xmin)/(Xmax-Xmin) | (X-μ)/σ |\n| 结果范围 | [0,1] 固定区间 | 无固定范围，均值0标准差1 |\n| 对异常值 | 敏感 | 较稳健 |\n| 适用 | 图像/有明确上下界 | 梯度下降类模型 |\n\n**一句话：** 需要固定区间用归一化，常规机器学习优先标准化。","extend":"**补充：** 归一化=固定[0,1]区间、受异常值影响；标准化=均值0标准差1、无固定范围、对异常值稳健。\n**易错：** 归一化不改变分布形状只改变尺度；标准化后数据有正有负。\n**面试追问：** 常规机器学习优先标准化；聚类/距离计算也常标准化消除量纲；决策树/随机森林基于阈值划分对缩放不敏感。","source":"v2.4","star":5,"bank":4},{"id":213,"code":"ML-34","category":"机器学习","question":"什么场景优先用标准化？什么场景用归一化？","answer":"**优先标准化（Z-Score）：**\n- 梯度下降模型：线性回归、逻辑回归、深度学习\n- 各特征量纲差异大的常规机器学习\n\n**优先归一化（Min-Max）：**\n- 计算机视觉图像数据（像素 0~255 → 0~1）\n- 激活函数为 Sigmoid/Tanh 的网络（匹配输出区间）\n- 明确需要 0~1 区间输出、输入有明确上下界","extend":"**补充：** 优先标准化——梯度下降类模型(线性回归/逻辑回归/深度学习)、量纲差异大的常规机器学习；优先归一化——图像像素(0~255→0~1)、Sigmoid/Tanh激活网络、明确需要0~1区间的场景。\n**易错：** 标准化是默认首选，归一化只在明确需要固定区间时使用。\n**面试追问：** 特征量纲差异大(年龄20-60 vs 收入0-百万)不缩放会让大数值特征主导；树模型(XGBoost等)不需要缩放。","source":"v2.4","star":5,"bank":4},{"id":216,"code":"ML-37","category":"机器学习-逻辑回归","question":"什么是逻辑回归？它解决什么问题？","answer":"**定义：** 逻辑回归是机器学习中最基础、最常用的分类算法，本质是“线性回归 + sigmoid 函数”。\n**解决：** 分类问题——给定数据判断属于哪一类（是/否、好/坏、正常/异常）。\n**场景：** 主要用于二分类（两个类别）；虽然也能做多分类，但不如二分类常用。\n**输出：** 类别 1 的概率（0~1），如输出 0.7 表示 70% 概率属于类别 1。","extend":"**补充：** 逻辑回归=线性回归+sigmoid函数做分类；输出类别1的概率(0~1)。\n**易错：** 名字带'回归'实为分类算法；主要用于二分类，多分类用OvR或Softmax。\n**面试追问：** 决策边界是线性的(wx+b=0)；逻辑回归是神经网络/大模型理解的基础(神经元=线性变换+激活)。","source":"v2.4","star":5,"bank":4},{"id":219,"code":"ML-40","category":"机器学习-逻辑回归","question":"逻辑回归的完整预测流程？","answer":"**三步：**\n①线性回归：计算 z = wx + b（把特征加权求和）\n②sigmoid 映射：hθ(x) = 1/(1+e⁻ᶻ)，得到 0~1 的概率\n③阈值判断：概率 ≥ 阈值（默认0.5）→ 类别1，否则 → 类别0\n\n**例子：** 湿度85 × 权重0.3 + 偏置(-25) → z=0.5 → sigmoid ≈ 0.62 → 62% 概率下雨 → 判为下雨。","extend":"**补充：** 完整流程三步——①线性z=wx+b②sigmoid映射为概率③阈值判断类别。\n**代码：**\n```python\nmodel.predict_proba(X)   # 返回[P(0), P(1)]两列概率\nmodel.predict(X)         # 直接返回类别\n```\n**易错：** predict_proba返回两列(负类概率+正类概率)，取[:,1]才是类别1概率；用概率可以自定义阈值。\n**面试追问：** 决策边界是z=0这条线；调整阈值可改变精确率与召回率的权衡(业务决策)。","source":"v2.4","star":5,"bank":4},{"id":229,"code":"DL-1","category":"深度学习","question":"什么是深度学习？它与人工智能、机器学习的关系？","answer":"**定义：** 深度学习是机器学习的一个分支，核心是用'很多层'的神经网络自动学习特征——从原始数据中一层层抽象出越来越高级的特征。\n\n**关系：** AI是让机器变聪明的总目标；ML是让机器从数据中学的方法；DL是ML里最火的一种——多层神经网络。\n\n**核心优势：** 自动提取特征，不需要人工设计特征。\n**'深度'含义：** 网络层数多，低层学边缘→中层学形状→高层学完整物体。","extend":"**面试追问：** 与传统ML区别——DL自动学特征(ML靠人工特征工程)；DL需大数据(万级以上)+GPU，ML小数据(几百~几千条)即可；DL可解释性差(黑盒)，ML可解释(如逻辑回归权重)。\n**选型：** 非结构化数据(图像/文本/语音)+数据量大→DL；结构化表格+小数据+要解释→ML。\n**历史：** 2012年AlexNet(图像)、2017年Transformer(文本)是两大转折点。","source":"v2.4","star":4,"bank":4},{"id":233,"code":"DL-5","category":"深度学习","question":"请解释什么是'深度'网络？为什么需要激活函数？","answer":"**深度=层数多：** 输入层→多个隐藏层→输出层，每层输出作为下层输入。\n\n**层次化特征学习：** 第1层学边缘，第2-3层学形状，第4层+学完整物体——模型自己从数据中学，不需要人工设计特征。\n\n**为什么必须激活函数：** 多层线性层叠加等价于一个线性层(y=W3(W2(W1x+b1)+b2)+b3=W合并x+b合并)——不加非线性'打断线性'，再深也和单层一样。\n\n**常见激活：** ReLU(隐藏层默认)、Sigmoid(二分类输出)、Softmax(多分类输出)、Tanh(RNN隐藏层)。","extend":"**面试追问：** 为什么多层线性层叠加等于一层——展开后y=W合并x+b合并仍是线性变换，所以必须加非线性激活函数'打断线性'。\n**四种激活：** ReLU=max(0,x)隐藏层默认首选(计算快+缓解梯度消失)；Sigmoid压到(0,1)二分类输出层；Softmax多分类输出(和为1)；Tanh压到(-1,1)RNN隐藏层。\n**激活函数效果：** 没有它多层网络等价于单层，'深度'优势无法发挥。","source":"v2.4","star":5,"bank":4},{"id":236,"code":"DL-8","category":"深度学习","question":"请解释什么是过拟合？如何防止过拟合？","answer":"**过拟合：** 训练集表现极好(几乎0误差)，测试集表现差——模型'死记硬背'了训练数据，没学到通用规律。\n\n**判断：** 训练损失持续下降、测试损失不再下降甚至上升=过拟合。\n\n**防止方法：**\n1. 增加数据(最有效)\n2. 数据增强：图像翻转/旋转/裁剪\n3. Dropout：训练时随机'关掉'部分神经元(0.2~0.5)\n4. Early Stopping：测试集不提升就停止\n5. 减小模型：减少层数/神经元\n\n**BatchNorm：** 批量归一化，稳定训练、加速收敛、缓解梯度消失。","extend":"**面试追问：** 欠拟合=训练测试都差(学渣)；正常拟合=训练测试都好(学霸)；过拟合=训练好测试差(书呆子背答案)。\n**Dropout细节：** 只在训练时开启，测试/推理时所有神经元启用；失活概率0.2~0.5；位置在线性层/卷积层后+激活后。\n**BatchNorm位置：** 线性层后、激活函数前；num_features须与上一层输出维度一致；训练测试都用。\n**最优先：** 加数据>数据增强>Dropout，三个做了还过拟合再考虑其他。","source":"v2.4","star":5,"bank":4},{"id":237,"code":"DL-9","category":"深度学习","question":"请解释什么是反向传播？PyTorch如何自动完成？","answer":"**反向传播(BP)：** 从输出层往输入层计算每个权重的梯度，用链式法则逐层求导——'追责任'：这个误差是谁造成的？哪个权重该调多少？\n\n**三步：** 算差距(损失)→追责任(链式法则从输出层往前逐层算梯度)→改正(按梯度更新权重)。\n\n**PyTorch自动完成：** 只需三行——loss=criterion(pred,target)算损失→loss.backward()自动反向传播→optimizer.step()更新权重。\n\n**生活类比：** 投篮不进→回想是手腕还是角度问题→调整姿势再投。","extend":"**面试追问：** 链式法则——y=f(z),z=g(u),u=h(x)，每层导数相乘；RNN中梯度反复乘W_hh和tanh'导致梯度消失。\n**梯度含义：** 损失对权重的导数，指示往哪调能减少损失；w=w-学习率×梯度沿反方向更新。\n**前向传播：** 数据从输入到输出的流动=model(x)；BP是自动的，只需定义forward——backward由Autograd自动算。","source":"v2.4","star":5,"bank":4},{"id":240,"code":"DL-12","category":"深度学习","question":"请解释RNN的原理？为什么它能记住上下文？","answer":"**RNN核心：** 给网络装了一个'小本本'——隐藏状态h。每读一个词做三件事：看当前词、翻小本本(看前面记忆)、把当前词和旧记忆混合成新记忆记回去。\n\n**公式：** 新记忆 = tanh(旧记忆×权重 + 当前词×权重 + 偏置)\n\n**代码：** nn.RNN(input_size, hidden_size, num_layers)\n- input_size：词嵌入维度\n- hidden_size：记忆容量(小本本大小)\n- num_layers：叠几层\n\n**记忆局限：** RNN约能记住10~20个词(长距离依赖问题)。","extend":"**面试追问：** 读小说比喻——每读一字脑子里留着'前面发生了什么'的印象=隐藏状态；'我爱你'vs'你爱我'顺序不同意思相反，前馈网络无记忆。\n**代码细节：** output(每时间步记忆)[batch,seq,hidden]；h_last(最后一步全局记忆)[layers,batch,hidden]；output[:,-1,:]与h_last验证用torch.allclose。\n**RNN短板：** 小本本只有那么大，新内容挤淡旧记忆(约记住10~20词)；缓解：缩短序列、梯度裁剪、换LSTM/GRU、换Transformer。","source":"v2.4","star":5,"bank":4},{"id":243,"code":"DL-15","category":"深度学习","question":"请解释RNN的梯度消失问题及解决方法？","answer":"**原因：** 反向传播时梯度反复乘以循环权重矩阵W_hh和tanh导数(取值0~1且绝大多数远小于1)——每往回传一步梯度缩小一点，10步后几乎为0，开头的字收不到训练信号。\n\n**表现：** 记不住长距离信息——'我小时候住在北京…我最爱的城市是___'填'北京'。\n\n**解决：**\n- 换LSTM/GRU：门控提供梯度'高速公路'\n- 梯度裁剪：防爆炸不防消失\n- 换Transformer：自注意力一步直达，根子上规避","extend":"**面试追问：** 前向记忆衰减(0.9^50≈0.005)与反向梯度消失是两个层面——训练学不到东西的根源是后者；tanh导数0~1且多数远小于1。\n**表现：** '我小时候住在北京…最爱的城市是___'隔五六十个字，RNN记不住。\n**解决：** LSTM/GRU门控给梯度'高速公路'；梯度裁剪防爆炸(不解决消失)；Transformer自注意力一步直达根子上规避；RNN约记10~20个词(seq_len=10-20)。","source":"v2.4","star":5,"bank":4},{"id":244,"code":"DL-16","category":"深度学习","question":"请解释LSTM的原理和三个门的作用？","answer":"**LSTM(长短期记忆)：** 1997年Hochreiter提出，给RNN加了一条'记忆传送带'细胞状态C，信息在C上几乎无损传递。\n\n**三个门(都是sigmoid输出0~1)：**\n- 遗忘门：决定忘掉多少旧记忆(哪些旧笔记该扔了)\n- 输入门：决定存入多少新信息(新知识记多少)\n- 输出门：决定输出什么(考试提取哪些知识答题)\n\n**更新：** 新记忆 = 遗忘门×旧记忆 + 输入门×候选记忆\n\n**为什么解决梯度消失：** C上有加法通路，梯度可直接传回去，不用经过会缩小的tanh——给梯度开'高速公路'。","extend":"**面试追问：** 三个门都用sigmoid(开关0~1)，候选记忆C̃和输出h=o×tanh(C)用tanh(内容)；门看h旧和x当前。\n**代码：** nn.LSTM(input,hidden,batch_first=True)，返回(out,(h_n,c_n))——LSTM有两个隐藏状态h和C，与RNN/GRU返回(out,hidden)不同。\n**名字拆解：** Long-Term长期(记很久以前)+Short-Term短期(关注当前)+Memory(记忆管理)；RNN一条路走到底，LSTM加'记忆传送带'C三扇门管理。","source":"v2.4","star":5,"bank":4},{"id":245,"code":"DL-17","category":"深度学习","question":"LSTM和GRU的区别？如何选择？","answer":"| 对比项 | LSTM | GRU |\n|---|---|---|\n| 门数量 | 3个(遗忘/输入/输出) | 2个(重置/更新) |\n| 记忆通路 | C+h两条 | 只有h一条 |\n| 参数量 | 多(约多1/3) | 少 |\n| 训练速度 | 稍慢 | 稍快 |\n| 效果 | 很好 | 差不多 |\n\n**GRU精简：** 把遗忘门+输入门合并成更新门，把C+h合并成只有h。\n\n**选择：** 先试GRU(参数少训练快)；效果不够再换LSTM(长距离更强)；基本不选普通RNN(除非序列<5步)。","extend":"**面试追问：** GRU两门——重置门(过去记忆还重要吗？不重要清零重来)、更新门(新旧比例，保留多少旧+加入多少新≈1)。\n**代码：** RNN/LSTM/GRU代码几乎一样只差类名；GRU返回(out,hidden)和RNN一致。\n**提出年份：** RNN 1980s、LSTM 1997、GRU 2014；小数据集GRU通常最好(参数少防过拟合)，大数据长序列LSTM可能更好。","source":"v2.4","star":5,"bank":4},{"id":250,"code":"DL-22","category":"深度学习","question":"自注意力、交叉注意力、多头注意力、掩码注意力的区别？","answer":"**四种注意力：**\n- 自注意力：Q/K/V都来自同一条序列——捕捉序列内部长距离依赖(BERT/GPT编码层)\n- 交叉注意力：Q来自目标序列，K/V来自源序列——两个序列语义对齐(机器翻译)\n- 多头注意力：Q/K/V拆成h个子空间并行计算再拼接——多视角学习(BERT/GPT核心)\n- 掩码注意力：自注意力+禁看未来(上三角掩码)——保证因果性(GPT/LLaMA生成)\n\n**一句话：** 自=自己看自己；交叉=两个序列互看；多头=多组Q/K/V多角度看；掩码=自注意力+禁看未来。","extend":"**面试追问：** 代码——多头拆成(B,h,seq,d_k)并行算注意力再Concat+W^O投影；传(x,x,x)是自注意力，传(y,x,x)是交叉注意力(Q来自y)。\n**多头直觉：** 不同头可能关注语法依赖/语义相似/位置距离等不同模式——训练后涌现，非设计目标。\n**易错：** Q/K/V由不同W^Q/W^K/W^V投影值不同；注意力权重是softmax结果，输出=权重×V；掩码注意力=自注意力+因果掩码用于GPT/LLaMA生成。","source":"v2.4","star":5,"bank":4},{"id":253,"code":"DL-25","category":"深度学习","question":"请描述Transformer的整体架构？","answer":"**整体：** 编码器Encoder(理解) + 解码器Decoder(生成)，各堆叠N层(如6层)。\n\n**流程：** 输入文本→词嵌入→位置编码→Encoder(全局语义理解)→Decoder(逐字生成)→线性+Softmax输出概率。\n\n**Encoder单层(4步)：** 多头自注意力→残差+层归一化→前馈网络FFN→残差+层归一化。\n\n**Decoder单层(比Encoder多一层注意力)：** 掩码多头自注意力→交叉注意力(用Encoder输出做K/V)→FFN，各配残差+归一化。\n\n**核心：** 自注意力抓全局关联，残差+归一化保障深层训练稳定。","extend":"**面试追问：** BERT只用Encoder(理解/问答/分类)，GPT只用Decoder(生成)；ViT把图像切patch当序列。\n**FFN：** 每个词独立过两层全连接(中间维度通常d_model×4)对特征深度加工。\n**交叉注意力：** Decoder用当前生成词(Q)查询编码器输出语义(K/V)保证生成不跑偏——'对齐'；位置编码在词嵌入后叠加。","source":"v2.4","star":5,"bank":4},{"id":254,"code":"DL-26","category":"深度学习","question":"为什么Transformer需要位置编码？","answer":"**原因：** Transformer没有循环结构，自注意力是'置换不变'的——不区分词序。'我打他'和'他打我'词一样顺序不同意思相反，模型无法区分。\n\n**作用：** 给每个词加'座位号'，把位置信息注入词向量(词向量+位置向量叠加)。\n\n**实现：** 原论文用正弦/余弦函数生成位置编码(偶数维sin、奇数维cos)。\n\n**为什么用三角函数：** 数值限制在-1~1之间训练稳定；模型可通过数学关系推断相对位置。\n\n**注意：** PyTorch原生nn.Transformer不带位置编码，需自己实现。","extend":"**面试追问：** 座位牌比喻——10人一桌各坐1号位，坐错位上菜就乱；'老王看到小李…他走上前'无位置信息无法区分'他'指谁。\n**代码：** PositionalEncoding生成pe(max_len,embed_size)，偶数维sin奇数维cos，register_buffer注册(随模型保存/切设备)，forward里x+pe[:seq_len]。\n**三角好处：** 数值限制-1~1训练稳定；模型可推算相对位置(知506房间和508房间推出507)；PyTorch原生nn.Transformer不带位置编码需自己加。","source":"v2.4","star":5,"bank":4},{"id":259,"code":"FS-1","category":"FastAPI","question":"FastAPI是什么？与Flask/Django相比有何核心优势？为什么AI应用开发常用它？","answer":"**FastAPI：** 用Python写高性能API的Web框架，基于Starlette(异步)+Pydantic(验证)，性能和NodeJS/Go并肩。\n\n**三框架对比：**\n| 对比项 | Flask | Django | FastAPI |\n|---|---|---|---|\n| 定位 | 轻量微框架 | 全栈大框架 | 高性能API框架 |\n| 性能 | 同步一般 | 同步一般 | 异步极高 |\n| 接口文档 | 手动 | 需插件 | 自动(Swagger) |\n| 数据验证 | 手动 | 表单/DRF | Pydantic自动 |\n\n**核心优势：** 开发快(省代码)、自动文档、自动数据验证、异步高性能。\n**AI场景：** agent服务化/模型推理API/LangChain后端几乎都是FastAPI——AI应用开发工程师高频考点。","extend":"**面试追问：** FastAPI自动生成Swagger/ReDoc文档；基于Pydantic做数据验证；原生async支持。AI应用开发中LangChain/LangServe、agent服务化、模型推理API几乎都用FastAPI——大模型应用工程师简历里的\"AI服务化\"项目必备。\n**选型：** Flask小项目/原型、Django大型全栈、FastAPI高性能API服务/微服务。","source":"v2.4","star":4,"bank":4},{"id":265,"code":"FS-7","category":"FastAPI","question":"FastAPI异步接口的原理？async def里为什么不能用time.sleep()？","answer":"**同步vs异步：**\n- 同步(排队)：请求1等2秒再处理请求2，总耗时4秒\n- 异步(并行)：等待IO时处理其他请求，总耗时2秒\n\n**关键规则：**\n- async def里用time.sleep() = **卡死整个服务器**\n- 因为time.sleep是同步阻塞，会阻塞事件循环\n- 必须用 await asyncio.sleep() 等异步替代\n\n**适用场景：**\n- def：简单返回、计算型任务\n- async def：IO密集型(数据库查询/网络请求/文件读写)\n\n**结论：** 无异步操作时加不加async没区别。","extend":"**易错：** async函数里用time.sleep()会卡死整个服务器(事件循环被阻塞)；必须用await asyncio.sleep()。\n**追问：** 没有IO操作时加不加async都一样；同步接口用def、IO密集型用async def。\n**原理：** 异步=等待IO时释放CPU处理其他请求，同步=排队等待。","source":"v2.4","star":4,"bank":4},{"id":374,"code":"NLP-1","category":"大模型应用","question":"介绍一下 BERT？BERT 和 BiLSTM 有什么区别？BERT 和 Attention 是什么关系？","answer":"**BERT（Bidirectional Encoder Representations from Transformers）：** 基于 Transformer Encoder 堆叠的双向预训练语言模型，通过 MLM（掩码语言模型）+ NSP（下一句预测）两个任务在大规模语料上预训练，再微调下游任务。\n\n**BERT vs BiLSTM：**\n- BiLSTM 是循环结构，串行处理、难以并行，长距离依赖靠隐状态逐层传递；BERT 用自注意力，可并行、直接建模任意两词间关系\n- BiLSTM 通常从零训练；BERT 大规模预训练 + 微调，泛化能力更强\n\n**BERT 和 Attention 的关系：** BERT 的 Encoder 内部核心就是多头自注意力（Multi-Head Self-Attention），Attention 是 BERT 的基本组成单元。","extend":"**面试追问：** BERT 是双向（看上下文两侧），GPT 是单向（只看左侧），这是两者本质区别；BERT 适合理解类任务（分类/NER），GPT 适合生成类任务。","source":"bh-fixed","star":5,"bank":4},{"id":380,"code":"NLP-7","category":"大模型应用","question":"BERT 和 Transformer 的区别？","answer":"BERT 是基于 Transformer 架构的模型，但有几个关键差异：\n- BERT 只用 Transformer 的 **Encoder** 部分，舍弃 Decoder\n- BERT 编码器含 **12 层** Encoder Block，原始 Transformer 是 6 层\n- BERT 的位置编码是**可训练的**，Transformer 中是写死的正余弦编码\n- BERT 激活函数用 **GELU**，Transformer 用 ReLU","extend":"**面试追问：** 正因只用 Encoder，BERT 擅长理解类任务（分类、NER、句对关系）；GPT 只用 Decoder 做生成。","source":"bh-fixed","star":5,"bank":4},{"id":387,"code":"DB-51","category":"缓存与Redis","question":"Redis 的 5 大数据类型分别是什么？各自适用什么场景？","answer":"**5 大数据类型（核心必会）：**\n\n| 类型 | 结构 | 典型场景 |\n|---|---|---|\n| String 字符串 | 键值对 | 缓存、计数器、分布式锁、验证码 |\n| Hash 哈希 | 字段-值 | 存对象(用户信息)、购物车 |\n| List 列表 | 有序队列 | 消息队列、最新消息 |\n| Set 集合 | 去重无序 | 共同好友、去重、抽奖 |\n| ZSet 有序集合 | 带分值 | 排行榜、延迟队列 |\n\n**String 最常用，命令：** set/get 存取值；setnx(key 不存在才设置，抢锁)；mset/mget 批量；incr/decr/incrby 数字自增(原子)；expire/ttl 过期。\n\n**命名习惯：** key 用冒号分层级，如 `article:100:views`（类型:ID:属性）。","extend":"**易错：** 命令不区分大小写，但 key 区分大小写。\n**追问：** INCR 是原子操作，100 人同时点也不会加错——这是数据库字段自增做不到的，天然适合高并发计数。","source":"yd","star":5,"bank":4},{"id":389,"code":"DB-53","category":"缓存与Redis","question":"Redis 如何实现分布式锁（秒杀防超卖）？为什么必须一条命令完成？","answer":"**问题：** 多台服务器同时处理同一任务时，普通代码锁只对单机有效，跨机器必须用分布式锁。\n\n**一条命令实现：**\n```\nSET lock:goods:1 抢锁人 NX EX 30\n# NX：key 不存在才设置成功(=抢到锁)\n# EX 30：30 秒自动释放(防死锁)\n```\n\n**Python 异步版（FastAPI 场景）：**\n```python\nok = await r.set(f\"lock:goods:{id}\", \"userA\", nx=True, ex=30)\nif ok:\n    return f\"恭喜你抢到订单{id}\"\nelse:\n    return f\"手速慢了订单{id}已被抢走\"\n```\n\n**关键：** setnx + expire 必须合并成一条 set(NX EX)，保证\"抢锁 + 设过期\"原子完成。若分开两步，抢到锁后程序崩溃，锁永远不释放，大家全卡死。","extend":"**易错：** 锁一定要设过期时间(EX)，否则拿到锁的程序崩了会死锁。\n**追问：** 生产级分布式锁还需考虑锁续期(看门狗)、锁误删(用唯一值校验)、RedLock 等，可用 Redisson 等成熟方案。","source":"yd","star":5,"bank":4},{"id":392,"code":"NG-1","category":"Nginx","question":"Nginx 是什么？核心特点和应用场景有哪些？","answer":"**Nginx：** 一个网页服务器，负责\"接收浏览器请求，把网页、图片、数据返回给浏览器\"。目前全世界使用率最高的 Web 服务器之一，每 3 个网站约 1 个在用。\n\n**四个字：快、稳、轻、省**\n- 快：异步事件驱动，单进程服务成千上万请求，单台扛几万并发\n- 稳：后端崩了也能兜住，返回友好页面而非白屏\n- 轻：安装包几 MB，内存占用极低\n- 省：免费开源，配置简单\n\n**应用场景：** 静态资源服务器、反向代理、负载均衡、HTTPS 网关、限流/防盗链/动静分离。","extend":"**追问：** Nginx 高并发靠\"异步非阻塞 + 事件驱动\"，一个 worker 进程可同时处理大量连接，区别于 Apache 的\"一个连接一个进程\"。","source":"yd","star":5,"bank":4},{"id":394,"code":"NG-3","category":"Nginx","question":"什么是反向代理？和正向代理有什么区别？","answer":"**反向代理：** Nginx 收到用户请求后自己不处理，转交给后端程序处理，再把结果拿回给用户。\n\n**三大好处：**\n1. 隐藏后端：用户只跟 Nginx 打交道，不知道后端真实地址，更安全\n2. 统一入口：不管后端是 FastAPI 还是 Java，前端只认 Nginx 一个地址\n3. 为负载均衡铺路：多后端时统一调度\n\n**正向 vs 反向：**\n| 类型 | 代理对象 | 方向 |\n|---|---|---|\n| 正向代理 | 代理客户端 | 替你访问别人(翻墙/VPN) |\n| 反向代理 | 代理服务端 | 替别人接待你(Nginx) |\n\n**一句话：** 正向代理代理客户端；反向代理代理服务端。","extend":"**口诀：** 正向代理\"替你上网\"，反向代理\"替你接待\"。结构：用户→代理→目标(正向)；用户→Nginx→后端(反向)。","source":"yd","star":5,"bank":4},{"id":396,"code":"NG-5","category":"Nginx","question":"Nginx 如何实现负载均衡？有哪几种分配策略？","answer":"**负载均衡：** 流量大时多开几台后端，Nginx 当\"叫号机\"把请求均匀分配。\n\n**配置：** 先定义后端组 upstream，再 proxy_pass 转发给整个组：\n```nginx\nhttp {\n    upstream backend {\n        server 127.0.0.1:8001;\n        server 127.0.0.1:8002;\n        server 127.0.0.1:8003;\n    }\n    server {\n        listen 80;\n        location / {\n            proxy_pass http://backend;\n        }\n    }\n}\n```\n\n**4 种策略：**\n| 策略 | 配置 | 说明 |\n|---|---|---|\n| 轮询(默认) | 不写 | 顺序轮流，机会均等 |\n| 权重 | `server ... weight=3;` | 配置好的多分担 |\n| ip_hash | `ip_hash;` | 同一 IP 固定一台(会话保持) |\n| 最少连接 | `least_conn;` | 谁连接少分给谁 |\n\n**健康检查：** 某台后端失败，Nginx 自动摘除，恢复后再加回。","extend":"**追问：** ip_hash 解决 session 共享问题(同一用户固定后端)；生产环境常配第三方健康检查模块(nginx_upstream_check_module)。","source":"yd","star":5,"bank":4},{"id":399,"code":"NG-8","category":"Nginx","question":"前后端分离项目如何用 Nginx 部署？（静态页面 + API 代理）","answer":"**思路：** 前端页面 Nginx 管，后端接口 Nginx 代理过去，一个 80 端口全搞定。\n\n**配置：**\n```nginx\nserver {\n    listen 80;\n    server_name localhost;\n    # 静态页面：/ 下的请求返回前端网页\n    location / {\n        root myweb;\n        index index.html;\n    }\n    # 动态接口：/api 开头的请求转发给 FastAPI\n    location /api/ {\n        proxy_pass http://127.0.0.1:8000;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n    }\n    # FastAPI 文档路由也要代理\n    location /docs      { proxy_pass http://127.0.0.1:8000; }\n    location /openapi.json { proxy_pass http://127.0.0.1:8000; }\n}\n```\n\n**验证：** `http://localhost/` 显示静态网页；`http://localhost/api/users` 返回 FastAPI 的 JSON。","extend":"**易错：** 前后端分离要同时代理 /api、/docs、/openapi.json 等路由，漏了 /docs 会导致 Swagger 文档打不开。\n**追问：** 前端开发用 Vite(5173 端口)，生产由 Nginx 托管打包后的静态文件即可。","source":"yd","star":5,"bank":4},{"id":400,"code":"HTTP-1","category":"HTTP协议","question":"HTTP 报文结构是什么？请求报文和响应报文各分几部分？","answer":"**一句话记忆：\"行-头-空-体\"四段式。**\n\n**请求报文（客户端→服务器）：**\n```\nGET /index.html HTTP/1.1        ← 请求行(方法+路径+版本)\nHost: www.example.com           ← 请求头\nUser-Agent: Chrome/120\n\n                                ← 空行(分隔头部和体)\nusername=alice&password=123     ← 请求体(仅 POST/PUT 有)\n```\n\n**响应报文（服务器→客户端）：**\n```\nHTTP/1.1 200 OK                 ← 状态行(版本+状态码+描述)\nContent-Type: text/html         ← 响应头\n\n                                ← 空行\n<html>...</html>                ← 响应体(真正的数据)\n```\n\n**四部分：** ①行(请求行/状态行) ②头(元信息) ③空行(分隔) ④体(数据)。","extend":"**追问：** 空行是必须的，用来分隔头部和体，没有空行接收方无法区分头部在哪结束。","source":"yd","star":5,"bank":4},{"id":401,"code":"HTTP-2","category":"HTTP协议","question":"GET / POST / PUT / PATCH / DELETE 的区别？什么是幂等性？","answer":"| 方法 | 含义 | 典型场景 | 请求体 | 幂等 |\n|---|---|---|---|---|\n| GET | 查询/获取 | 搜索、查看详情 | ❌ 无 | ✅ |\n| POST | 新增/提交 | 登录注册、发评论、上传 | ✅ 有 | ❌ |\n| PUT | 整体更新 | 修改全部资料 | ✅ 有 | ✅ |\n| PATCH | 局部更新 | 只改头像、昵称 | ✅ 有 | ❌ |\n| DELETE | 删除 | 删除订单、评论 | ❌ 通常无 | ✅ |\n\n**幂等性：** 无论调用多少次，结果都一样。\n- GET 查一百次，数据不变 → 幂等\n- DELETE 删一次和删一百次结果一样(第二次返回 404) → 幂等\n- POST 发两次评论生成两条 → 不幂等\n\n**GET vs POST：** GET 参数在 URL 上(能收藏/缓存，不能传敏感数据)；POST 数据在 body 里(适合登录、上传)。","extend":"**易错：** PUT 是\"整体替换\"，PATCH 是\"局部修改\"，这是两者最常被问的区别。\n**追问：** GET 有长度限制(受 URL 长度限制)且参数暴露在地址栏，敏感信息必须用 POST。","source":"yd","star":5,"bank":4},{"id":402,"code":"HTTP-3","category":"HTTP协议","question":"HTTP 状态码如何分类？常见状态码分别代表什么？","answer":"**看第一位数字就知道是哪类问题：**\n| 分类 | 范围 | 含义 |\n|---|---|---|\n| 1xx | 100-199 | 信息类，服务器还在处理 |\n| 2xx | 200-299 | 成功 |\n| 3xx | 300-399 | 重定向 |\n| 4xx | 400-499 | 客户端错误(你的问题) |\n| 5xx | 500-599 | 服务端错误(后端的问题) |\n\n**常见状态码：**\n- 200 OK 成功；201 Created 创建成功\n- 301 永久重定向(http→https)；302 临时重定向(未登录跳登录页)；304 用缓存\n- 400 请求格式错；401 未认证；403 无权限；404 资源不存在；405 方法不允许；429 请求太频繁\n- 500 服务器内部错误；502 网关错误(Nginx 连不上后端)；503 服务不可用；504 网关超时\n\n**趣味记忆：** 2xx 开心、3xx 转向、4xx 你错了、5xx 我错了。","extend":"**追问：** 401 vs 403——401 是\"未登录(没认证)\"，403 是\"登录了但没权限\"。\n**易错：** 502 常见于反向代理后端挂了，504 是后端响应超时。","source":"yd","star":5,"bank":4},{"id":404,"code":"HTTP-5","category":"HTTP协议","question":"什么是跨域 CORS？为什么浏览器要限制？如何用 FastAPI 解决？","answer":"**跨域：** 页面上的 JS 请求另一个\"源\"(协议+域名+端口三者任一不同)的资源。\n\n**同源判断：** 协议、域名、端口完全一致才叫同源，否则就是跨域。\n\n**为什么限制（同源策略）：** 安全机制。若没有它，打开恶意网站 evil.com 时，其 JS 可偷偷请求 bank.com 的 API 读取你的转账记录。\n\n**典型场景：** 前端 Vue(3000 端口) 请求后端 FastAPI(8000 端口) → 端口不同 → 跨域被拦。\n\n**FastAPI 解决（CORSMiddleware）：**\n```python\nfrom fastapi.middleware.cors import CORSMiddleware\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=[\"*\"],      # 允许的来源\n    allow_credentials=True,   # 允许携带 cookie/token\n    allow_methods=[\"*\"],      # 允许的 HTTP 方法\n    allow_headers=[\"*\"],      # 允许的请求头\n)\n```\n\n**本质：** 浏览器发现跨域先问服务器\"你允许吗\"，服务器响应头说\"允许\"，浏览器才把数据交给前端。","extend":"**易错：** 生产环境 allow_origins 不要用 `*`(尤其配 allow_credentials=True 时)，应列出具体域名。\n**追问：** 预检请求(OPTIONS)是浏览器在跨域+非简单请求时先发的探测请求。","source":"yd","star":5,"bank":4},{"id":408,"code":"LLM-2","category":"大模型应用","question":"什么是 RAG？为什么要用 RAG 知识库？","answer":"**RAG(Retrieval-Augmented Generation，检索增强生成)：** 大模型外挂知识库的核心方案——先从外部知识库检索相关内容，再把它拼进提示词交给大模型生成，让答案\"有据可依\"。\n\n**为什么用知识库（解决大模型两大痛点）：**\n1. **知识过时：** 模型训练数据有截止时间，不知道最新信息\n2. **幻觉问题：** 模型会一本正经地编造不存在的内容\n\n**核心价值：** 不重新训练模型，就能让模型回答\"私有/最新/专业\"的数据；答案可溯源，减少幻觉。\n\n**典型场景：** 企业内部知识库问答、客服机器人、文档助手。","extend":"**追问：** RAG 和微调的区别——RAG 是\"外挂知识\"不改模型，微调是\"把知识学进模型\"；两者可结合。","source":"note","star":5,"bank":4},{"id":409,"code":"LLM-3","category":"大模型应用","question":"RAG 知识库的完整工作原理是什么？（两大阶段）","answer":"**整体分两大阶段：知识更新(离线建库) + 知识检索(在线问答)。**\n\n**一、知识更新（离线索引阶段）：**\n1. **文档加载解析** —— 把 PDF/文档/网页等非结构化数据解析为标准格式，清洗补全\n2. **文件分块(chunking)** —— 把长文本拆成短块，避免向量化丢失细节\n3. **向量化(Embedding)** —— 用嵌入模型把每个文本块转成高维语义向量\n4. **写入向量数据库** —— 向量 + 原始文本一起存，用于相似度检索\n\n**二、知识检索（在线问答阶段）：**\n5. **Query 提问** —— 用户输入问题\n6. **知识检索** —— 问题同样过 Embedding 转向量，在向量库算相似度召回最相关的 chunks\n7. **重排序(Rerank)** —— 对召回候选做二次精排，筛出最匹配内容\n8. **增强(Prompt 拼接)** —— 把相关知识块 + 用户问题拼成\"带外部知识的增强 Prompt\"\n9. **生成** —— 输入 LLM，基于提示中的知识生成有依据的答案","extend":"**追问：** 检索质量决定 RAG 上限——\"垃圾进垃圾出\"，分块、向量化、重排序每一步都影响最终效果。","source":"note","star":5,"bank":4},{"id":411,"code":"LLM-5","category":"大模型应用","question":"RAG 中为什么要分块(chunking)？如何分块？","answer":"**为什么要分块：**\n- 长文本直接向量化会丢失细节，检索粒度太粗\n- 切成小块后，向量能更精准地表达局部语义，检索更准\n\n**三种分块方式：**\n1. **固定长度 + 重叠窗口** —— 按固定字符数切，块间保留重叠，避免语义被切断\n2. **特殊字符分块** —— 按段落/标题/标点等结构化标记切\n3. **语义分割** —— 用模型判断语义边界，按完整语义切(最准但成本高)\n\n**为什么这么分（面试回答要点）：** 平衡\"语义完整性\"和\"检索精度\"——块太大丢细节，块太小丢上下文，通常 300~500 token + 少量重叠是常用起点。","extend":"**追问：** 重叠窗口(chunk overlap)保证相邻块共享边界内容，避免一句话被从中间切断导致检索不到。","source":"note","star":5,"bank":4},{"id":413,"code":"LLM-7","category":"大模型应用","question":"什么是重排序(Rerank)？混合检索如何实现？","answer":"**重排序(精排)：** 初次向量召回得到一批候选 chunks 后，用重排序模型做二次精排，筛出匹配度最高的内容，提升检索精准度。\n\n**为什么要重排：** 向量相似度是粗排，只能保证\"大概相关\"；重排模型更精细地算相关性，让最准的排在前面。\n\n**混合检索：** 结合\"语义相似(向量检索) + 文本相似度(关键词检索，如 BM25)\"，再做**数据融合**(如 RRF 倒数排名融合)，兼顾\"语义相关\"和\"精确关键词命中\"。\n\n**举例：** 检索\"中国人\"和\"我是中国人\"——ES 用 IK 分词器，按最小粒度拆分(我/是/我是/中国/中国人)，能精确命中；纯向量检索可能只命中语义近似词。\n\n**结论：** 向量检索擅长语义，关键词检索擅长精确，混合检索 + 重排取长补短。","extend":"**追问：** RRF(Reciprocal Rank Fusion)是常见的融合算法，把多个检索结果的倒数排名相加排序。","source":"note","star":5,"bank":4},{"id":414,"code":"LLM-8","category":"大模型应用","question":"怎么解决大模型幻觉问题？","answer":"**幻觉：** 大模型一本正经地编造不存在的事实、数据、引用。\n\n**解决方案：**\n1. **RAG 检索增强** —— 给模型提供外部知识，让它基于真实资料回答(最主流)\n2. **提示词约束** —— 明确要求\"不知道就说不知道\"，禁止编造\n3. **降低温度(temperature)** —— 调低随机性，输出更保守\n4. **微调(领域数据)** —— 用高质量领域数据训练，减少瞎编\n5. **输出校验** —— 关键结论要求模型给出出处，二次校验\n6. **Few-shot 示例** —— 提供\"知道/不知道\"的示例引导\n\n**核心：** 幻觉本质是模型\"缺乏知识但强答\"，RAG 给它补上知识来源是根本解法。","extend":"**追问：** 面试常问\"RAG 和微调谁更能解决幻觉\"——RAG 更快见效、可溯源；微调治本但成本高。","source":"note","star":5,"bank":4},{"id":415,"code":"LLM-9","category":"大模型应用","question":"什么是 Agent？Agent 和工作流(Workflow)有什么区别？","answer":"**Agent(智能体)：** 让大模型具备\"规划 + 调用工具 + 自主决策\"的能力，能拆解任务、选择工具、多步执行。\n\n**核心组成：** LLM(大脑) + 工具(执行) + 记忆 + 规划。\n\n**Agent vs 工作流：**\n| 对比 | 工作流(Workflow) | Agent |\n|---|---|---|\n| 路径 | 预先固定 | 动态自主决策 |\n| 灵活性 | 低(流程写死) | 高(模型自己决定下一步) |\n| 可控性 | 高 | 低(可能跑偏) |\n| 适用 | 稳定重复的业务 | 复杂开放的任务 |\n\n**趋势：** 简单稳定用工作流，复杂多变用 Agent；实践中常\"工作流 + 局部 Agent\"混合。","extend":"**追问：** Agent 常用框架 LangChain / LangGraph，核心是 ReAct(推理+行动)循环——思考→行动→观察→再思考。","source":"note","star":4,"bank":4},{"id":416,"code":"LLM-10","category":"大模型应用","question":"什么是 LoRA？它的原理和核心优势是什么？","answer":"**LoRA(Low-Rank Adaptation，低秩适配)：** 微软 2021 年提出的参数高效微调技术，当前大模型微调最广泛使用的方案。\n\n**原理（核心公式）：**\n- 全参微调把原始权重 W0 更新为 W，变化量 ΔW = W - W0\n- LoRA 的关键发现：微调的增量矩阵 ΔW 天生是**低秩**的\n- 低秩矩阵可拆成两个小矩阵相乘：ΔW ≈ A × B\n- 最终：**W_new = W0 + A×B**（冻结 W0 不动，只训练 A、B 两个小矩阵）\n\n**算账：** 4096×4096 的矩阵全参微调需更新约 1670 万参数；LoRA 用秩 r=8，A(4096×8)+B(8×4096) 共 65536 参数，**只更新 0.4% 参数，效果却媲美全参微调**。\n\n**优势：** 训练成本低、显存占用小、不易过拟合(小数据尤其重要)、推理无额外开销。","extend":"**追问：** \"秩\"的理解——矩阵真正独立、不冗余的有效信息量；低秩 = 信息集中在少数维度。\n**易错：** LoRA 冻结的是原始权重 W0，训练的是旁路矩阵 A、B，不是改原模型。","source":"yd","star":5,"bank":4},{"id":419,"code":"LLM-13","category":"大模型应用","question":"vLLM 是什么？为什么它的吞吐量能比传统推理库高一个数量级？","answer":"**vLLM：** 面向大模型推理的高性能推理框架，专为大规模并发请求优化，兼容 OpenAI API 接口。\n\n**为什么快（四大特性）：**\n1. **PagedAttention 算法** —— 核心：高效管理显存(KV cache)，减少内存浪费，像操作系统的分页一样管理注意力缓存\n2. **高级 GPU 优化** —— 利用 CUDA + PyTorch 最大化 GPU 利用率\n3. **连续批处理(Continuous Batching)** —— 动态批处理 + 异步，提高并发吞吐\n4. **安全 + 易用** —— 内置 API 密钥校验，兼容 OpenAI API 服务器\n\n**启动：**\n```bash\nvllm serve /path/to/model \\\n  --served-model-name my-model \\\n  --tokenizer /path/to/base \\\n  --max-model-len 32768 \\\n  --gpu-memory-utilization 0.7\n```\n\n**调用：** 兼容 OpenAI 接口，用 `openai` 库设 `base_url` 即可调用 `/v1/chat/completions`。","extend":"**易错：** --tokenizer 通常指向基座模型(不是微调后目录)——因为 LoRA 微调不改变词表，微调目录往往没有完整的 tokenizer 文件。","source":"yd","star":5,"bank":4},{"id":421,"code":"LLM-15","category":"大模型应用","question":"BERT 的输入和输出结构是什么？二分类和多分类分别取哪个输出？","answer":"**输入（三个张量，分词器自动生成）：**\n| 字段 | 作用 |\n|---|---|\n| input_ids | 分词编码后的 token ID 序列 |\n| attention_mask | 标记有效 token(1 有效，0 为 padding) |\n| token_type_ids | 区分句子对的两句(单句可省) |\n\n**输出（最常用两个字段）：**\n| 字段 | 说明 |\n|---|---|\n| last_hidden_state | 每个 token 的隐藏状态 (batch, seq_len, hidden) |\n| pooler_output | 整句级表示 (batch, hidden) |\n\n**分类任务取法：**\n- **二分类：** 取 pooler_output → 线性层输出 1 个 logit → Sigmoid 转概率，用 BCEWithLogitsLoss\n- **多分类：** 取 pooler_output → 线性层输出 K 个 logit → Softmax 归一化，用 CrossEntropyLoss\n\n**小结：** 整句分类(二/多分类)优先取 pooler_output；逐 token 任务(如 NER)取 last_hidden_state。","extend":"**追问：** pooler_output 就是 [CLS] 位置的输出再过一个全连接层，代表整句语义。","source":"yd","star":5,"bank":4},{"id":422,"code":"DB-55","category":"MySQL","question":"什么是窗口函数？与GROUP BY的区别？语法结构和三大分类？","answer":"**GROUP BY vs 窗口函数：**\n- GROUP BY合并多行为一行丢失明细\n- 窗口函数不合并原始行，给每行附加统计结果\n\n**语法：** 函数()OVER(PARTITION BY分组字段ORDER BY排序字段[ROWS窗口范围])。\n\n**三大类：** ①聚合类SUM/AVG/MAX/MIN/COUNT+OVER()保留原始行带出分组值；②排名类ROW_NUMBER(连续唯一)/RANK(并列跳号)/DENSE_RANK(并列不跳)；③偏移类LAG(上一行)/LEAD(下一行)/FIRST_VALUE(第一行)/LAST_VALUE(最后行需加ROWS BETWEEN范围)。","extend":"**代码：**\n```sql\nSELECT emp_name, dept, salary,\n       RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS rk\nFROM emp;\n```\n**易错：** 窗口函数在SELECT阶段执行(ORDER BY之前)，WHERE里不能过滤窗口函数结果(需外层子查询)；PARTITION BY缺省=全表一个窗口。\n**面试追问：** 三大分类——聚合类(SUM/AVG等+OVER保留明细)、排名类(ROW_NUMBER/RANK/DENSE_RANK)、偏移类(LAG/LEAD/FIRST_VALUE/LAST_VALUE)。","source":"v2.4-reimport","star":5,"bank":4},{"id":423,"code":"DB-56","category":"MySQL","question":"请对比ROW_NUMBER()、RANK()、DENSE_RANK()三种排名函数的区别？","answer":"**ROW_NUMBER()：** 连续唯一序号，相同值强行分先后→1,2,3,4。\n**RANK()：** 并列排名**跳过**后续→1,2,2,4。\n**DENSE_RANK()：** 并列排名**不跳过**后续→1,2,2,3。\n\n全部语法：函数()OVER(PARTITION BY did ORDER BY salary DESC)。","extend":"**补充：** 记忆口诀——ROW_NUMBER连续不并列(1,2,3,4)、RANK并列跳号(1,2,2,4)、DENSE_RANK并列不跳号(1,2,2,3)。\n**代码：**\n```sql\nSELECT *, ROW_NUMBER() OVER (ORDER BY score DESC) rn FROM stu;\n```\n**易错：** 并列定义=ORDER BY字段值相同；无PARTITION=全表排名，有PARTITION=组内排名。\n**面试追问：** 取每组Top N——排名函数+外层WHERE rn<=N；\"第二高工资\"用DENSE_RANK或LIMIT 1 OFFSET 1。","source":"v2.4-reimport","star":5,"bank":4},{"id":424,"code":"DB-57","category":"MySQL","question":"什么时候不适合建立索引？","answer":"**不适合建索引的场景：**\n1. **表数据量极小**（几百行）— 全表扫描更快。\n2. **低区分度字段**（性别、状态 0/1）— 索引扫描行数≈全表，且优化器可能放弃索引。\n3. **频繁更新字段** — 每次UPDATE要修改B+树，维护成本高。\n4. **频繁删除/插入的表** — 索引页分裂频繁，严重影响写入性能。\n\n**原则：** 索引不是越多越好，在查询性能提升和写入性能下降之间权衡。","extend":"**补充：** 不宜建索引——表数据量极小(几百行全表更快)、低区分度字段(性别/状态)、频繁更新字段(B+树维护成本高)、频繁增删表(页分裂)。\n**易错：** 区分度=COUNT(DISTINCT 列)/COUNT(*)；区分度低的索引优化器可能直接放弃。\n**面试追问：** 索引数量经验——单表一般≤5个，联合索引替代多个冗余单列索引；用慢查询日志+EXPLAIN驱动建索引而非拍脑袋。","source":"v2.4-reimport","star":5,"bank":4},{"id":426,"code":"DB-59","category":"MySQL","question":"JOIN查询有哪些优化原则？什么是小表驱动大表？","answer":"**JOIN优化原则：**\n1. **小表驱动大表（最重要！）：** 用小结果集驱动大结果集。inner join MySQL自动优化选择驱动表；left join左表固定为驱动表→**左表应尽量小**。\n2. **关联字段必须建索引：** 被驱动表的JOIN字段无索引→每次关联都全表扫描。\n3. **避免笛卡尔积：** 关联条件不能省略。\n4. **禁止大表LEFT JOIN小表：** 尽量用inner join代替。\n5. **多表JOIN控制数量：** 一般不超过3张表，拆分复杂查询。\n\n**小表驱动大表原理：** 驱动表每行去被驱动表匹配→驱动表越小外层循环越少→总IO越少。","extend":"**补充：** 小表驱动大表原理=驱动表每行走索引查被驱动表，外层循环次数=驱动表行数，越小总IO越少。\n**易错：** LEFT JOIN左表固定为驱动表——把数据量小的一边放左边；INNER JOIN优化器自动选驱动表。\n**面试追问：** 被驱动表JOIN字段必须建索引，否则每次关联全表扫描；多表JOIN≤3张，复杂查询拆成多次查询+应用层组装。","source":"v2.4-reimport","star":5,"bank":4},{"id":427,"code":"DB-60","category":"MySQL","question":"数据库CPU突然打满，如何排查？","answer":"**排查步骤：**\n① `SHOW PROCESSLIST` 查看当前正在执行的SQL，找出长时间运行的查询。\n② `SHOW ENGINE INNODB STATUS` 查看锁等待和事务状态。\n③ 开启慢查询日志（`slow_query_log`），找出执行时间超过阈值的SQL。\n④ 对慢SQL执行EXPLAIN分析：重点关注type=ALL全表扫描、无索引或索引失效的查询。\n⑤ 检查是否有大量函数运算（`WHERE year(time)`）、隐式类型转换导致的索引失效。\n\n**常见根因：** 大量无索引全表扫描、索引失效SQL、锁等待堆积、突发大流量。","extend":"**补充：** 排查链路——SHOW PROCESSLIST找长SQL→EXPLAIN分析执行计划→开慢查询日志确认→优化索引/改写SQL。\n**易错：** 全表扫描/索引失效/笛卡尔积是CPU打满三大元凶；先定位具体SQL再调参数，不要盲目加机器。\n**面试追问：** 应急——kill长事务、临时加索引、限流降级；根治——索引设计+SQL审计+读写分离+监控告警。","source":"v2.4-reimport","star":4,"bank":4},{"id":429,"code":"DB-62","category":"MySQL","question":"为什么不建议用UUID作为主键？自增主键和雪花ID各有什么优缺点？","answer":"**UUID作为主键的问题：** UUID无序→每次INSERT可能插入B+树中间位置→频繁**页分裂**→索引碎片大→插入和查询性能都差→Buffer Pool利用率低（热点页不集中）。\n\n**自增主键优点：** 有序递增→新增永远追到叶子链表末尾→页分裂少→插入效率高→聚簇索引紧凑。\n**缺点：**\n- 分库分表时ID冲突\n- 暴露业务量级\n\n**雪花ID(Snowflake)：**\n- 本地生成、有序递增（时间戳+机器ID+序列号）、全局唯一\n- 兼顾有序性和分布式\n- 依赖机器时钟同步\n\n**分布式ID方案对比：** 雪花算法（推荐）>Redis自增（高性能但宕机丢号）>MySQL自增步长（简单但扩容麻烦）>UUID（索引性能差不推荐）。","extend":"**补充：** UUID无序→每次INSERT可能插B+树中间→频繁页分裂+碎片+Buffer Pool热点分散；自增有序但分库分表冲突+泄露量级；雪花ID=时间戳+机器ID+序列号。\n**易错：** 雪花依赖时钟，时钟回拨会重复ID——需回拨处理；Redis自增发号宕机丢号。\n**面试追问：** 分布式ID方案——雪花(推荐)/Redis INCR/数据库步长/UUID(最差)；大模型微服务间统一ID常用雪花算法。","source":"v2.4-reimport","star":5,"bank":4},{"id":430,"code":"DB-63","category":"MySQL","question":"请解释Buffer Pool、脏页和页分裂的概念？","answer":"**Buffer Pool（缓冲池）：**\n- InnoDB核心内存组件\n- 缓存索引页和数据页，减少磁盘IO\n- 读数据时先查Buffer Pool→命中直接返回→未命中从磁盘加载\n- 写数据时先写Buffer Pool→后台异步刷盘\n\n**脏页（Dirty Page）：**\n- Buffer Pool中数据和磁盘不一致的页（已被修改但未刷盘）\n- 后台Master Thread定期刷脏页到磁盘\n- 脏页太多→IO飙升→需要调大Buffer Pool或优化刷盘策略\n\n**页分裂（Page Split）：** 插入数据时索引页已满→InnoDB分配新页→将原页一半数据移到新页→插入新数据。页分裂消耗性能（移动数据+调整指针）。\n\n**主键有序递增→新数据永远追到末尾→减少页分裂→提升写入性能。UUID无序→频繁页分裂→性能差。**","extend":"**补充：** Buffer Pool缓存索引页数据页减少磁盘IO；脏页=改了未刷盘的页；页分裂=索引页满拆两半再插入。\n**易错：** 主键无序→频繁页分裂→写放大；脏页过多刷盘IO风暴→调innodb_max_dirty_pages_pct。\n**面试追问：** checkpoint机制+redo log顺序写保证崩溃恢复；Buffer Pool命中率是性能关键指标，innodb_buffer_pool_size建议设为物理内存50%~70%。","source":"v2.4-reimport","star":5,"bank":4},{"id":450,"code":"ML-51","category":"机器学习","question":"为什么对测试集只能用 transform，不能用 fit_transform？","answer":"**数据泄露问题：** 测试集是“没见过的数据”，要模拟真实预测场景。\n- fit_transform 会用测试集自身的统计量（min/max 或均值/标准差）去缩放 → 模型训练时“偷看”了测试集信息 → 评估结果虚高\n- 正确做法：训练集 fit 得到参数，测试集只 transform 套用同一套参数\n\n**代码：** scaler.fit_transform(X_train) → scaler.transform(X_test)","extend":"**补充：** 数据泄露——测试集是'没见过的数据'，fit_transform会用测试集自身的min/max或均值/标准差缩放，等于训练时偷看测试集信息，评估结果虚高。\n**易错：** 正确做法——训练集fit得到参数，测试集只transform套用同一套参数。\n**代码：**\n```python\nscaler.fit(X_train); X_train = scaler.transform(X_train)\nX_test = scaler.transform(X_test)   # 只用transform\n```\n**面试追问：** 同理适用于编码(OneHotEncoder)、PCA、缺失值填充等一切需要'学参数'的步骤；Pipeline可以自动保证不泄露。","source":"v2.4-reimport","star":5,"bank":4},{"id":452,"code":"DL-27","category":"深度学习","question":"请对比深度学习与传统机器学习的区别？","answer":"| 对比项 | 传统ML | 深度学习 |\n|---|---|---|\n| 特征工程 | 人工设计 | 自动学习 |\n| 数据量 | 几百~几千条 | 万级以上 |\n| 硬件 | 普通CPU | GPU加速 |\n| 可解释性 | 高 | 低(黑盒) |\n| 适用数据 | 结构化表格 | 图像/文本/音频/视频 |\n\n**选型：** 数据量大+非结构化→DL；数据量小+结构化+要解释→ML。\n**比喻：** DL像大炮威力大，但别用大炮打蚊子——问题简单用逻辑回归就够。","extend":"**面试追问：** DL训练几小时到几周，ML几分钟到几小时；DL推理速度还行但训练周期长。\n**DL局限：** 需大量标注数据(标注几万张图人力成本高)、计算成本高(训练GPT-3电费上千万美元)、容易被对抗样本欺骗(改几个像素'熊猫'变'长臂猿')、没有常识、只擅长模式识别不擅长推理。\n**何时不用DL：** 嵌入式设备/手机算力弱内存小跑不动——用传统ML。","source":"v2.4-reimport","star":5,"bank":4},{"id":454,"code":"DL-29","category":"深度学习","question":"为什么RNN之后出现了Transformer？它解决了什么？","answer":"**RNN两大痛点：**\n- 串行计算：必须逐字处理，训练慢(像排队买票)\n- 长距离依赖弱：句子一长前面信息记不住(梯度消失)\n\n**Transformer(2017)：** 完全抛弃RNN，只用注意力机制，两点突破：\n- 全程并行计算：自注意力可同时看整句话\n- 全局关联：每个词直接和所有词算关系，不存在衰减\n\n**比喻：** RNN像传话游戏(第100个要等前面99个说完)，Transformer像微信群(直接看到消息)。\n\n**注意：** 推理(生成)时仍逐字生成，并行只在训练时成立；自注意力O(n²)计算量比RNN O(n)大。","extend":"**面试追问：** 论文《Attention Is All You Need》2017年6月，8位作者(Google Brain+多伦多大学)，仅11页——机器翻译比RNN/LSTM快一个数量级。\n**两条进化线：** 编码器路线→BERT(理解，2018)；解码器路线→GPT系列(生成，2018-2022 ChatGPT)。\n**跨界：** ViT(图像patch当句子)、DALL-E/Stable Diffusion(文生图)、AlphaFold2(蛋白质结构预测)。","source":"v2.4-reimport","star":5,"bank":4},{"id":456,"code":"DL-31","category":"深度学习","question":"残差连接和层归一化的作用？","answer":"**残差连接：** 把原始输入直接加到子层输出上(输出=子层(x)+x)——给梯度开'高速公路'，信息不丢失，避免多层堆叠后梯度消失/特征退化，支持堆几十层。\n\n**层归一化(LayerNorm)：** 对每层数据做标准化(减均值除标准差，再乘可学习参数)——数据范围稳定在标准尺度，训练更稳定收敛更快。\n\n**比喻：** 残差连接=安全网(保底信息传过去)；层归一化=平衡车(数值不跑偏)。\n\n**位置：** Encoder/Decoder每个子层后都做'残差+归一化'。","extend":"**面试追问：** 为什么深层难训练——反向梯度连续矩阵乘法不断变小趋近0(梯度消失)，浅层权重得不到更新；残差=电梯直达原始信息。\n**对比BatchNorm：** LayerNorm对每个样本的特征维度归一化(Transformer用)；BatchNorm对一批数据的每个特征归一化(CNN/MLP常用)；两者都缓解梯度问题。\n**组合：** 残差连接'保底'(信息传过去)+层归一化'维稳'(数值不跑偏)——Transformer才能叠几十上百层。","source":"v2.4-reimport","star":5,"bank":4},{"id":462,"code":"DB-64","category":"缓存与Redis","question":"Redis 有哪些高可用架构？主从复制、哨兵（Sentinel）、集群（Cluster）有什么区别？","answer":"**主从复制**：一主多从，主节点负责写、从节点复制数据并承担读。解决读压力和数据冗余，但主节点故障需**手动**切换，不能自动故障转移。\n**哨兵 Sentinel**：在主从基础上增加哨兵进程，持续监控主从节点健康；主节点宕机时自动选举新主并通知客户端，实现**自动故障转移**。但仍是单主写，容量受单机内存限制。\n**集群 Cluster**：多主多从，通过 16384 个哈希槽（hash slot）把数据分片到不同主节点，支持**横向扩容**、高并发读写，数据自动分片与迁移。","extend":"三者演进关系：主从 → 哨兵 → 集群。前两者是\"复制\"架构（解决高可用/读扩展），集群是\"分片\"架构（解决容量与写扩展）。记忆：主从=备份读、哨兵=自动换主、集群=分片扩容。","source":"903","star":5,"bank":4},{"id":463,"code":"DB-65","category":"缓存与Redis","question":"什么是缓存穿透、缓存击穿、缓存雪崩？分别如何解决？","answer":"**缓存穿透**：查询一个根本不存在的数据，缓存和数据库都没有，请求全部打到数据库。解决：缓存空值（null）、用布隆过滤器提前过滤不存在的 key。\n**缓存击穿**：某个热点 key 恰好过期，瞬间大量请求同时打到数据库。解决：热点 key 设置永不过期或逻辑过期、加互斥锁（只有一个线程回源 DB 重建缓存）、缓存预热。\n**缓存雪崩**：大量 key 在同一时间过期，或 Redis 整体宕机，请求全部落到数据库。解决：过期时间加随机值打散、多级缓存、Redis 集群高可用、限流降级。","extend":"记忆口诀：\"穿透\"查不存在、\"击穿\"单热点过期、\"雪崩\"大范围过期/宕机。三者本质都是\"缓存失效导致请求穿透到 DB\"，区别在于失效的范围和原因。","source":"903","star":5,"bank":4},{"id":464,"code":"DB-66","category":"缓存与Redis","question":"Redis 的持久化方式有哪些？RDB 和 AOF 有什么区别？","answer":"**RDB（快照）**：定时把某个时间点的内存数据生成二进制文件 dump.rdb。优点：文件小、恢复快、fork 子进程不影响主进程；缺点：两次快照之间可能丢数据。\n**AOF（追加日志）**：记录每次写命令并追加到日志文件，通过 appendfsync 策略（always/everysec/no）控制刷盘。优点：数据更完整（最多丢 1 秒）；缺点：文件大、恢复慢、需重写（rewrite）压缩。\n**混合持久化**：RDB 快照 + 期间增量 AOF，兼顾恢复速度与数据安全。","extend":"生产常用\"RDB 定时快照 + AOF everysec\"或混合模式。取舍核心：RDB 侧重恢复性能、AOF 侧重数据安全。","source":"903","star":5,"bank":4},{"id":465,"code":"DB-67","category":"缓存与Redis","question":"Redis 与 MySQL 双写一致性如何保证？为什么推荐\"先更新数据库、再删除缓存\"？","answer":"**核心策略 Cache Aside（旁路缓存）**：\n  读：先查缓存，命中直接返回；未命中查 DB 并回填缓存。\n  写：先更新数据库，再删除缓存。\n**为什么先更新 DB 再删缓存**：若\"先删缓存再更新 DB\"，在删除与更新之间的窗口期，其他请求会读到旧 DB 值并回填缓存，造成脏数据；而\"先更新 DB 再删缓存\"，即便删缓存失败，也最多读到短暂旧值，影响更小。\n**高一致性要求场景**：延迟双删（更新 DB 后延迟再删一次缓存）、订阅 binlog（如 Canal）异步删缓存、消息队列保证最终一致性。","extend":"本质是\"强一致 vs 最终一致\"的取舍——缓存天然以牺牲一致性换性能。一般业务用最终一致性即可；强一致场景（如金额）应绕过缓存直接读库或用分布式锁。","source":"903","star":4,"bank":4},{"id":466,"code":"DB-68","category":"缓存与Redis","question":"Redis 的内存淘汰策略有哪些？为什么数据过期了有时还能读到？","answer":"**内存淘汰策略（内存不足时）**：noeviction（不淘汰、写入报错）、allkeys-lru、volatile-lru、allkeys-lfu、volatile-lfu、allkeys-random、volatile-random、volatile-ttl 共 8 种。常用 allkeys-lru（对所有 key 按最近最少使用淘汰）。\n**过期删除策略**：惰性删除（访问 key 时才判断是否过期，过期则删）+ 定期删除（定时抽样检查并删除过期 key）二者组合。\n**为什么过期了还能读到**：因为采用惰性删除，数据过期后若一直没被访问，不会被立即删除；访问时 get 该 key 会先判断过期才删除并返回 nil——所以\"能读到\"其实是指它仍占用内存、可能短暂可见，但正常 get 时会触发删除。","extend":"惰性删除省 CPU 但省不了内存，故搭配定期删除。这也解释了\"过期 key 仍占内存\"的现象。面试常追问：过期删除策略和内存淘汰策略是两回事——前者针对过期 key，后者针对内存不足时对所有 key 的淘汰。","source":"903","star":4,"bank":4},{"id":471,"code":"LLM-20","category":"大模型应用","question":"RAG 知识库中，PDF 文档有纯文本、扫描件、表格等多种类型，分别如何处理？","answer":"**纯文本 PDF**：文档自带文本层，直接提取文本（pdfplumber / PyMuPDF / pypdf），切分后向量化即可。\n**扫描件（图片型 PDF）**：没有文本层，需先做 OCR 识别（PaddleOCR / Tesseract），把图片转成文字后再切分向量化。\n**表格**：需用表格解析（pdfplumber 的 extract_tables / camelot / unstructured），把表格还原成保留行列关系的结构化文本，避免直接抽文本导致语义错乱。\n**混合文档**：先做版面分析（layout detection），区分段落/表格/图片，分类用不同解析器处理。","extend":"关键：不同类型用不同解析器。表格若当普通文本抽取，会丢失行列语义，导致检索不准；扫描件漏做 OCR 则完全抽不出内容。工程上常按\"格式识别 → 分类解析 → 统一切分向量化\"的流水线处理。","source":"904","star":5,"bank":4}]};</script><script>window.__FC_BANK_META = {"total":244,"counts":{"1":244,"2":209,"3":174,"4":95}};</script>
