<script>window.__FC_BANKS = {"1":[{"id":30,"code":"PY-30","category":"面向对象","question":"请解释抽象基类(ABC)的作用和对象的生命周期？","answer":"**ABC作用：** ①强制子类实现@abstractmethod抽象方法；②注册机制register()声明实现接口；③支持isinstance()/issubclass()类型验证。好处：统一接口、扩展性好、符合开闭原则。\n\n**对象生命周期：**\n- 创建：元类__call__→__new__分配内存\n- 初始化：__new__返回→__init__\n- 销毁：引用计数归零→__del__(如果定义)\n- __del__注意：不一定立即调用(循环引用)\n- 推荐用with管理资源\n- CPython垃圾回收：引用计数+GC处理循环引用","extend":"**代码：**\n```python\nfrom abc import ABC, abstractmethod\nclass Shape(ABC):\n    @abstractmethod\n    def area(self): ...\n```\n**易错：** 含抽象方法的类不能实例化，子类须全部实现；register()注册的类能过isinstance但不受强制实现约束。\n**面试追问：** collections.abc提供Iterable/Sequence/Container等做鸭子类型检查；对象生命周期=元类__call__→__new__分配→__init__初始化→引用计数归零__del__，循环引用靠gc模块回收。","source":"v2.4","star":4,"bank":1},{"id":53,"code":"PYH-12","category":"综合进阶","question":"请详细描述实现单例模式的方式及其原理？","answer":"**方式一：重写__new__（最常用）** — 类变量存实例，无则创建有则返回。需多线程安全用双重检查锁。\n**方式二：模块导入** — Python模块天然单例，第一次导入缓存到sys.modules。\n**方式三：装饰器/元类**\n- — 装饰器维护实例字典\n- 元类重写__call__\n**方式五：Borg模式** — 所有实例共享类变量。","extend":"**代码：**\n```python\nclass Singleton:\n    _instance = None\n    def __new__(cls, *a, **k):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n        return cls._instance\n```\n**易错：** 多线程下需加锁双重检查；模块导入天然单例；Borg模式共享类变量但id不同。\n**面试追问：** 单例是反模式——隐藏全局状态难测试；大模型项目更常用依赖注入/应用上下文(如Flask current_app、FastAPI的Depends)。","source":"v2.4","star":4,"bank":1},{"id":87,"code":"DB-28","category":"MySQL","question":"请写出SQL的写法顺序和执行顺序，并说明为什么不同？","answer":"**写法顺序：** SELECT DISTINCT → FROM → JOIN ON → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT\n\n**执行顺序：** 1.FROM加载数据源 → 2.JOIN+ON关联生成临时表 → 3.WHERE过滤原始行(不能用聚合/窗口函数) → 4.GROUP BY分组 → 5.聚合函数计算(SUM/COUNT等) → 6.HAVING过滤分组结果 → 7.SELECT挑选字段+DISTINCT去重+**窗口函数此时执行** → 8.ORDER BY排序(可用别名/聚合/窗口) → 9.LIMIT截取\n\n**为什么不同：** SQL是声明式语言——你描述「要什么」，数据库优化器决定「怎么做」。理解执行顺序对正确使用WHERE/HAVING/别名/窗口函数至关重要。","extend":"**补充：** 执行顺序决定语法限制——WHERE在分组前不能聚合、SELECT别名只能ORDER BY用、窗口函数在SELECT阶段执行。\n**易错：** HAVING过滤分组结果可用聚合，WHERE不行；LIMIT最后执行；ORDER BY可用SELECT别名/聚合/窗口结果。\n**面试追问：** 优化器会重排FROM多表JOIN顺序(小表驱动大表)，但回答标准执行顺序仍是逻辑层事实；加括号可以强制部分执行顺序。","source":"v2.4","star":4,"bank":1},{"id":140,"code":"PD-41","category":"Pandas","question":"concat和merge的区别？各自的用法？","answer":"**concat：把结构相同的对象拼接**\n- axis=0（默认）：上下堆叠，索引保留原样；加ignore_index=True重新编号\n- axis=1：左右并排，对不上的位置自动补NaN\n\n**merge：把两张表通过共同字段\"串\"成宽表（类似数据库表连接）**\n- 字段名相同：直接用on，如pd.merge(员工, 入职)自动按共同列\"姓名\"合并\n- 字段名不同：用left_on和right_on分别指明两边的键，如pd.merge(a, b, left_on=\"学号\", right_on=\"编号\")\n- how：连接方式——inner内连接（默认，取两边都有的）、outer保留两边所有行缺失补NaN、left/right以左/右表为准","extend":"**补充：** concat=把结构相同的对象拼接(axis=0上下堆叠、axis=1左右并排)；merge=按共同字段'串'成宽表(类似数据库连接)。\n**代码：**\n```python\npd.concat([a,b], ignore_index=True)\npd.merge(a, b, on='姓名')\npd.merge(a, b, left_on='学号', right_on='编号', how='outer')\n```\n**易错：** concat上下堆叠默认保留原索引(ignore_index=True重新编号)；merge列名不同用left_on/right_on。\n**面试追问：** merge的how——inner(默认)/outer/left/right对应SQL内/全/左/右连接；两表列名冲突用suffixes=('_a','_b')区分。","source":"v2.4","star":4,"bank":1},{"id":156,"code":"LNX-8","category":"Linux","question":"vim编辑器有哪三种模式？各自的常用操作？","answer":"**一般模式（默认模式）：** 打开文件即进入，可移动光标、删除、复制、粘贴，但无法编辑内容\n- yy复制当前行、y数字y复制多行、p粘贴、dd删除当前行、d数字d删除多行、u撤销\n- gg移动到页头、shift+g移动到页尾、shift+6（^）行头、shift+4（$）行尾\n\n**编辑模式：** 按i（当前光标前）、a（光标后）、o（下一行）、I（行首）、A（行尾）、O（上一行）进入；左下角出现INSERT字样；Esc退出回一般模式\n\n**命令模式：** 一般模式中输入:、/、?进入\n- :w保存、:q退出、:wq保存并退出、:q!强制退出不保存、:wq!强制保存退出\n- /查找词（n下一个、N上一个）、:set nu显示行号、:%s/old/new/g全局替换","extend":"**补充：** 三大模式——一般模式(移动/复制/删除)、编辑模式(i/a/o进入、Esc退出)、命令模式(:w/:q/:wq/:q!)。\n**代码：**\n```bash\n:set nu         # 显示行号\n:%s/old/new/g   # 全局替换\n/关键词         # 搜索，n下一个 N上一个\n```\n**易错：** 先Esc回到一般模式再输命令；忘了:wq直接退出会丢改动，用:q!强制不保存。\n**面试追问：** yy复制/p粘贴/dd删除/u撤销；gg页头/G页尾/^行首/$行尾；vim三模式+常用键是Linux面试高频。","source":"v2.4","star":4,"bank":1},{"id":166,"code":"LNX-18","category":"Linux","question":"tar压缩和解压的用法？","answer":"**基本语法：** tar [选项] 生成的包名 要打包的内容\n\n**常用选项：**\n- -c：产生.tar打包文件\n- -x：解包.tar文件\n- -z：打包同时压缩（gzip）\n- -v：显示详细信息\n- -f：指定压缩后的文件名\n\n**压缩：**\n- tar -cvzf mytar1.tar.gz demo*：打包压缩多个文件\n- tar -zcvf b.tar.gz mytest：压缩目录\n\n**解压：**\n- tar -xvf mytar.tar.gz：解压到当前目录\n- tar -xvf mytar1.tar.gz -C test/：解压到指定目录（-C）","extend":"**代码：**\n```bash\ntar -zcvf my.tar.gz demo*   # 打包并gzip压缩\ntar -xvf my.tar.gz          # 解压到当前目录\ntar -xvf my.tar.gz -C test/ # 解压到指定目录(-C)\n```\n**易错：** -z表示gzip压缩；-f必须放最后并接文件名；解压用-x。\n**面试追问：** tar -tvf查看包内容不解压；zip/unzip命令处理zip格式；打包排除目录--exclude=路径。","source":"v2.4","star":4,"bank":1},{"id":172,"code":"PY-42","category":"Python基础","question":"正则表达式是什么？它的核心符号有哪些？","answer":"**定义：** 正则表达式是一套\"匹配规则\"，用符号告诉程序\"我要找什么样的字符串\"。比如从一段文字里找出手机号、邮箱、日期，或者只保留中文，都可以用正则。\n\n**核心符号（记住4个解决80%问题）：**\n- \\d：匹配1个数字\n- \\w：匹配1个字母/数字/下划线\n- [ ]：字符范围，从中选一个（如[abc]匹配a或b或c）\n- +：前面字符出现1次或多次\n\n**其他常用：**\n- .：匹配任意1个字符（除换行）\n- \\s：匹配1个空白（空格/换行）\n- *：前面字符出现0次或多次\n- ?：前面字符出现0次或1次\n- {n}：前面字符出现n次；{n,m}：出现n到m次\n- ^：字符串开头；$：字符串结尾\n- [^abc]：匹配不是a/b/c的字符（取反）\n- |：或，二选一","extend":"**补充：** 核心4件套——\\d数字、\\w字母数字下划线、[ ]字符范围、+一次或多次，可解决80%匹配需求。\n**代码：**\n```python\nimport re\nre.findall(r'\\d+', text)   # r''原始字符串防转义\n```\n**易错：** Python写正则必须r''否则\\d被当转义；^$锚点、|或、{n}数量是常用扩展。\n**面试追问：** 贪婪vs非贪婪——默认贪婪尽量多匹配，加?变非贪婪(.*?最小匹配)；先用在线工具调试再写代码。","source":"v2.4","star":4,"bank":1},{"id":218,"code":"ML-39","category":"机器学习-逻辑回归","question":"sigmoid 函数的作用和公式？","answer":"**公式：** hθ(x) = 1 / (1 + e⁻ʸ)，其中 y = wx + b 是线性回归的输出\n**作用：** 把任意实数（线性输出）映射到 0~1 之间的概率\n**验证：** y=2 → 1/(1+e⁻²) ≈ 0.88\n**决策：** 通常阈值取 0.5，概率 ≥ 0.5 判为类别 1，< 0.5 判为类别 0","extend":"**补充：** sigmoid公式h=1/(1+e⁻ᶻ)把任意实数映射到(0,1)；z=wx+b；阈值默认0.5。\n**易错：** z=0时概率恰好0.5；z越大概率越接近1、z越小越接近0；e⁻ᶻ当z很大时趋近0。\n**面试追问：** sigmoid导数σ(1-σ)这个性质让梯度计算简洁；softmax是sigmoid的多分类推广(输出各类概率和=1)。","source":"v2.4","star":4,"bank":1},{"id":226,"code":"ML-47","category":"机器学习-逻辑回归","question":"召回率（Recall）是什么？","answer":"**公式：** Recall = TP / (TP + FN)\n**含义：** 真实为阳性（1）的样本中，被正确预测为阳性的比例——“所有真下雨天，被正确预报出来的有多少”\n**侧重：** 不漏报（减少 FN），天气预报中最重要\n**例子：** TP=45, FN=5 → 召回率 = 45/50 = 0.9，50 个下雨天有 45 天被正确预报。","extend":"**补充：** Recall=TP/(TP+FN)——真实为1的样本中被正确抓出的比例，侧重不漏报(减少FN)。\n**易错：** 召回率的分母是'真实为1'的数量；高召回率=漏报少。\n**面试追问：** 疾病筛查/天气预报/诈骗识别优先召回率——漏报(漏诊/漏报下雨)代价更严重。","source":"v2.4","star":4,"bank":1},{"id":227,"code":"ML-48","category":"机器学习-逻辑回归","question":"F1-score 是什么？为什么需要它？","answer":"**公式：** F1 = 2 × (Precision × Recall) / (Precision + Recall)\n**为什么需要：** 精确率和召回率此消彼长——想提高召回率（少漏报）可能降低精确率（多误报），反之亦然；F1 是两者的调和平均数，能平衡两者综合评估。\n**例子：** 精确率 0.9、召回率 0.9 → F1 = 2×0.9×0.9/1.8 = 0.9\n**API：** precision_score / recall_score / f1_score","extend":"**补充：** F1=2×(P×R)/(P+R)是精确率与召回率的调和平均数，平衡两者综合评估。\n**易错：** 精确率0.9召回率0.1的算术平均是0.5但F1只有0.18——调和平均对失衡更严格。\n**面试追问：** 类别不平衡时准确率会骗人(99%多数类)，必须看F1；多分类用macro-F1(各类平均)/weighted-F1(加权)。","source":"v2.4","star":4,"bank":1},{"id":260,"code":"FS-2","category":"FastAPI","question":"如何搭建FastAPI环境并运行第一个接口？","answer":"**环境搭建：**\n- python -m venv fastapi-env 创建虚拟环境\n- pip install \"fastapi[standard]\" 安装(含uvicorn)\n\n**第一个接口：**\n```python\nfrom fastapi import FastAPI\napp = FastAPI()\n@app.get(\"/\")\ndef read_root():\n    return {\"message\": \"Hello FastAPI\"}\n```\n**运行：** uvicorn main:app --reload\n- 访问 http://127.0.0.1:8000 看JSON返回\n- 访问 /docs 自动接口文档(Swagger)，可在线测试\n\n**注意：** main是文件名、app是实例名；--reload改代码自动重启。","extend":"**易错：** uvicorn main:app —— main是文件名、app是FastAPI实例名，必须一致；--reload开发热重载。\n**追问：** /docs(Swagger UI)和/redoc(ReDoc)两个自动文档地址；端口冲突用--port 8001。\n**补充：** pip install \"fastapi[standard]\"包含uvicorn等常用依赖。","source":"v2.4","star":4,"bank":1},{"id":312,"code":"HR-2","category":"人事面","question":"为什么来XX(北京或深圳)找工作?","answer":"面试官对异地求职者90%都会问的问题,主要考察你是否稳定,个人经验能力之外,排在第一位的就是稳定性,如果不够稳定,那么其余都是空谈。回答范例:我来自河南,河南是一个农业大省,IT 行业还不是很发达,我是学计算机专业的,也很喜欢这个行业,深圳在国内 IT 行业发展是最快的,所以我想来这里谋求发展,学习更多的新技术,能够带来自我的提升。注意:不要说以前公司有多么不好。也不要说哪个哥们混的很不错,羡慕才来深圳。因为企业招人想要的都是能够⻓期工作的人,可能哪个哥们哪天在别的地方又混的更好了,你是不是还要跳槽?所以,只要说来学习更多新技术和管理经验就够了。","extend":"","source":"bh","star":2,"bank":1},{"id":316,"code":"HR-6","category":"人事面","question":"什么时候能入职?","answer":"大多数企业会关心就职时间,最好是回答“如果被录用的话,到职日可按公司的规定上班”,如果还未辞去上一个工作,但上班时间又太近,似乎有些强人所难,因为交接至少要一个月的时间,应进一步说明原因,录取公司应该会通融的。","extend":"","source":"bh","star":1,"bank":1},{"id":320,"code":"HR-10","category":"人事面","question":"社保问题","answer":"如果上家公司写的是外地公司的话,之前是否上过社保深圳这边是查不到的,而且都要重新上。如果上家写的深圳公司,之前确实没有上过的话,就说之前公司规模小,五险一金一直没有上,但是签了自动放弃的协议,公司也给一部分补偿金,金额大概 1000 左右。如果之前你在深圳上过一段时间的社保,跟现在写的工作经历对不上的话,就说之前公司不给上, 有一段时间自己通过关系找了一家公司挂靠了一段时间。面试的时候如果HR问你之前在深圳是否上过社保,只要说是或者否就可以,不用主动说太多。对方问的话再解释。","extend":"","source":"bh","star":1,"bank":1},{"id":321,"code":"HR-11","category":"人事面","question":"上家公司薪资构成,及到手多少钱?","answer":"网上找税收计算器,把上家薪资输入自动算出扣税多少,再加上社保补偿金,就是你最后到手的工资,不用跟面试官说的特详细,只要说个大概就好。","extend":"","source":"bh","star":1,"bank":1},{"id":322,"code":"HR-12","category":"人事面","question":"你有没有在工作中遇到过你无论如何都难以解决的问题?你的态度如何?","answer":"工作中难免会有些问题难以被彻底的解决,在这样的情况下,我会思考这样几个问题:我是否已经尽了全力,是否还有什么方法或什么人能够帮助我解决问题?我是否已经全面的思考过问题的方方面面,还是钻在死胡同里出不来?我是否能在目前情况下改善问题,哪怕只是较小程度的改善?有时一些小小的改善积累起来可能最终就能够解决问题。我认为遇到问题的态度切忌慌乱,往往欲速则不达,因此要冷静下来思考。另外就是切记不停的抱怨,不停的抱怨不但会给人留下负面印象,甚至因为消极的态度错过了解决问题的最后机会。点评:该求职者首先表现了他不会轻易放弃解决问题的态度,懂得从各个⻆度去思考问题,并且会努力到最后一刻。在表述自己遇到问题的态度方面,该求职者也表现的非常完美,冷静、不抱怨并积极处理问题是所有面试官都会欣赏的态度。","extend":"","source":"bh","star":2,"bank":1},{"id":323,"code":"HR-13","category":"人事面","question":"你对加班的看法?","answer":"实际上好多公司问这个问题,并不证明一定要加班,只是想测试你是否愿意为公司奉献。回答范例:如果是工作需要我会义不容辞加班,我现在单身,没有任何家庭负担,可以全身心的投入工作。但同时,我也会提高工作效率,减少不必要的加班。","extend":"","source":"bh","star":1,"bank":1},{"id":324,"code":"HR-14","category":"人事面","question":"你朋友对你的评价?","answer":"回答提示: 想从侧面了解一下你的性格及与人相处的问题。回答样本一:我的朋友都说我是一个可以信赖的人。因为,我一旦答应别人的事情,就一定会做到。如果我做不到,我就不会轻易许诺。回答样本二:我觉的我是一个比较随和的人,与不同的人都可以友好相处。在我与人相处时,我总是能站在别人的⻆度考虑问题。","extend":"","source":"bh","star":1,"bank":1},{"id":325,"code":"HR-15","category":"人事面","question":"谈谈你对跳槽的看法?","answer":"回答提示:1正常的“跳槽”能促进人才合理流动,应该支持。2频繁的跳槽对单位和个人双方都不利,应该反对。","extend":"","source":"bh","star":1,"bank":1},{"id":326,"code":"HR-16","category":"人事面","question":"工作中你难以和同事、上司相处,你该怎么办?","answer":"回答提示:\n\n1我会服从领导的指挥,配合同事的工作。\n\n2我会从自身找原因,仔细分析是不是自己工作做得不好让领导不满意,同事看不惯。还要看看是不是为人处世方面做得不好,如果是这样的话我会努力改正。\n\n3如果我找不到原因,我会找机会跟他们沟通,请他们指出我的不足,有问题就及时改正。\n\n4作为优秀的员工,应该时刻以大局为重,即使在一段时间内,领导和同事对我不理解,我也会做好本职工作,虚心向他们学习,我相信,他们会看⻅我在努力,总有一天会对我微笑的。","extend":"","source":"bh","star":2,"bank":1},{"id":327,"code":"HR-17","category":"人事面","question":"假设你在某单位工作,成绩比较突出,得到领导的肯定,但同时你发现同事越来越孤立你,你怎么看这个问题?你准备怎么办?","answer":"回答提示:\n\n1成绩比较突出,得到领导的肯定是件好事情,以后更加努力。\n\n2检讨一下自己,是不是对工作的热心度超过同事间交往的热心了,加强同事间的交往及共同的兴趣爱好。\n\n3 工作中,切勿伤害别人的自尊心。\n\n4不再领导前拨弄是非。","extend":"","source":"bh","star":2,"bank":1},{"id":328,"code":"HR-18","category":"人事面","question":"最能概括你自己的三个词是什么?","answer":"回答提示:我经常用的三个词:适应能力强,有责任心和做事有始终,结合具体例子向主考官解释,","extend":"","source":"bh","star":2,"bank":1},{"id":329,"code":"HR-19","category":"人事面","question":"你的业余爱好是什么?","answer":"回答提示:找一些富于团体合作精神的,这里有一个真实的故事:有人被否决掉,因为他的爱好是深海潜水。主考官说:因为这是一项单人活动,我不敢肯定他能否适应团体工作。多说团体合作,爱浏览技术网站、博客、书籍。最好提前想好最近在看那本书,看到了哪个部分。","extend":"","source":"bh","star":1,"bank":1},{"id":331,"code":"HR-21","category":"人事面","question":"说你的家庭?","answer":"回答提示:企业面试时询问家庭问题不是非要知道求职者家庭的情况,探究隐私,企业不喜欢探究个人隐私,而是要了解家庭背景对求职者的塑造和影响。企业希望听到的重点也在于家庭对求职者的积极影响。企业最喜欢听到的是:我很爱我的家庭,我的家庭一向很和睦,虽然我的父亲和母亲都是普通人,但是从小,我就看到我父亲起早贪黑,每天工作特别勤劳, 他的行动无形中培养了我认真负责的态度和勤劳的精神。我母亲为人善良,对人热情,特别乐于助人,所以在单位人缘很好,她的一言一行也一直在教导我做人的道理。企业相信,和睦的家庭关系对一个人的成⻓有潜移默化的影响。","extend":"","source":"bh","star":1,"bank":1},{"id":332,"code":"HR-22","category":"人事面","question":"就你申请的这个职位,你认为你还欠缺什么?","answer":"回答提示:企业喜欢问求职者弱点,但精明的求职者一般不直接回答。他们希望看到这样的求职者:继续重复自己的优势,然后说:“对于这个职位和我的能力来说,我相信自己是可以胜任的,只是缺乏经验,这个问题我想我可以进入公司以后以最短的时间来解决,我的学习能力很强,我相信可以很快融入公司的企业文化,进入工作状态。”企业喜欢能够巧妙地躲过难题的求职者。","extend":"","source":"bh","star":2,"bank":1},{"id":333,"code":"HR-23","category":"人事面","question":"你欣赏哪种性+格的人?","answer":"回答提示:诚实、不死板而且容易相处的人、有“实际行动”的人。","extend":"","source":"bh","star":1,"bank":1},{"id":336,"code":"HR-26","category":"人事面","question":"你做过的哪件事最令自己感到骄傲?","answer":"回答提示:这是考官给你的一个机会,让你展示自己把握命运的能力。这会体现你潜在的领导能力以及你被提升的可能性。假如你应聘于一个服务性质的单位,你很可能会被邀请去午餐。记住:你的前途取决于你的知识、你的社交能力和综合表现。","extend":"","source":"bh","star":2,"bank":1},{"id":339,"code":"HR-29","category":"人事面","question":"你希望与什么样的上级共事?","answer":"回答提示:1通过应聘者对上级的“希望”可以判断出应聘者对自我要求的意识,这既上一个陷阱,又是一次机会。2最好回避对上级具体的希望,多谈对自己的要求。3如“做为刚步入社会的新人,我应该多要求自己尽快熟悉环境、适应环境,而不应该对环境提出什么要求,只要能发挥我的专⻓就可以了。分析:这个问题比较好的回答是,希望我的上级能够在工作中对我多指导,对我工作中的错误能够立即指出。总之,从上级指导这个方面谈,不会有大的纰漏。","extend":"","source":"bh","star":2,"bank":1},{"id":341,"code":"HR-31","category":"人事面","question":"怎样看待学历和能力?","answer":"回答提示:学历我想只要是大学专科的学历,就表明觉得我具备了根本的学习能力。剩下的,你是学士也好,还是博士也好,对于这一点的讨论,不是看你学了多少知识,而是看你在这个领域上发挥了什么,也就是所说的能力问题。一个人工作能力的高低直接决定其职场命运,而学历的高低只是进入一个企业的敲⻔砖,如果贵公司把学历卡在博士上,我就无法进入贵公司,当然这不一定只是我个人的损失,如果一个专科生都能完成的工作,您又何必非要招聘一位博士生呢?","extend":"","source":"bh","star":1,"bank":1},{"id":343,"code":"HR-33","category":"人事面","question":"你希望你的上级是什么样子的?","answer":"我希望我的上级能够在工作中对我多指导,对我工作中的错误和问题能够及时指出。","extend":"","source":"bh","star":2,"bank":1},{"id":344,"code":"HR-34","category":"人事面","question":"除了本公司外,还应聘了哪些公司?","answer":"回答提示:很奇怪,这是相当多公司会问的问题,其用意是要概略知道应徵者的求职志向,所以这并非绝对是负面答案,就算不便说出公司名称,也应回答“类似的公司(互联网)”,如果应聘的其他公司是不同业界,容易让人产生无法信任的感觉。","extend":"","source":"bh","star":2,"bank":1},{"id":390,"code":"DB-54","category":"缓存与Redis","question":"如何在 FastAPI 异步接口中集成 Redis 缓存？标准三步模板是什么？","answer":"**异步客户端：** `import redis.asyncio as redis`，连接加 `decode_responses=True` 返回字符串。异步版 = 同步版方法名 + `await`。\n\n**加缓存三步模板：查缓存 → 没有就查库 → 查完写缓存(带过期)：**\n```python\n@app.get(\"/goods/{goods_id}\")\nasync def get_goods(goods_id: int):\n    cache_key = f\"goods:{goods_id}\"\n    cached = await r.get(cache_key)          # 1. 先查缓存\n    if cached:\n        return {\"source\": \"redis缓存\", \"data\": cached}\n    goods = fake_db.get(goods_id)            # 2. 查\"数据库\"\n    if goods is None:\n        await r.set(cache_key, \"null_value\", 30)  # 3a. 缓存空值防穿透\n        return {\"source\": \"数据库\", \"data\": None}\n    await r.set(cache_key, str(goods), 300)       # 3b. 查到写缓存\n    return {\"source\": \"数据库\", \"data\": goods}\n```\n\n**为什么要异步？** `await` 会\"让出\"事件循环，等 Redis 返回期间还能处理其他请求；同步版会卡住整个线程，FastAPI 高并发场景撑不住。","extend":"**易错：** 接口要改成 `async def`，所有 Redis 命令加 `await`；应用退出前建议 `await r.aclose()` 释放连接池。\n**追问：** 查不到缓存空值、查到带过期，都是防穿透/防脏数据的标准做法。","source":"yd","star":4,"bank":1},{"id":407,"code":"LLM-1","category":"大模型应用","question":"什么是低代码平台？AI 应用开发有哪些低代码平台？","answer":"**低代码平台：** 通过可视化拖拽、配置的方式搭建应用，大幅减少手写代码，降低开发门槛、提升交付速度。\n\n**为什么要用：** 让不懂深度编程的人也能快速搭建应用；企业级应用开发更高效，把精力集中在业务逻辑而非重复代码。\n\n**AI 应用开发主流低代码平台：**\n| 平台 | 厂商 | 特点 |\n|---|---|---|\n| Dify | 苏州语灵 | 国际化做得好，企业级应用开发 |\n| Coze(扣子) | 字节跳动 | 自媒体、小团队 |\n| 商道 | — | 语音方向、政府场景 |\n\n**能做什么：** RAG 知识库、Agent、工作流编排等大模型应用核心能力，均可用可视化方式搭建。","extend":"**追问：** 低代码 ≠ 无代码——复杂逻辑仍需写代码(如自定义节点)，低代码是\"可视化 + 代码扩展\"结合。","source":"note","star":4,"bank":1},{"id":439,"code":"PYH-21","category":"综合进阶","question":"请说明Python中for循环的底层实现原理？","answer":"**for底层等价：** it=iter(iterable)获取迭代器→while True: try: x=next(it)取元素→except StopIteration: break退出。for自动完成iter()/next()/异常捕获三步骤。迭代器有状态只能向前→只能遍历一次。无__iter__时回退找__getitem__()。","extend":"**代码：**\n```python\nit = iter(iterable)\nwhile True:\n    try:\n        x = next(it)\n    except StopIteration:\n        break\n```\n**易错：** 无__iter__的对象回退__getitem__按0,1,2...取到IndexError转StopIteration；迭代器只能前进不可重置。\n**面试追问：** for循环本身不漏元素——遍历中修改原容器才出问题；解决用lst.copy()遍历或列表推导式。","source":"v2.4-reimport","star":4,"bank":1},{"id":442,"code":"PD-48","category":"Pandas","question":"pivot_table透视表的参数和用途？","answer":"**用途：** 透视表是\"行维度 × 列维度\"的交叉汇总表。\n\n**参数：**\n- index：作为行分组\n- columns：作为列分组\n- values：要聚合的数值列\n- aggfunc：聚合方式（默认求平均）\n- margins=True：最右边一列和最下面一行显示总计（All）\n- fill_value=0：让没有销售记录的格子显示0而不是空白\n\n**示例：** pd.pivot_table(df, values=\"销售额\", index=\"类别\", columns=\"门店\", aggfunc=\"sum\", margins=True, fill_value=0) 统计不同商品类别在三个门店的销售额","extend":"**补充：** 透视表='行维度×列维度'的交叉汇总；index行分组、columns列分组、values聚合数值列、aggfunc聚合方式。\n**代码：**\n```python\npd.pivot_table(df, values='销售额', index='类别', columns='门店',\n               aggfunc='sum', margins=True, fill_value=0)\n```\n**易错：** aggfunc默认mean(不是sum)；margins=True加总计行/列；fill_value=0让无数据格显示0而非空白。\n**面试追问：** pivot(不聚合纯重排) vs pivot_table(聚合)——长表转宽表用pivot，宽表转长表用melt；透视表+热力图是分析标配。","source":"v2.4-reimport","star":4,"bank":1}],"2":[{"id":3,"code":"PY-3","category":"Python基础","question":"请说明各数据类型之间的转换规则和隐式转换？","answer":"**显式转换：** int(x)字符串→整数/浮点截断/布尔→1/0（'1a'→ValueError）；float(x)整数→浮点；str(x)任意→字符串；bool(x)空零值→False，非空→True。\n\n**隐式转换：**\n- int+float→float\n- int/int→float（除法永远返回浮点）\n- bool+int→int(True=1)\n- 字符串+数字→TypeError\n\n**关键：**\n- input()返回值永远是字符串需手动转换\n- `int('1a')`→ValueError","extend":"**易错：** int('1.9')抛ValueError，float('1.9')成功；int('')报错；bool('False')为True(非空字符串为真)。\n**补充：** int(3.9)=3直接截断而非四舍五入；Python3中int/int必返回float(整除用//)。\n**实战：** input()返回值永远是str，做运算前先转换；金额运算用Decimal避免精度误差；ord()/chr()字符与编码互转。","source":"v2.4","star":4,"bank":2},{"id":4,"code":"PY-4","category":"Python基础","question":"请说明print()函数、f-string格式化输出和字符串常用操作？","answer":"**print()：** end=''控制结尾、sep=','控制分隔符。\n**f-string最推荐：**\n- f'我叫{name}今年{age}岁'\n- 保留小数f'π:{pi:.2f}'\n- 宽度对齐f'a={a:4d}'\n- 补零f'b={b:04d}'\n**input()：** 阻塞等待，返回字符串。\n\n**字符串常用：**\n- find()→-1不报错/index()→抛异常\n- count()/upper()/lower()/title()\n- strip()去空格\n- split()分割为列表/join()拼接\n- replace()替换\n- startswith()/endswith()\n- isalpha()/isdigit()\n- r''原始字符串\n- \\n/\\t/\\\\转义","extend":"**f-string进阶：** f'{name:<10}'左对齐、f'{x:+.2f}'带符号、f'{n:,}'千分位、f'{p:.0%}'百分比、f'{d:%Y-%m-%d}'日期格式。\n**易错：** f-string的{}内不能出现反斜杠(如f'{s.split(chr(32))[0]}'需曲线实现)；print默认end='\\n'。\n**性能：** 大量字符串拼接用''.join(list)远快于循环+；split()默认按空白切，split(',')按指定分隔符。","source":"v2.4","star":4,"bank":2},{"id":20,"code":"PY-20","category":"函数与作用域","question":"请对比lambda函数和def定义函数的区别？","answer":"**lambda：** 只能单个表达式，不能含语句；匿名；不支持类型注解/docstring。适用：一次性简单函数作高阶函数参数(map/filter/sorted的key)。\n\n**def：**\n- 可多语句+复杂逻辑\n- 有函数名方便调试。适用：需复用/逻辑复杂/需文档的函数\n\n**map(func,iter)：** 函数应用到每个元素→迭代器。\n**filter(func,iter)：** 保留True→迭代器。\n**sorted(iter,key,reverse)：** 排序→新列表。\n**zip(*iters)：** 按下标配对，最短为准；zip(*pairs)解压。注意：map/filter/zip返回的都是迭代器，只能遍历一次；sorted返回新列表，可多次遍历","extend":"**易错：** lambda只能单表达式不能含语句；循环中`lambda: i`延迟绑定全部取末值——用默认参数`lambda i=i: i`修复。\n**补充：** sorted(key=)最常用：sorted(students, key=lambda s: s['age'])，operator.itemgetter('age')更快；max/min也支持key。\n**面试追问：** map/filter/zip都返回迭代器只能遍历一次；能用生成器表达式/推导式时优先于map+lambda，可读性更好。","source":"v2.4","star":4,"bank":2},{"id":21,"code":"PY-21","category":"函数与作用域","question":"请详细解释__new__和__init__的区别与执行顺序？","answer":"**__new__：**\n- 静态方法，cls参数\n- 创建并返回实例，分配内存\n- 返回cls实例→自动调__init__\n- 场景：单例/工厂模式\n**__init__：**\n- 实例方法，self参数\n- 初始化属性\n- 在__new__之后调用，不返回值\n**顺序：** __new__→返回实例→__init__。大多数只需重写__init__。","extend":"**补充：** __new__是静态方法需返回实例，若返回的不是cls实例则不会自动调用__init__；单例模式常在__new__内加锁保证多线程安全。\n**易错：** __init__必须返回None，否则TypeError；__new__用于不可变类型子类(str/tuple)时很有用。\n**面试追问：** 完整创建链路——type.__call__先调cls.__new__，再调cls.__init__；元类可拦截整个过程(如自动注册类)。","source":"v2.4","star":4,"bank":2},{"id":26,"code":"PY-26","category":"面向对象","question":"请详细说明类中三种方法的区别：实例方法、@classmethod、@staticmethod？","answer":"| 特性 | 实例方法 | 类方法 | 静态方法 |\n|------|----------|--------|----------|\n| 装饰器 | 无 | @classmethod | @staticmethod |\n| 第一参数 | self | cls | 无 |\n| 访问实例属性 | ✓ | ✗ | ✗ |\n| 访问类属性 | ✓ | ✓ | ✗(需类名) |\n| 调用方式 | 实例 | 类和实例均可 | 类和实例均可 |\n\n**@classmethod：** cls参数，可访问类变量、调类方法、实例化对象(工厂模式)。\n**关键：** 可被子类继承重写(多态)。场景：工厂/替代构造函数。\n**@staticmethod：**\n- 无self/cls，与普通函数类似\n- 不依赖类和实例\n- 场景：工具函数\n**关键区别：** 类方法参与多态，静态方法不参与。","extend":"**易错：** 静态方法不参与多态——子类调用静态方法仍执行父类版本；类方法参与多态(传入子类cls)。\n**实战：** @classmethod工厂`User.from_dict(data)`；@staticmethod放纯工具函数(如邮箱校验)；实例方法操作实例状态。\n**面试追问：** 表格记忆——self访问实例属性/类属性均可；cls访问类属性可，访问实例属性不可；无参静态方法两者都不可直接访问。","source":"v2.4","star":4,"bank":2},{"id":27,"code":"PY-27","category":"面向对象","question":"请详细解释Python中的多重继承及菱形继承问题如何解决？","answer":"**多重继承：** 一个子类同时继承多个父类。\n**菱形继承：** 两父类同源→方法多次调用/顺序混乱。\n\n**解决：MRO(C3线性化)+super()。**\n- C3保证每个父类只出现一次+单调性+正确处理菱形\n- super()按MRO顺序调下一个类方法\n- 查看：类.__mro__\n\n**最佳实践：** 所有父类都用super()，__init__接受`**`kwargs传递参数。","extend":"**补充：** C3线性化保证——子类先于父类、父类相对顺序不变、单调性；`类.__mro__`查看完整解析顺序，`类.mro()`同。\n**易错：** 菱形继承中只要有一个父类不调super()就断链，后续父类不初始化；统一`super().__init__(**kwargs)`。\n**面试追问：** mixin模式——通用功能(如打印/序列化)写成mixin类多继承组合，避免多层深继承；组合优于继承原则。","source":"v2.4","star":4,"bank":2},{"id":29,"code":"PY-29","category":"面向对象","question":"请详细说明Python中属性访问的完整查找顺序和@property原理？","answer":"**属性访问顺序(obj.attribute)：**\n1. __getattribute__()→最优先调用\n2. 数据描述符(__set__+__get__) → 3. 实例__dict__ → 4. 非数据描述符(仅__get__) → 5. 按MRO查父类 → 6. __getattr__()\n**关键：** 数据描述符>实例属性>非数据描述符。\n\n**@property原理：**\n- 将方法转为属性无需括号调\n- 创建property对象=数据描述符(实现__get__/__set__/__delete__)\n- 通过描述符协议拦截属性访问路由到getter/setter/deleter\n- 读取脱敏+修改校验","extend":"**补充：** 完整顺序——__getattribute__→数据描述符(有__set__)→实例__dict__→非数据描述符(仅__get__)→MRO父类→__getattr__；数据描述符优先级高于实例属性。\n**易错：** 方法是非数据描述符，实例属性可与方法同名并覆盖它；@property的setter/deleter做校验。\n**面试追问：** property是内置描述符；__slots__用描述符替代__dict__省内存并限制属性。","source":"v2.4","star":4,"bank":2},{"id":34,"code":"PY-34","category":"面向对象","question":"请解释Python中常用魔法方法、MRO和继承重写多态？","answer":"**魔法方法：** __new__创建、__init__初始化、__del__析构、__str__/__len__/__call__；__add__/__sub__运算符重载；__slots__限制属性省内存。\n\n**MRO：**\n- 多重继承中方法搜索基类顺序\n- C3线性化算法\n- 查看：类.__mro__\n- 按顺序查找第一个匹配即停\n\n**继承：** 子类继承父类公有和保护。super()调父类。\n**重写：** 子类同名方法覆盖父类。\n**多态：**\n- 不同子类同方法不同行为\n- Python鸭子类型：只要对象有对应方法即可调\n- 私有属性__xxx不继承，@property完全继承","extend":"**补充：** __str__给人看(print触发)、__repr__给调试看(repr()/交互式)；__eq__重写后对象变不可哈希，需同步重写__hash__；__lt__等让sorted可用。\n**易错：** __slots__限制属性且省内存，但子类不写__slots__会重新获得__dict__；__call__让实例可像函数调用。\n**面试追问：** 鸭子类型——只要对象有run()就能调，不必是某个类；多态=同一接口不同实现，配合ABC更规范；super()按MRO解析。","source":"v2.4","star":4,"bank":2},{"id":39,"code":"PYH-5","category":"并发编程","question":"请解释asyncio中的await、async def、Task、Future的关系和事件循环高并发原理？","answer":"**async def：** 定义协程函数，调用返回协程对象不立即执行。\n**await：** 挂起协程等待可等待对象(协程/Task/Future)。\n**Task：** Future子类，包装协程使其可被调度(create_task)。\n**Future：** 未完成异步操作容器，最终持结果/异常。\n\n**事件循环原理：** 维护就绪队列+I/O监听(epoll/select)→取Task执行→遇await挂起注册I/O→I/O完成放回队列→循环。\n\n**协作：** 协程await让出控制权→事件循环查I/O→完成写Future→恢复Task。asyncio.gather()批量并发统一收集返回值。\n\n**优势vs多线程：** 无锁竞争、轻量级(用户态切换)、资源占用少(数万协程<少量内存)、确定性(切换点在await处可控)。劣势：需异步库，调试复杂。","extend":"**代码：**\n```python\nimport asyncio\nasync def main():\n    tasks = [asyncio.create_task(fetch(i)) for i in range(10)]\n    results = await asyncio.gather(*tasks)\n```\n**易错：** 协程对象必须await或被create_task调度才真正执行，忘记await是常见bug；asyncio.run()负责创建并运行事件循环。\n**面试追问：** 事件循环=就绪队列+epoll/IOCP监听，I/O完成写Future恢复Task；gather收集返回值，wait可设超时/取消。","source":"v2.4","star":4,"bank":2},{"id":44,"code":"PYH-10","category":"并发编程","question":"请说明ThreadPoolExecutor和进程池Pool的用法？","answer":"**ThreadPoolExecutor：** with ThreadPoolExecutor(max_workers=5) as pool: 默认CPU核数+4(≤32)。submit(fn,*a,`**`k)→Future；map(fn,*iters)→结果迭代器。Future方法：result(timeout)/done()/running()/cancel()/add_done_callback()。\n\n**进程池Pool：** Pool(processes=None) None=CPU核数。apply()同步阻塞；apply_async()异步；map/map_async批量；close()+join()关闭等待。\n**参数：**\n- initializer初始化函数\n- maxtasksperchild处理N个后重启(防内存泄漏)","extend":"**代码：**\n```python\nfrom concurrent.futures import ThreadPoolExecutor\nwith ThreadPoolExecutor(max_workers=8) as pool:\n    results = list(pool.map(fn, items))\n```\n**易错：** submit返回Future，异常在result()时抛出；map保持输入顺序但整体慢，乱序收集用as_completed。\n**面试追问：** 线程池默认max_workers=CPU核数+4(≤32)；进程池Pool(processes=CPU核数)适合CPU密集；maxtasksperchild处理N个任务后重启防内存泄漏。","source":"v2.4","star":4,"bank":2},{"id":48,"code":"PY-37","category":"Python基础","question":"请说明raise的用法及Python的异常继承体系与自定义异常？","answer":"**raise：**\n- ①raise异常类型('描述')主动抛出\n- ②raise(无参except中)重新抛出保留原始信息\n\n**继承体系：** BaseException→所有异常顶层。SystemExit(sys.exit())/KeyboardInterrupt(Ctrl+C)。Exception→所有业务异常父类(TypeError/ValueError/NameError/KeyError/ZeroDivisionError等)。\n**自定义：** class AgeError(Exception): 见名知意、精准捕获、代码规范。","extend":"**补充：** 继承树——BaseException→SystemExit/KeyboardInterrupt/GeneratorExit + Exception；业务异常一律继承Exception。\n**代码：**\n```python\nclass AgeError(ValueError): ...\nraise AgeError('年龄不合法')\n```\n**易错：** except Exception抓不到KeyboardInterrupt(Ctrl+C)；except:裸捕获危险；assert是调试断言可被-O关闭。\n**面试追问：** raise无参在except中重新抛出保留原堆栈；日志里用traceback.format_exc()打印完整堆栈。","source":"v2.4","star":4,"bank":2},{"id":49,"code":"PY-38","category":"Python基础","question":"请说明open()函数的参数和文件打开模式？","answer":"**open(file_path,mode,encoding,errors)：**\n- mode=r只读\n- w只写(清空)\n- a追加\n- x新建(存在报错)\n- b二进制\n- t文本(默认)\n- +可读写\n- encoding：Win默认GBK，Linux/Mac默认UTF-8\n- errors：ignore忽略/replace替换/None抛异常\n- 组合：r+/w+(覆盖)/a+(追加)读写；rb/wb二进制\n**with语句：** with open() as f: 自动关闭异常安全。实现__enter__/__exit__的上下文管理器。","extend":"**代码：**\n```python\nwith open('a.txt', 'w', encoding='utf-8') as f:\n    f.write('你好')\n```\n**易错：** Windows不指定encoding默认GBK，跨平台读写中文乱码——统一utf-8；w清空原内容，x已存在报错，a追加。\n**面试追问：** 二进制rb/wb读写图片；r+读写不截断、w+截断、a+追加读；errors='ignore'/'replace'处理坏字节；大文件用迭代逐行读。","source":"v2.4","star":4,"bank":2},{"id":68,"code":"DB-9","category":"MySQL","question":"请说明SELECT查询基础和WHERE条件运算符？","answer":"**基础：**\n- SELECT字段列表FROM表名\n- SELECT *不推荐生产用\n- WHERE筛选行\n- AS别名(可省略AS)\n- DISTINCT去重\n- SELECT可查常量/表达式/函数\n\n**比较：**\n- > < >= <= = !=/<>\n- ⚠️=不能用于NULL判断\n- NULL用IS NULL/IS NOT NULL\n**范围：**\n- BETWEEN x AND y(含边界)\n- IN(x,y,z)\n- NOT BETWEEN/NOT IN取反\n**逻辑：**\n- AND/&&与\n- OR/||或\n- NOT/!非","extend":"**补充：** WHERE执行在SELECT之前，所以WHERE不能用SELECT别名；IN/NOT IN遇到NULL结果不可靠，可用EXISTS替代。\n**易错：** =判断NULL结果为NULL被当假，必须IS NULL/IS NOT NULL；BETWEEN含边界；!=与<>等价。\n**面试追问：** 优化器会重排条件顺序，但索引失效写法(函数包裹/隐式转换)无法修复；DISTINCT底层走排序或哈希去重。","source":"v2.4","star":4,"bank":2},{"id":112,"code":"PD-13","category":"Pandas","question":"视图（view）和副本（copy）的区别？如何判断？","answer":"**视图：** 不复制数据，只是用不同的形状、顺序去读取同一块内存。修改视图，原数组也会改变。产生视图的操作：reshape、.T（连续内存时）、ravel（内存连续时）\n**副本：** 完全复制一份数据，新数组和原数组没有任何关系，修改互不影响。产生副本的操作：copy()、布尔索引、花式索引、np.sort()、concatenate\n\n**判断方法：**\n- arr.base属性：有值→视图；None→副本\n- np.shares_memory(a,b)：返回True代表共享同一块内存（视图）","extend":"**补充：** 视图=同一块内存不同解读(reshape/.T/连续内存ravel/切片)；副本=完全独立数据(copy/花式索引/布尔索引/np.sort/concatenate)。\n**判断：** arr.base为None是副本(或原始数组)；np.shares_memory(a,b)返回True=共享内存。\n**易错：** 修改视图影响原数组常被忽略导致隐蔽bug；需要独立数据时显式.copy()。\n**面试追问：** 内存不连续时(切片步长)ravel自动降级副本；flatten永远副本；大数组视图比副本省内存。","source":"v2.4","star":4,"bank":2},{"id":162,"code":"LNX-14","category":"Linux","question":"chmod修改权限的两种方式？数字权限怎么换算？","answer":"**符号方式：** chmod [{ugoa}{+-=}{rwx}] 文件或目录\n- u所有者、g所有组、o其他人、a所有人\n- 例：chmod u+x passwd（属主加执行）、chmod u-x,o+x passwd（属主去执行、其他人加执行）\n\n**数字方式：** chmod [mode] 文件或目录\n- r=4、w=2、x=1，rwx=4+2+1=7\n- 例：chmod 765（属主rwx、属组rw、其他r-x）\n\n**递归：** chmod -R 777 test（递归修改整个文件夹及其里面的所有文件权限）","extend":"**补充：** 符号方式chmod u+x/o-w/a=r；数字方式r=4 w=2 x=1求和；-R递归修改。\n**代码：**\n```bash\nchmod u+x passwd\nchmod 765 passwd    # 属主rwx、属组rw、其他r-x\nchmod -R 755 dir\n```\n**易错：** 数字三位顺序固定=属主/属组/其他；7=4+2+1；生产环境禁止777。\n**面试追问：** 常见权限——755目录/脚本、644普通文件、600密钥文件；chmod +x给脚本执行权限。","source":"v2.4","star":4,"bank":2},{"id":268,"code":"FS-10","category":"FastAPI","question":"依赖注入Depends的作用与优势？","answer":"**依赖注入：** 把重复代码抽成可复用工具(依赖)，接口需要时直接声明引用，不用重复写。\n\n**简单示例：**\n```python\nfrom fastapi import Depends\ndef get_current_time():  # 依赖函数\n    return datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")\n@app.get(\"/hello\")\ndef hello(current_time: str = Depends(get_current_time)):\n    return {\"message\": \"Hello\", \"current_time\": current_time}\n```\n**四大优势：**\n- 复用性：一次定义，多个接口使用\n- 可维护性：改依赖一处，所有接口生效\n- 可测试性：依赖可轻松替换\n- 解耦：接口只关心返回值\n\n**典型场景：** 登录验证、数据库会话、通用工具。","extend":"**代码：** `def hello(current_time: str = Depends(get_current_time))`。\n**追问：** 依赖可嵌套(依赖里再用Depends)；get_database用yield实现\"请求级会话管理\"(提交/回滚/关闭)。\n**优势总结：** 复用性、可维护性、可测试性、解耦——修改依赖一处生效所有接口。","source":"v2.4","star":4,"bank":2},{"id":311,"code":"HR-1","category":"人事面","question":"请介绍一下你自己","answer":"回答提示:这是面试官100%会问的问题,一般人回答这个问题过于平常,只说姓名、年龄、爱好、所学专业等,如果你用一分钟来重复你的简历,那么,你的印象加分没有了!不妨坦诚自信地展现自我,重点突出与应聘职位相吻合的优势。你的相关能力和素质是企业最感兴趣的信息。因为,在许多情况下,在听取你的介绍时,面试官也会抓住他感兴趣的点深入询问。所以,在进行表述时,要力求以真实为基础,顾及表达的逻辑性和条理性,避免冗⻓而没有重点的叙述。一定要在最短的时间内激发起面试官对你的好感。回答范例:\n\n1)我叫 XX,今年 X 岁,XXXX 年毕业于 XX 大学。有 3 年的开发工作经验,我对技术有深厚的兴趣,专业知识面宽,责任心强,思路清晰,沟通力能好,精通.Net 技术体系,熟悉 MVC。平常有时间看看博客,并且自己也喜欢在 CSDN 上写技术类的文章,与博友一起讨论。谢谢!\n\n2)如果跟人事自我介绍:您好!我叫***,(如果学校和专业好的话可以提一下,一般的话就算了。)我之前在 XX 公司做过两年 JAVA 开发工程师,在这两年当中大概接触过什么样类型的项目,(比如商城,金融等)今天看了咱们公司招聘的岗位需求跟我之前的工作内容挺相符的,而且咱们公司的业务也是我喜欢的类型,所以我今天过来面试。希望可以加入到咱们公司当中来。\n\n3)如果是跟技术自我介绍:您好!我叫***,(如果学校和专业好的话可以提一下,一般的话就算了。)我之前在 XX 公司做过两年 JAVA 开发工程师,在这两年当中大概接触过什么样类型的项目,(比如商城,金融等);在做这些项目的当中常用的一些技术点包括 XX 技术,(另外除了常用的技术还会一些其他的专业技能),今天看了咱们公司招聘的岗位需求跟我之前的工作内容挺相符的,所以我今天过来咱们公司面试,希望可以加入到咱们这个大家庭当中来","extend":"","source":"bh","star":2,"bank":2},{"id":313,"code":"HR-3","category":"人事面","question":"你为什么离开原来的公司?","answer":"回答提示:最重要的是:应聘者要使找招聘单位相信,应聘者在过往的单位的“离职原因”在此家招聘单位里不存在。避免把“离职原因”说得太详细、太具体。不能掺杂主观的负面感受,如“太辛苦”、“人际关系复杂”、“管理太混乱”、“公司不重视人才”、“公司排斥我们某某的员工”等。但也不能躲闪、回避,如“想换换环境”、“个人原因”等。不能涉及自己负面的人格特征,如不诚实、懒惰、缺乏责任感、不随和等。尽量使解释的理由为应聘者个人形象添彩。回答范例:如“我离职是因为这家公司倒闭;我在公司工作了三年多,有较深的感情;从去年始,由于市场形势突变,公司的局面急转直下;到眼下这一步我觉得很遗憾,但还要面对显示,重新寻找能发挥我能力的舞台。”同一个面试问题并非只有一个答案,而同一个答案并不是在任何面试场合都有效,关键在应聘者掌握了规律后,对面试的具体情况进行把握,有意识地揣摩面试官提出问题的心理背景,然后投其所好。分析:除非是薪资太低,或者是最初的工作,否则不要用薪资作为理由。“求发展”也被考官听得太多,离职理由要根据每个人的真实离职理由来设计,但是在回答时一定要表现得真诚。离职原因没有定式,要根据自己的情况以及应聘公司的情况灵活的去说,大概方向就是:合同到期,距离,技术,发展,公司经营不好,其他。","extend":"","source":"bh","star":2,"bank":2},{"id":314,"code":"HR-4","category":"人事面","question":"你最大的缺点是什么?","answer":"被面试官问的概率很大,也是 HR 的杀手锏和狠招,这个问题最难回答,通常面试官不希望听到求职直接回答的缺点是什么,如果求职者说自己小心眼、脾气大、工作效率低,企业肯定不会录用你。不要自作聪明地回答“我最大的缺点就是过于追求完美”,有的人以为这样回答会显得自己比较出色,但事实上,他已经岌岌可危了。面试官喜欢求职者从自己的优点说起,中间加一些小缺点,最后再把问题转到优点上,突出优点的部分,面试官喜欢聪明的求职者。回答范例:这个问题好难回答啊!我想想......(亲和力表现,也缓解了自己的紧张情绪)\n\n我的缺点是比较执着,比如在技术方面比较爱钻研,有的时候会为一个技术问题加班到深夜。还有就是,工作比较按部就班,总是按照项目经管的要求完成任务。另外的缺点是,总在息的工作范围内有创新意识,并没有扩展给其他同事。这些问题我想我可以进入公司后以最短的时间来解决,我的学习能力很强,我相信可以很快融入公司的企业文化,进入工作状态。我想就这些吧。","extend":"","source":"bh","star":2,"bank":2},{"id":315,"code":"HR-5","category":"人事面","question":"你对薪资的要求?","answer":"如果你对薪酬的要求太低,那显然贬低自己的能力;如果你对薪酬的要求太高,那又会显得你分量过重,公司受用不起。一些雇主通常都事先对求职的职位定下开支预算,因而他们第一次提出的价钱往往是他们所能给予的最高价钱,他们问你只不过想证实一下这笔钱是否足以引起你对该工作的兴趣。回答范例一:我对工资没有硬性要求,我相信贵公司在处理我的问题上会友善合理。我注重的是找对工作机会,所以只要条件公平,我则不会计较太多。如果你必须自己说出具体数目,那就不要说一个宽泛的范围,不要说10000-13000之间,那样你将只会得到最低限底的数字,也就是10000。最好给出一个具体的数字。你可以说我上家给的薪资是14K,个人期望薪资有一定的涨幅。","extend":"","source":"bh","star":2,"bank":2},{"id":317,"code":"HR-7","category":"人事面","question":"介绍一个你认为最熟悉的项目(项目经理)","answer":"这个问题在技术面试时常被问到,问这个问题的意图是想考察你的成⻓路径和编程习惯,因为,你最熟悉的项目往往是你成⻓最快的项目,那个成⻓最快的项目往往会给你今后的编程习惯留下很多痕迹。所以,通过你对熟悉项目的描述,有经验的他会很快锁定你技术成⻓中的缺陷和闪光点,从而判断是否能够“为我所用”。你最好拿出一个自己最擅⻓技术的那个项目进行介绍,他听完你的介绍后,会接下来进行提问,这样他所有问的问题,你都成竹在胸了。切忌拿自己参与很少的项目来介绍,一旦他深入的询问很可能你会答非所问,反而造成更严重的影响。你大强以和他谈谈在那个项目中获得的经验,这样会引起此君的共鸣,有可能的话,说出一些你自己的小技巧,他会很高兴,同时这场面试也会很轻松,拿到 Offer 基本没问题了。","extend":"","source":"bh","star":2,"bank":2},{"id":318,"code":"HR-8","category":"人事面","question":"如果公司录用你,你将怎样开展工作?","answer":"很多企业在招聘开发人员时很看重是否能够尽快上手,所以回答这个问题时要“实打实”的回答,在回答中最好强调能够“尽快”投入开发工作中,这样领导就放心了,会觉得你不是一个只会盲目工作的人,而是一个按部就班,稳打稳扎的人。回答范例:我对咱们公司的大体情况只有一个大概了解,在这个职位的工作性质仅仅是我自己的一个理解。作为这个职位而言,我想我首先要对本公司的主营业务要有一个了解,了解公司的业务组成部分、业务的发展方向、我们面向的客户性质等。第二我要了解所属部⻔在公司中的地位,以及部⻔的工作目标,从而确定自身的工作努力方向。第三,了解我参与项目的开发方式,架构方式,紧密配合领导工作,尽快投入具体的开发工作中。这就是我开展工作的计划。","extend":"","source":"bh","star":2,"bank":2},{"id":319,"code":"HR-9","category":"人事面","question":"你还有什么问题问我吗?","answer":"这个问题看上去可有可无,其实很关键,面试官不喜欢说“没有问题”的人,没有问题就是自寻死路,没有问题传达出你对公司缺乏兴趣,而只是来寻找一笔薪水。其实在面试过程中谦虚礼貌的问面试官怎么称呼,该部⻔工作中的信息,如项目情况,开发技术再或者说贵公司的晋升机制是什么样的等。表现出一种很积极主动的状态是非常讨巧的。也可以更多的了解到自己来的工作环境。企业很欢迎这样的求职者,因为体现出你对学习的热情和对公司的忠诚度以及你的上进心。这个要分析面试官的身份,如果是普通技术面试官,可以问问对方目前项目的规划,使用的技术情况,还有就是您在这边工作多久了,是否能分享一些您在这边的工作体会。如果是 HR 的话,可以问问公司的企业文化,工资评定是否跟绩效挂钩,公司是否定期组织员工活动、团建等等,如果是公司 CEO 或者是CTO 的话,可以问问团队的组成和公司前景之类的。或者告诉面试官关于公司的部分情况通过查看公司网站,还有面试基本上了解了,比较喜欢咱们公司这个平台和氛围,希望有机会能加入一起共事,如果您这边觉得我合适的话,最快什么时间能给我回复。","extend":"","source":"bh","star":2,"bank":2},{"id":330,"code":"HR-20","category":"人事面","question":"说说你对行业、技术发展趋势的看法","answer":"回答提示:企业对这个问题很感兴趣,只有有备而来的求职者能够过关。求职者可以直接在网上查找对你所申请的行业部⻔的信息,只有深入了解才能产生独特的⻅解。企业认为最聪明的求职者是对所面试的公司预先了解很多,包括公司各个部⻔,发展情况,在面试回答问题的时候可以提到所了解的情况,企业欢迎进入企业的人是“知己”,而不是“盲人”。","extend":"","source":"bh","star":2,"bank":2},{"id":334,"code":"HR-24","category":"人事面","question":"你为什么愿意到我们公司来工作?","answer":"回答提示:对于这个问题,你要格外小心,如果你已经对该单位作了研究,你可以回答一些详细的原因,像“公司本身的高技术开发环境很吸引我。”、“我同公司出生在同样的时代,我希望能够进入一家与我共同成⻓的公司。”、“你们公司一直都稳定发展,在近几年来在市场上很有竞争力。”、“我认为贵公司能够给我提供一个与众不同的发展道路。”这都显示出你已经做了一些调查,也说明你对自己的未来有了较为具体的远景规划。","extend":"","source":"bh","star":2,"bank":2},{"id":335,"code":"HR-25","category":"人事面","question":"你和别人发生过争执吗?你是怎样解决的?","answer":"回答提示:这是面试中最险恶的问题,其实是考官布下的一个陷阱,千万不要说任何人的过错,应知成功解决矛盾是一个协作团体中成员所必备的能力。假如你工作在一个服务行业,这个问题简直成了最重要的一个环节。你是否能获得这份工作,将取决于这个问题的回答。考官希望看到你是成熟且乐于奉献的。他们通过这个问题了解你的成熟度和处世能力。在没有外界干涉的情况下,通过妥协的方式来解决才是正确答案","extend":"","source":"bh","star":2,"bank":2},{"id":337,"code":"HR-27","category":"人事面","question":"对这项工作,你有哪些可预⻅的困难?","answer":"回答提示:1不宜直接说出具体的困难,否则可能令对方怀疑应聘者不行。2可以尝试迂回战术,说出应聘者对困难所持有的态度——工作中出现一些困难是正常的,也是难免的,但是只要有坚忍不拔的毅力、良好的合作精神以及事前周密而充分的准备,任何困难都是可以克服。分析:一般问这个问题,面试者的希望就比较大了,因为已经在谈工作细节,但常规思路中的回答,又被面试官“骗”了。当面试官询问这个问题的时候,有两个目的。第一,看看应聘者是不是在行,说出的困难是不是在这个职位中一般都不可避免的问题。第二,是想看一下应聘者解决困难的手法对不对,及公司能否提供这样的资源。而不是想了解应聘者对困难的态度。","extend":"","source":"bh","star":2,"bank":2},{"id":338,"code":"HR-28","category":"人事面","question":"与上级意⻅不一是,你将怎么办?","answer":"回答提示:1一般可以这样回答“我会给上级以必要的解释和提醒,在这种情况下,我会服从上级的意⻅。”2如果面试你的是总经理,而你所应聘的职位另有一位经理,且这位经理当时不在场,可以这样回答:“对于非原则性问题,我会服从上级的意⻅,对于涉及公司利益的重大问题,我希望能向更高层领导反映。分析:这个问题的标准答案是思路1,如果用2的回答,必死无疑。你没有摸清楚改公司的内部情况,先想打小报告,这样的人没有人敢要。","extend":"","source":"bh","star":2,"bank":2},{"id":340,"code":"HR-30","category":"人事面","question":"为什么我们要在众多的面试者中选择你?","answer":"回答提示:根据我对贵公司的了解,以及我在这份工作上所累积的专业、经验及人脉,相信正是贵公司所找寻的人才。而我在工作态度、EQ上,也有圆融、成熟的一面,和主管、同事都能合作愉快。分析:别过度吹嘘自己的能力,或信口开河地乱开支票,例如一定会为该公司带来多少钱的业务等,这样很容易给人一种爱说大话、不切实际的感觉。技术的符合度,经验,人脉,积极乐观,容易相处,擅⻓求同存异,以团队为主。","extend":"","source":"bh","star":2,"bank":2},{"id":342,"code":"HR-32","category":"人事面","question":"工作中学习到了些什么?","answer":"回答提示:这是针对转职者提出的问题,建议此时可以配合面试工作的特点作为主要依据来回答,如业务工作需要与人沟通,便可举出之前工作与人沟通的例子,经历了哪些困难,学习到哪些经验,把握这些要点做陈述,就可以轻易过关了。","extend":"","source":"bh","star":2,"bank":2},{"id":345,"code":"HR-35","category":"人事面","question":"面试注意事项:","answer":"1)在面试官面前千万不要抖脚,手脚不要动来动去,不能有小动作。\n\n2)在面试过程中,千万不要跟面试官去争论,说话太冲,太能说、抢话说、乱说都不好,遇到难题,先思考一下,切记心浮气燥,表达时口气温和,谦虚。\n\n3)如果面试过程中都不错,谈的也很好,之后却没有给 Offer,完全是自己意料之外的情况,这个很有可能,或许是因为公司有了其他的人选,不用介意,更不要沮丧。\n\n4)在面试过程中,切忌问关于公司计划、行业机密等相关的东⻄,不要打探公司的内幕,机密敏感性的问题不要问东问⻄。\n\n5)千万要注意仪容仪表,要有礼貌,最好不要有口吃,口头表达,逻辑思维很重要,不要让面试官觉得你很幼稚,太过小孩子气,显的不够稳重踏实。\n\n6)在去面试之前,要熟悉自己的简历,特别是工作经历,准备好关于一些离职原因、职业规划方面的问题的回答方式。在面试过程中,90%的面试官会让做自我介绍,所以提前要准备一下,说出的内容既要和简历相符,又要有重点有突出的地方,不能像背简历一样。\n\n7)面试完后,如果等待的时间较⻓,没有回应,就可能没有什么希望了,自己可以打电话去了解情况。\n\n8)在面试过程中,谈到薪资的时候,如果没有说明是税后工资就是税前,假如是税前6000,这里面就包括了公司给交的公积金,还有其他五险要交的费用,拿到手差不多4500左右。","extend":"","source":"bh","star":2,"bank":2},{"id":425,"code":"DB-58","category":"MySQL","question":"EXPLAIN中出现Using filesort或Using temporary如何优化？","answer":"**Using filesort（文件排序）：** ORDER BY字段无索引→MySQL需要额外排序操作。优化：给排序字段建联合索引；避免排序字段无索引或混合升降序；排序字段与查询字段建联合索引让排序走索引。\n\n**Using temporary（临时表）：** GROUP BY或多表JOIN无索引时MySQL创建临时表存储中间结果。优化：给分组字段建索引让GROUP BY走索引；先WHERE过滤再GROUP BY聚合；避免SELECT非分组字段触发额外临时表。\n\n**核心思路：** 让排序/分组都能利用索引有序性，避免额外排序和临时表开销。","extend":"**补充：** Using filesort=ORDER BY字段无索引需额外排序；Using temporary=GROUP BY或多表JOIN无索引建临时表。\n**优化：** 给排序/分组字段建联合索引走索引有序性；先WHERE过滤再GROUP BY；避免SELECT非分组字段。\n**面试追问：** filesort内部——双路排序(先排序再回表) vs 单路排序(一次取出参与排序列)；max_length_for_sort_data影响选择；ORDER BY与WHERE字段建联合索引更优。","source":"v2.4-reimport","star":4,"bank":2},{"id":441,"code":"PD-47","category":"Pandas","question":"apply的用法？axis参数的含义？","answer":"**Series.apply：** 函数接收每个元素\n- s.apply(lambda x: x * 5)\n\n**DataFrame.apply：**\n- 默认逐列处理：函数接收一整列，如df.apply(lambda x: x.sum())按列求和\n- axis=1：改为逐行处理\n\n**关键注意：** 如果函数要同时用到同一行的几个不同列（比如语文+数学），就必须axis=1按行处理，否则apply传给函数的是一整列，取不到另一列的数据\n- df.apply(lambda x: x[\"语文\"] + x[\"数学\"], axis=1)\n\n**lambda表达式是apply最常见的搭档**","extend":"**补充：** Series.apply函数接收每个元素；DataFrame.apply默认逐列处理(axis=0函数接收整列)；axis=1逐行处理(函数接收整行)。\n**代码：**\n```python\ns.apply(lambda x: x * 5)\ndf.apply(lambda x: x['语文'] + x['数学'], axis=1)  # 用同行多列必须axis=1\n```\n**易错：** 函数要同时用同一行的多个不同列必须axis=1，否则apply传进来的是整列数据取不到另一列。\n**面试追问：** applymap作用于每个单元格；能向量化运算就别用apply(性能差10-100倍)；groupby+apply可对每组应用复杂函数。","source":"v2.4-reimport","star":4,"bank":2},{"id":457,"code":"FS-15","category":"FastAPI","question":"响应模型response_model的作用？如何避免返回敏感字段？","answer":"**作用：** 定义接口对外返回的统一数据格式，Pydantic按模型自动过滤字段。\n\n**敏感字段防护示例：**\n```python\nclass UserResponse(BaseModel):\n    id: int\n    username: str\n    email: str\n    # 不含password字段\n@app.post(\"/users\", response_model=UserResponse)\ndef create_user(user: UserCreate):\n    return {...}  # 内部有password也不返回\n```\n**优势：**\n- 返回数据格式统一，前端对接稳定\n- 自动过滤敏感字段(如password)\n- 文档自动展示响应结构\n\n**最佳实践：** 请求模型与响应模型分离，各司其职。","extend":"**代码：** `@app.post(\"/users\", response_model=UserResponse)`。\n**易错：** 返回的dict里有password但UserResponse不含该字段→自动过滤不返回；响应模型不含的字段不会泄露。\n**追问：** 请求模型(入参)与响应模型(出参)分离是规范做法；Pydantic按response_model自动过滤+序列化。","source":"v2.4-reimport","star":4,"bank":2},{"id":458,"code":"FS-16","category":"FastAPI","question":"Query/Path/Body验证工具的用法及常用参数？","answer":"**三个验证工具：**\n| 工具 | 作用对象 | 常用参数 |\n|---|---|---|\n| Query | 查询参数 | ge, le, gt, lt, min_length, max_length |\n| Path | 路径参数 | ge, le, gt, lt |\n| Body | 请求体字段 | min_length, max_length, ge, le |\n\n**示例：**\n- page_size: int = Query(10, ge=5, le=20) 每页5~20条\n- item_id: int = Path(..., gt=0, lt=1000) 必填且0~1000\n- password: str = Body(..., min_length=6, max_length=20)\n\n**关键：** `...`表示必填；验证不通过自动返回422。","extend":"**代码：** Query(10, ge=5, le=20)、Path(..., gt=0, lt=1000)、Body(..., min_length=6)。\n**易错：** `...`(Ellipsis)表示必填参数；ge=大于等于、le=小于等于、gt=大于、lt=小于。\n**追问：** EmailStr邮箱类型验证需pydantic[email]；验证规则写在类型注解旁，Swagger文档自动展示。","source":"v2.4-reimport","star":4,"bank":2}],"3":[{"id":1,"code":"PY-1","category":"Python基础","question":"请描述Python语言的核心特点、优缺点及应用领域？","answer":"**核心特点：** 解释型（无需编译）、跨平台（Python解释器）、面向对象（一切皆对象）、动态类型、丰富生态。\n\n**优点：** 简洁易读、开发效率高、标准库+第三方库丰富、可扩展性强。\n**缺点：** 运行速度较慢、GIL限制多线程并行、动态类型易出错。\n\n**应用领域：** Web开发(Django/Flask)、网络爬虫(requests/Scrapy)、数据分析(NumPy/Pandas)、AI/ML(TensorFlow/PyTorch)、自动化运维、GUI开发。","extend":"**面试追问：** 解释型 vs 编译型——解释型逐行翻译执行、跨平台依赖解释器、无编译产物；编译型(C/Go)一次性编译为机器码、执行更快。\n**易错：** GIL只限制CPython的多线程并行，多进程不受影响；PyPy的JIT可显著提速但兼容C扩展稍差。\n**应用分层：** 数据分析(NumPy/Pandas)→机器学习(sklearn)→大模型应用(transformers/LangChain)，Python生态全链路覆盖。","source":"v2.4","star":4,"bank":3},{"id":2,"code":"PY-2","category":"Python基础","question":"请说明Python中变量的命名规则和基本数据类型？","answer":"**命名规则：** 只能含字母/数字/下划线，不能数字开头，不能用关键字，区分大小写。蛇形命名(snake_case)为Python推荐。\n\n**数据类型：** int、float(注意0.1+0.2≠0.3)、str(单/双/三引号)、bool(True/False首字母大写)、list(有序可变[])、tuple(有序不可变())、dict(键值对{}键不可变)、set(无序可变唯一{})、NoneType(x=None)。","extend":"**面试追问：** 为什么0.1+0.2≠0.3？——浮点二进制无法精确表示0.1，金额用Decimal或round()处理。\n**易错：** 元组里嵌套列表时，元组\"不可变\"但嵌套列表内容可改；frozenset()才是真正不可变集合。\n**补充：** Python3.10+支持联合类型`int | str`写法；type()和isinstance()区别——isinstance支持继承关系判断更推荐。","source":"v2.4","star":4,"bank":3},{"id":12,"code":"PY-12","category":"数据结构","question":"请详细解释 is 和 == 的本质区别及应用场景？","answer":"**== 值相等：** 比较内容是否相等，调用__eq__()。\n**is 身份：** 比较是否同一对象（内存地址，比较id()）。\n\n**场景：** ==判断值是否相等；is判断是否为None(`if x is None`唯一最佳实践)、同一缓存对象。\n**陷阱：** 不要用is比较字符串！小整数(-5~256)和短字符串有驻留机制is可能True但不能依赖。","extend":"**补充：** is比较id()，==调用__eq__；自定义类不重写__eq__时默认退化为is比较。\n**易错：** 1==True为True但1 is True为False(不同对象)；None判断必须用is None。\n**面试追问：** 驻留机制——小整数-5~256、空字符串、短字符串可能共享对象，但这是实现细节不可依赖。","source":"v2.4","star":4,"bank":3},{"id":17,"code":"PY-17","category":"数据结构","question":"请说明列表常用操作和遍历中增删的陷阱？","answer":"**增删改查：** append()末尾、insert(idx,item)、extend()合并；del/pop(idx)返回/remove(value)/clear()；sort()原地vs sorted()新列表。\n\n**⚠️遍历中增删→漏元素/重复/死循环。**\n- 安全：遍历lst.copy()副本修改原列表\n- 或用列表推导式\n**栈(LIFO)：** append+pop；**队列(FIFO)：** collections.deque，popleft()出队O(1)。","extend":"**遍历陷阱代码：** `for x in lst: lst.remove(x)`会跳过元素——用`for x in lst.copy():`或推导式`lst=[x for x in lst if 条件]`。\n**deque补充：** collections.deque的appendleft/popleft都是O(1)；list头部insert/pop是O(n)。\n**面试追问：** list.sort()原地稳定排序(key可传lambda)；sorted()返回新列表；两者都支持reverse=True。","source":"v2.4","star":4,"bank":3},{"id":19,"code":"PY-19","category":"函数与作用域","question":"请详细解释Python函数参数的传递机制和4种传递方式？","answer":"Python采用**对象引用传递**(Pass by Object Reference)，传递对象引用副本。不可变对象→像\"值传递\"；可变对象通过方法修改→影响外部；重新赋值→断开引用。\n\n**4种传参：** ①位置传参func(1,2)；②关键字func(a=1,b=2)⚠️必须在位置后；③默认def func(age=18)必须在位置后；④可变*args(元组)/`**`kwargs(字典)。顺序：位置→默认→*args→`**`kwargs。","extend":"**代码：** 传参顺序固定为位置→默认→*args→**kwargs；`def f(a, b=1, *args, **kw)`合法。\n**易错：** 关键字参数必须在位置参数之后；`*`之后的参数强制关键字传参`def f(a, *, b)`；默认参数在定义时求值一次。\n**面试追问：** 传可变对象进函数并原地修改会反映到外部(共享引用)；函数内重新赋值只是断开引用不影响外部；参数解包f(*lst, **d)。","source":"v2.4","star":4,"bank":3},{"id":22,"code":"PY-22","category":"函数与作用域","question":"请解释LEGB命名空间查找顺序和global/nonlocal？","answer":"**四大命名空间：** Local函数内→Enclosing嵌套外层→Global模块顶层→Built-in内置。查找L→E→G→B找到即停，否则NameError。\n\n**读写规则：** 只读→自动向上查；⚠️函数内任何位置有赋值→Python标记为局部→前面读报错UnboundLocalError。\n**修改上层：**\n- global a声明全局\n- nonlocal num声明嵌套外层(仅嵌套函数可用)","extend":"**易错：** 函数内任何位置出现赋值语句→该变量被标记为局部，前面读取报UnboundLocalError(即使外层有同名全局)；先print后赋值也报错。\n**补充：** globals()/locals()查看命名空间字典；函数参数算局部变量。\n**面试追问：** 嵌套函数改外层变量用nonlocal(仅嵌套函数可用)；改模块级变量用global；闭包自由变量查Enclosing层。","source":"v2.4","star":4,"bank":3},{"id":32,"code":"PY-32","category":"面向对象","question":"请解释类变量和实例变量的区别及在继承中的行为？","answer":"**类变量：**\n- 类体内方法外，所有实例共享\n- 通过类名.属性修改\n- 通过实例赋值→创建同名实例变量覆盖\n**实例变量：** self.变量名在方法内定义，每个实例独有。\n\n**继承：**\n- 类变量子类继承，定义同名覆盖父类(父类不受影响)\n- 实例变量不继承需自己定义或super().__init__()\n- @property定义的属性完全被子类继承","extend":"**易错：** `实例.类变量 = 值`会创建实例属性遮蔽类变量(类变量不受影响)；修改类变量必须`类名.类变量 = 值`。\n**补充：** 类变量可变(list/dict)时所有实例共享同一引用，任一实例修改影响全部——常见隐蔽bug；子类同名类变量覆盖父类不影响父类。\n**面试追问：** 实例变量需在__init__里定义或super().__init__()继承；@property定义的是类属性(描述符)完全被继承。","source":"v2.4","star":4,"bank":3},{"id":46,"code":"PY-35","category":"Python基础","question":"请说明模块和包的区别、__init__.py作用、4种导入方式和搜索顺序？","answer":"**模块：** 任何.py文件。\n**包：** 管理命名空间的目录含__init__.py(3.3+非必需但推荐)。\n\n**__init__.py作用：**\n- 标识为包\n- 包初始化\n- 定义__all__控制from package import *\n- 预导入子模块简化使用\n\n**4种导入：**\n- ①import模块(全导入需前缀)\n- ②import模块as别名\n- ③from模块import成员(指定导入)\n- ④from模块import*(全量不推荐)\n\n**搜索顺序(sys.path)：** 当前目录→PYTHONPATH→标准库→第三方库。sys.modules缓存避免重复加载。\n**__name__：**\n- 直接运行='__main__'，被导入='模块名'\n- __all__控制通配符导入范围\n- dir()查看对象属性方法","extend":"**补充：** __init__.py定义__all__控制from package import *；包内相对导入from . import module；命名空间包(3.3+无__init__.py)。\n**易错：** 循环导入——a导入b且b导入a，运行时AttributeError；解法：延迟导入(函数内)或重构公共部分。\n**面试追问：** sys.path顺序=脚本目录→PYTHONPATH→标准库→site-packages；sys.modules缓存避免重复加载；sys.path.append可加临时路径。","source":"v2.4","star":4,"bank":3},{"id":47,"code":"PY-36","category":"Python基础","question":"请说明try/except/else/finally的完整用法和执行流程？","answer":"**语法：** try→except 类型 as e→except (类型1,类型2)→except→else→finally。\n**执行：**\n- 无异常try→else→finally\n- 有异常被捕获try→except→finally\n- 有异常未捕获try→finally→向外传递\n**注意：**\n- except子类在前父类在后\n- finally始终执行(即使有return)\n- 编译期语法错误无法被try捕获","extend":"**代码：**\n```python\ntry:\n    risky()\nexcept (TypeError, ValueError) as e:\n    handle(e)\nelse:\n    print('无异常')\nfinally:\n    cleanup()\n```\n**易错：** except子类在前父类在后；finally里有return会覆盖try/except的return；else在try无异常时执行。\n**面试追问：** 捕获异常要精准，裸except会吞掉KeyboardInterrupt/SystemExit；raise from e保留异常链便于排查。","source":"v2.4","star":4,"bank":3},{"id":50,"code":"PY-39","category":"Python基础","question":"请说明文件的读写方法、指针操作和编码概念？","answer":"**读取：**\n- read(size)、readline()、readlines()\n- 文件对象可迭代for line in file:(推荐)\n**写入：** write(str)、writelines(list)。\n**指针：**\n- tell()获取位置\n- seek(offset,whence)移动(0头/1当前/2尾)\n- flush()强制刷盘\n**分类：** 纯文本(.txt/.py)vs二进制(.jpg/.exe)。编码：ASCII→GBK→UTF-8；数据二进制存储需encode/decode编解码。","extend":"**补充：** readline()/for line in f逐行读(推荐大文件)；read(size)限量；write/writelines写入；tell()获取指针位置。\n**易错：** 文本模式下tell()/seek()因编码可能不准，seek只支持0或末尾；二进制模式才能自由seek(0头/1当前/2尾)。\n**面试追问：** 编码本质——'中'.encode('utf-8')得3字节，decode还原；UTF-8中文3字节、GBK中文2字节；文件IO默认缓冲，flush()强制刷盘。","source":"v2.4","star":4,"bank":3},{"id":52,"code":"PY-41","category":"Python基础","question":"请说明Socket编程流程和HTTP协议结构？","answer":"**Socket TCP：** 服务端socket()→bind()→listen()→accept()(阻塞)→recv()/send()→close()；客户端socket()→connect()→send()/recv()→close()。\n\n**核心：** IP定位电脑；端口定位程序(0~65535，0~1023系统占用，开发用8080/8888)；网络传输二进制需encode/decode。127.0.0.1本地回环。\n\n**HTTP请求：** 请求行(方法GET/POST+URL+版本)+请求头(Content-Type等)+空行+请求体。\n**响应：** 状态行(状态码)+响应头+空行+响应体。状态码：2xx成功|3xx重定向301/302|4xx客户端400/401/403/404|5xx服务端500/502。","extend":"**代码：**\n```python\nimport socket\ns = socket.socket(); s.bind(('0.0.0.0', 8080)); s.listen(5)\nconn, addr = s.accept()   # 阻塞等待连接\n```\n**易错：** send/recv需循环收发完整数据(TCP字节流)；端口0~65535，0~1023系统占用；先启服务端再连客户端。\n**面试追问：** HTTP无状态——Cookie/Session补状态；状态码2xx成功/3xx重定向/4xx客户端(404未找到)/5xx服务端(500)；HTTPS=HTTP+TLS。","source":"v2.4","star":4,"bank":3},{"id":55,"code":"PYH-14","category":"综合进阶","question":"请说明并发与并行的区别及进程池大小如何设置？","answer":"**并发(Concurrency)：**\n- 单CPU交替处理多任务\"看起来同时\"\n- 同一时刻只做一件事切换极快\n- Python多线程实现\n**并行(Parallelism)：**\n- 多CPU同时执行多任务\n- 须多核\n- Python多进程实现\n\n**进程池大小：**\n- CPU密集型→CPU核心数(避免频繁切换降效)\n- I/O密集型→不适合多进程，改用多线程/协程","extend":"**补充：** 并发=单核交替执行(逻辑同时)，并行=多核同时执行(物理同时)；Python线程是并发(受GIL)，进程是并行。\n**易错：** 进程池不是越大越好——上下文切换+内存翻倍；I/O密集用线程/协程而非进程。\n**面试追问：** 池大小经验——CPU密集=os.cpu_count()；混合=核数×(1+等待时间/计算时间)；过大反而性能下降。","source":"v2.4","star":4,"bank":3},{"id":58,"code":"PYH-17","category":"综合进阶","question":"请说明网络通信三要素和完整Socket编程流程？","answer":"**三要素：** IP定位电脑、端口定位程序、协议通信规则。\n\n**Socket TCP流程：** 服务端socket()→bind()→listen()→accept()(阻塞)→recv()/send()→close()；客户端socket()→connect()→send()/recv()→close()。\n\n**注意：**\n- 二进制需encode/decode\n- 先运行服务端再客户端\n- 127.0.0.1本地回环\n- 开发常用8080/8888等高位端口。TCP可靠有序→文件/HTTP\n- UDP快速→直播/游戏","extend":"**补充：** IP定位主机、端口定位进程、协议约定通信规则；127.0.0.1回环本机、0.0.0.0监听所有网卡。\n**易错：** accept()阻塞等待；先启服务端再启客户端；socket收发基于字节流需encode/decode。\n**面试追问：** 高并发服务端——每连接一线程、select/epoll事件驱动、asyncio协程；生产用框架(uWSGI/nginx/gunicorn)而非裸socket。","source":"v2.4","star":4,"bank":3},{"id":60,"code":"DB-1","category":"MySQL","question":"什么是数据库？关系型和非关系型数据库的区别？主流数据库对比？","answer":"**数据库：** 按一定数据结构长期存储、可统一管理、供多用户共享的结构化数据集合。\n\n**关系型：** 固定表格结构、支持事务(ACID)、支持JOIN关联查询、使用SQL。代表：MySQL/Oracle/SQL Server。\n**非关系型：** 无固定结构灵活；大多基于内存或舍弃复杂事务→读写性能好。代表：MongoDB(文档型)/Redis(内存型)。\n\n**主流对比：**\n- MySQL开源免费全球使用率第一→互联网/中小企业\n- Oracle商业收费性能极强→银行/电信\n- Redis内存数据库→缓存热点数据\n- MongoDB文档型→灵活数据结构","extend":"**补充：** 关系型——固定表格结构、ACID事务、JOIN关联、SQL标准；非关系型——灵活无模式、水平扩展强、读写快。\n**选型：** 业务强一致+复杂查询→MySQL；缓存热点→Redis；文档结构多变→MongoDB；全文检索→Elasticsearch。\n**面试追问：** 大模型应用中向量数据库(Faiss/Milvus/pgvector)存Embedding做相似度检索，属于专用非关系型数据库。","source":"v2.4","star":4,"bank":3},{"id":66,"code":"DB-7","category":"MySQL","question":"MySQL有哪6个核心约束？各自的作用？","answer":"①**PRIMARY KEY(主键)：** 唯一标识一行，不能重复不能为空，一张表必须有一个。②**NOT NULL(非空)：** 字段必填不能留空。③**UNIQUE(唯一)：** 字段值在整个表不能重复。④**DEFAULT(默认值)：** 未填写使用默认值。⑤**AUTO_INCREMENT(自增)：** 每添加一行自动+1。⑥**FOREIGN KEY(外键)：** 两表关联保证一致性。几乎不用，用逻辑关联代替。\n\n**常用模板：** id BIGINT PRIMARY KEY + status TINYINT NOT NULL DEFAULT 1 + create_time DATETIME DEFAULT CURRENT_TIMESTAMP + update_time ON UPDATE CURRENT_TIMESTAMP。","extend":"**补充：** 约束保证数据完整性；主键=非空+唯一+聚簇索引；物理外键影响性能，生产多用逻辑关联(应用层维护)。\n**易错：** UNIQUE可多个且允许多个NULL(不冲突)；AUTO_INCREMENT只能一个且必须索引列；CHECK约束MySQL8.0.16+才真正生效。\n**面试追问：** 建表黄金模板——id BIGINT PRIMARY KEY+status TINYINT DEFAULT 1+create_time/update_time；复合主键 vs 单列主键+唯一索引的取舍。","source":"v2.4","star":4,"bank":3},{"id":70,"code":"DB-11","category":"MySQL","question":"请说明GROUP BY、HAVING vs WHERE和ORDER BY/LIMIT？","answer":"**GROUP BY：**\n- 按指定字段分组配合聚合函数统计\n- NULL归同一组\n- 可多字段分组\n\n**严格模式(5.7+默认)：** SELECT只能出现分组字段和聚合函数包裹字段。\n**宽松模式：** 可任意字段。关闭：SET sql_mode=去掉ONLY_FULL_GROUP_BY。\n\n**WHERE vs HAVING：**\n- WHERE分组前过滤原始行(不能用聚合)\n- HAVING分组后过滤结果(必须配合GROUP BY，可用聚合)\n**执行顺序：** FROM→WHERE→GROUP BY→HAVING→SELECT→ORDER BY→LIMIT。\n**ORDER BY：** ASC升序(默认)/DESC降序。\n**LIMIT：**\n- LIMIT n前n行\n- LIMIT offset,n跳过offset取n行","extend":"**补充：** 执行顺序FROM→WHERE→GROUP BY→HAVING→SELECT→ORDER BY→LIMIT；WHERE先过滤可大幅减少分组数据量。\n**易错：** 严格模式(5.7+默认ONLY_FULL_GROUP_BY)下SELECT只能出现分组字段和聚合函数包裹字段；HAVING必须配合GROUP BY且可用聚合。\n**面试追问：** LIMIT深分页慢——游标分页(id>xxx LIMIT n)或延迟关联；ORDER BY多字段按优先级排序；NULL在排序中默认排最前(ASC)。","source":"v2.4","star":4,"bank":3},{"id":92,"code":"DB-33","category":"MySQL","question":"LIMIT大分页查询为什么越往后越慢？如何优化？","answer":"**问题：** `SELECT * FROM user LIMIT 1000000,10` 需要扫描前1000010行再丢弃前1000000行→offset越大越慢。\n\n**优化方案：**\n1. **主键游标分页（推荐）：** `SELECT * FROM user WHERE id>1000000 LIMIT 10` 直接定位起点跳过扫描。前提：主键有序递增+无删除断档。\n2. **延迟关联：** 先分页查主键→再JOIN回原表取完整数据。`SELECT * FROM user a INNER JOIN (SELECT id FROM user LIMIT 1000000,10) b ON a.id=b.id`\n3. **业务层避免深度分页：** 前端改用游标/滚动加载，不暴露大页码。","extend":"**补充：** 深分页慢=offset越大扫描并丢弃的行越多；主键游标分页WHERE id>last_id LIMIT n适合主键有序无断档场景。\n**易错：** 延迟关联——先子查询LIMIT出主键再JOIN回原表取全字段；业务层用游标/滚动加载避免暴露大页码。\n**面试追问：** 产品层面搜索/Feed用\"下一页游标\"而非页码跳转；千万级数据才需要深度优化，小表直接LIMIT即可。","source":"v2.4","star":3,"bank":3},{"id":100,"code":"PD-1","category":"Pandas","question":"什么是NumPy？它相比Python原生列表有哪些优势？","answer":"**定义：** 数值化Python，是Python中专门用于高性能数值运算的第三方开源库，核心是ndarray多维数组对象。\n\n**相比列表的优势：**\n- 向量化运算：把所有数据当成整体来算，可同时计算多个元素\n- 类型统一：数组数据类型必须统一，不用每次检查元素类型\n- 连续内存存储：大幅减少寻址时间\n\n**结论：** NumPy底层用C语言实现，计算速度比Python原生列表快几十到几百倍，数据量越大优势越明显。","extend":"**补充：** ndarray是同质容器——所有元素同一dtype，连续内存+C语言实现带来向量化性能优势。\n**易错：** NumPy数组切片默认返回视图，修改影响原数组(与Python列表行为不同)；数据量越大numpy优势越明显。\n**面试追问：** 性能验证——arr**2 vs 列表推导式计算1亿元素；矩阵运算底层走BLAS/LAPACK高度优化；大模型推理的矩阵乘法同样依赖这类加速。","source":"v2.4","star":4,"bank":3},{"id":120,"code":"PD-21","category":"Pandas","question":"什么是NumPy广播？广播的规则是什么？","answer":"**广播：** 自动把两个不同形状的数组扩充成相同的形状，再逐个元素进行运算\n\n**规则（满足任意一个即可广播）：**\n- 对应维度长度相等\n- 其中一个维度的长度等于1（长度为1的维度会自动复制匹配对方）\n\n**示例：**\n- arr + 5：标量5自动复制成[5,5,5,5,5,5]\n- (2,2)数组 + (2,)数组：按行广播，arr自动复制成2行2列\n- (2,2)数组 + (2,1)数组：按列广播，列向量横向复制2列","extend":"**补充：** 广播规则——维度从右往左对齐，要么相等要么一方为1，长度为1的维度自动复制扩展。\n**代码：**\n```python\narr + 5          # 标量广播到全数组\n(2,2) + (2,)     # 行广播\n(2,2) + (2,1)    # 列广播\n```\n**易错：** 形状不兼容(如(3,)与(2,))报错ValueError；广播是逻辑扩展不实际复制内存。\n**面试追问：** 标准化(x-mean)/std就是广播应用；归一化、图像减均值都是广播的典型使用。","source":"v2.4","star":4,"bank":3},{"id":124,"code":"PD-25","category":"Pandas","question":"什么是Pandas？它主要解决什么问题？","answer":"**定义：** 开源的数据分析库，以\"表\"为中心设计了一整套工具，把筛选、排序、统计、分组、合并等高频操作封装成简单的方法，几行代码就能完成，常被比作\"Python世界的Excel\"。\n\n**解决的问题：** 用Python自带的列表、字典处理表格数据（如学生成绩表）非常麻烦，Pandas专门为这种\"一张表\"的数据而生。\n\n**核心对象：** Series（一维数据）、DataFrame（二维表格）。日常工作中80%的表格型数据处理用到的就是这些方法。","extend":"**补充：** 以'表'为中心的数据分析库，核心是Series(一维)+DataFrame(二维)，底层基于NumPy；常称'Python世界的Excel'。\n**易错：** 读入数据后先摸底——df.info()看类型与非空、df.describe()看统计、df.head()看样本。\n**面试追问：** 大模型应用里Pandas做数据清洗/预处理，与sklearn训练管线配合；数据量大时可转NumPy数组或PyArrow加速。","source":"v2.4","star":4,"bank":3},{"id":142,"code":"PD-43","category":"Pandas","question":"如何处理缺失值？删除和填充分别怎么用？","answer":"**删除：dropna**\n- dropna()：默认删除\"含有任何缺失值\"的行\n- dropna(axis=1)：改为按列删\n- 注意：删除会让数据变少\n\n**填充：fillna**\n- fillna(0)：填固定值\n- fillna({\"temp_max\":99, \"temp_min\":-99})：字典按列填不同值\n- fillna(df[num].mean())：填统计值（如各列均值）\n\n**时间序列专用：**\n- ffill() / bfill()：用相邻行来填（前向/后向填充）\n- interpolate()：线性插值\n\n**口诀：** 想填什么值就放什么——填数字、填字典、填统计结果都行","extend":"**代码：**\n```python\ndf.dropna()                    # 删含缺失的行\ndf.dropna(axis=1)              # 按列删\ndf.fillna(0)\ndf.fillna(df[num].mean())      # 均值填充\ndf.ffill(); df.bfill(); df.interpolate()  # 时序相邻/线性插值\n```\n**易错：** dropna默认any(含任一缺失即删)，how='all'才全缺失才删；fillna可传字典按列填不同值。\n**面试追问：** 填充策略——数值列用均值/中位数、类别列用众数、时间序列用前向填充；机器学习里也可单独标记'缺失'特征。","source":"v2.4","star":4,"bank":3},{"id":144,"code":"PD-45","category":"Pandas","question":"groupby分组聚合怎么用？agg的用途？","answer":"**二段式操作：** 先按某个字段把数据分成若干组，再对每组应用统计函数。\n\n**基本用法：**\n- df.groupby(\"部门\")[\"薪资\"].mean()：各部门平均薪资\n\n**agg：更灵活的聚合**\n- df.groupby(\"部门\")[\"薪资\"].agg([\"min\",\"median\",\"max\"])：一次算多个统计量\n- df.groupby(\"部门\").agg({\"岗位\":\"nunique\", \"薪资\":\"mean\"})：不同列用不同聚合方式\n\n**多字段分组：**\n- df.groupby([\"部门\",\"岗位\"])[\"薪资\"].mean()：行索引变成复合索引\n- as_index=False：让分组字段保留为普通列，不变成索引","extend":"**补充：** 二段式操作——先按字段分组，再对每组应用统计函数；agg一次算多个统计量或不同列不同聚合。\n**代码：**\n```python\ndf.groupby('部门')['薪资'].mean()\ndf.groupby('部门')['薪资'].agg(['min','median','max'])\ndf.groupby('部门').agg({'岗位':'nunique', '薪资':'mean'})\ndf.groupby(['部门','岗位'])['薪资'].mean()  # 复合索引\n```\n**易错：** groupby默认把分组字段变成索引(as_index=False保留为普通列)；多字段分组得到复合索引。\n**面试追问：** groupby+transform保留原行数(组内标准化/填充组均值)；unstack把分组索引转为列；pd.cut/qcut分箱。","source":"v2.4","star":4,"bank":3},{"id":149,"code":"LNX-1","category":"Linux","question":"Linux是什么？它有哪些主要特点？","answer":"**定义：** Linux是一个开源、免费的操作系统内核，最初由Linus Torvalds于1991年创建。Ubuntu是基于Linux内核的发行版，由Canonical公司维护，以易用性和稳定性著称。\n\n**主要特点：**\n- 开源免费，社区活跃\n- 性能与资源占用：Linux比Windows轻量太多\n- 稳定性强，可长时间运行\n- 广泛用于服务器、嵌入式系统、云计算和大数据领域\n\n**与Windows对比：**\n- 命令行：Linux以Shell为核心非常强大；Windows较弱\n- 软件管理：Linux用APT/YUM包管理器；Windows用安装包/应用商店\n- 文件系统：Linux用ext4/XFS/btrfs；Windows用NTFS/FAT32\n- 安全性：Linux权限严格、病毒少；Windows易受攻击","extend":"**补充：** Linux是内核，Ubuntu/CentOS是发行版；特点=开源免费、稳定轻量、权限严格、Shell强大。\n**易错：** 区分'内核'与'发行版'；服务器版无GUI，全部命令行操作。\n**面试追问：** 大模型服务器几乎全用Linux(Ubuntu/CentOS)——训练、推理、部署都在Linux上；vim、systemctl、apt/yum、日志排查是基本功。","source":"v2.4","star":4,"bank":3},{"id":150,"code":"LNX-2","category":"Linux","question":"如何理解Linux的\"一切皆文件\"？树形目录结构中主要目录的作用？","answer":"**一切皆文件：** 普通文件、目录、设备、套接字等都以文件形式存在；不通过扩展名识别文件类型（但习惯上仍可加扩展名便于识别）；文件权限严格，使用10位字符表示。\n\n**主要目录：**\n- /bin：最常用的命令可执行文件（本质是/usr/bin的软链接）\n- /etc：所有系统管理所需的环境配置文件和子目录\n- /home：普通用户的主目录，每个用户一个子目录\n- /root：系统管理员（超级权限者）的主目录\n- /usr：用户应用程序和文件存放目录，类似Windows的Program Files\n- /var：存放经常被修改的目录，包括各种日志文件\n- /tmp：临时文件存放目录，系统会定期清理\n- /proc：系统中运行的进程的虚拟映射目录，可获取系统信息\n- /dev：设备管理器，所有硬件以文件形式存储\n- /opt：安装可选或第三方应用程序（如MySQL），默认空\n- /mnt：用户临时挂载文件系统（如U盘、移动硬盘），默认空","extend":"**补充：** /bin软链到/usr/bin、/etc配置文件、/home普通用户、/var日志、/proc进程虚拟、/dev设备、/opt第三方应用。\n**易错：** 文件类型不靠扩展名识别——10位权限首字符决定(-文件/d目录/l链接)；/tmp会被定期清理。\n**面试追问：** /proc/cpuinfo和/proc/meminfo查看CPU/内存；/var/log/syslog系统日志——排查故障第一步看日志。","source":"v2.4","star":4,"bank":3},{"id":151,"code":"LNX-3","category":"Linux","question":"如何远程登录Linux服务器？SSH默认端口是多少？","answer":"**为什么需要远程登录：** 服务器通常不允许除运维人员之外的员工直接接触，需要通过远程登录方式操作。\n\n**主流工具：**\n- Xshell：功能强大，支持SSH/SFTP\n- SSH Secure Shell\n- SecureCRT\n\n**连接步骤：**\n1. 打开Xshell，点击\"新建会话\"\n2. 主机：Ubuntu的IP地址\n3. 端口号：22（SSH默认端口）\n4. 用户名：Ubuntu的用户名\n5. 点击\"连接\"，输入密码即可登录","extend":"**补充：** SSH默认端口22；工具Xshell/SecureCRT；ssh root@ip连接；生产服务器禁止密码直接暴露。\n**易错：** 22端口常被暴力扫描——生产改端口+密钥登录+禁root密码登录；防火墙放行对应端口。\n**面试追问：** 免密登录——ssh-keygen生成密钥对、公钥放服务器~/.ssh/authorized_keys；scp/rsync远程传文件。","source":"v2.4","star":4,"bank":3},{"id":154,"code":"LNX-6","category":"Linux","question":"常用的文件与目录命令有哪些？各自的常用参数？","answer":"**pwd：** 显示当前所在目录（print work directory）\n**ls：** 列出目录内容——-a显示全部文件含隐藏文件，-l长格式列出（含属性与权限），-R递归列出；Ubuntu中ll是ls -al的别名\n**cd：** 切换目录——cd ~或cd回自己的家目录，cd -回到上一次所在目录，cd ..回到上一级\n**mkdir：** 创建目录——-p创建多层目录（如mkdir -p project/a/b）\n**touch：** 创建空文件（可一次创建多个：touch a.txt b.txt）\n**cp：** 复制——cp source dest复制文件，-r递归复制整个文件夹\n**rm：** 删除——-r递归删除目录及其中所有内容，-f强制删除不提示，-v显示详细过程\n**mv：** 移动/重命名——mv old new重命名，mv 文件 目录/移动文件","extend":"**补充：** pwd/ls(-a含隐藏、-l长格式、-R递归)/cd(~家目录、-上次目录、..上级)/mkdir(-p多层)/touch/cp(-r递归)/rm(-rf危险)/mv。\n**易错：** rm -rf /是灾难命令绝不执行；cp复制目录必须-r；ll是ls -al的别名。\n**面试追问：** ls -lh人性化大小显示；find+rm批量清理；ln -s创建软链接(快捷方式)；tab补全命令。","source":"v2.4","star":4,"bank":3},{"id":161,"code":"LNX-13","category":"Linux","question":"文件权限的10位字符如何解读？","answer":"**格式：** 10个字符表示文件属性，如 -rwxrw-r--\n\n**第0位：文件类型**\n- -代表普通文件、d代表目录、l代表链接文件\n\n**第1-3位：属主u（文件所有者）的权限**\n**第4-6位：属组g（所有者的同组用户）的权限**\n**第7-9位：其他用户o的权限**\n\n**权限字符：**\n- r（可读）：对文件可读取查看；对目录可ls查看目录内容\n- w（可写）：对文件可修改（但不代表可删除）；对目录可创建+删除+重命名\n- x（可执行）：对文件可被系统执行；对目录可进入该目录\n\n**删除文件的前提：** 对该文件所在的目录有写权限，才能删除该文件","extend":"**补充：** 10位=类型1位+属主u 3位+属组g 3位+其他o 3位；r可读/w可写/x可执行；对目录x=可进入。\n**易错：** 删除文件看所在目录的写权限(与文件本身权限无关)；目录w=可增删改文件名；目录r=可ls。\n**面试追问：** -rwxrw-r--=普通文件、属主全权、属组读写、其他只读；umask决定新建文件默认权限。","source":"v2.4","star":4,"bank":3},{"id":165,"code":"LNX-17","category":"Linux","question":"管道符和grep的用法？","answer":"**管道符 |：** 将前一个命令的处理结果输出传递给后面的命令处理。\n- 例：find ./ -size \"+200c\" | grep b（先查找大文件，再过滤含b的结果）\n\n**grep（Global Regular Expression Print）：** 根据正则表达式搜索匹配并输出到终端。\n\n**基本语法：** grep 选项 查找内容 源文件\n\n**常用选项：**\n- -n：显示匹配行及行号\n\n**示例：**\n- ll | grep -n demo：列出内容中搜索demo并显示行号\n- cat /etc/passwd | grep study01：在文件中搜索study01用户","extend":"**补充：** 管道|把前命令输出传给后命令；grep按正则匹配行输出(-n行号、-i忽略大小写)。\n**代码：**\n```bash\nfind ./ -size +200c | grep b\nll | grep -n demo\nps aux | grep python\n```\n**易错：** 管道传输的是stdout文本流；grep -v反向过滤；多个命令可连续管道。\n**面试追问：** grep -r递归搜索目录；grep -c计数；awk按列处理、sed流式替换是进阶文本三剑客。","source":"v2.4","star":4,"bank":3},{"id":170,"code":"LNX-22","category":"Linux","question":"如何查看端口占用和进程网络信息？","answer":"**netstat常用：**\n- netstat -anp | grep 进程号：查看该进程的网络信息\n- netstat -nlp | grep 端口号：查看网络端口号占用情况\n\n**选项含义：**\n- -n：拒绝显示别名，以数字显示（如22会显示ssh）\n- -l：仅列出listen（监听）的服务状态\n- -p：显示哪个进程在调用\n\n**其他网络命令：**\n- ifconfig：显示所有网络接口的配置信息（需安装net-tools）\n- ping 目的主机：测试当前服务器是否可以连接目的主机\n- hostname：查看当前服务器的主机名称（修改主机名需编辑/etc/hostname文件）","extend":"**代码：**\n```bash\nnetstat -anp | grep 进程号\nnetstat -nlp | grep 3306    # 查端口占用\nifconfig                    # 网络接口\nping 目标; hostname\n```\n**易错：** -n数字显示、-l仅监听、-p显示进程；netstat需安装net-tools包。\n**面试追问：** ss命令是netstat替代品(更快)；lsof -i:8080查端口占用；修改主机名用hostnamectl或编辑/etc/hostname。","source":"v2.4","star":3,"bank":3},{"id":173,"code":"PY-43","category":"Python基础","question":"正则表达式如何提取手机号和邮箱？","answer":"**提取手机号：** re.findall(r'\\d{3}-\\d{4}-\\d{4}', text)\n- \\d{3}：3个数字，匹配138-0000-9999这种格式\n\n**提取邮箱：** re.findall(r'[a-zA-Z0-9_]+@[a-zA-Z0-9_]+.[a-zA-Z0-9]+', text)\n- \\w+：一串字母数字（\\w等价于[a-zA-Z0-9_]）\n- \\.：转义表示真正的句点\n\n**去除非中文：** re.sub(r'[^\\u4e00-\\u9fa5]', '', text)\n- \\u4e00-\\u9fa5：汉字的Unicode范围\n- 前面加^取反：只要不是中文就替换成空\n\n**示例：** \"电话138-0000-9999，邮箱test@example.com\" → 手机号['138-0000-9999']、邮箱['test@example.com']","extend":"**代码：**\n```python\nre.findall(r'\\d{3}-\\d{4}-\\d{4}', text)      # 手机号\nre.findall(r'[a-zA-Z0-9_]+@[a-zA-Z0-9_]+\\.com', text)  # 邮箱\nre.sub(r'[^\\u4e00-\\u9fa5]', '', text)        # 只留中文\n```\n**易错：** 句点.要转义\\.才是字面点；^在[^...]内表示取反；\\u4e00-\\u9fa5是汉字Unicode范围。\n**面试追问：** 数据清洗实战——提取价格re.findall(r'\\d+\\.\\d{2}')；去HTML标签re.sub(r'<[^>]+>', '')。","source":"v2.4","star":4,"bank":3},{"id":174,"code":"PY-44","category":"Python基础","question":"re.sub和re.findall的区别？","answer":"**re.sub（替换）：** 把匹配的内容替换成指定字符串，像Word里的查找替换\n- re.sub(规则, 替换成什么, 原文)\n- 例：re.sub(r'\\d{3}-\\d{4}-\\d{4}', '[电话]', text) 把电话号码替换成[电话]\n\n**re.findall（提取）：** 找出所有匹配的内容并返回列表，像筛子一样把想要的信息筛出来\n- re.findall(规则, 原文)\n- 例：re.findall(r'\\d{3}-\\d{4}-\\d{4}', text) 返回['138-0000-9999']\n\n**记忆：** sub = substitute（替换），findall = find all（全部找到）","extend":"**补充：** re.sub替换(像Word查找替换)、re.findall提取(像筛子返回全部匹配列表)；sub替换串可用\\1引用分组。\n**代码：**\n```python\nre.sub(r'(\\d{3})-\\d{4}', r'\\1-****', text)   # 脱敏\n```\n**易错：** sub的替换字符串里反斜杠是分组引用；findall带分组时只返回分组捕获的内容。\n**面试追问：** re.search找第一个匹配、re.match只从开头匹配、re.finditer返回迭代器；re.split按正则切分。","source":"v2.4","star":4,"bank":3},{"id":180,"code":"ML-1","category":"机器学习","question":"人工智能（AI）、机器学习（ML）、深度学习（DL）三者的关系？","answer":"**层层包含的关系：** AI是最大圈，ML是AI的一个分支，DL是ML的进阶分支。\n\n**人工智能（AI）：** 最广的概念，目标是让机器像人一样思考、说话、看东西。生活例子：ChatGPT、智能客服、人脸识别、语音转文字、短视频推荐。\n\n**机器学习（ML）：** AI最核心的分支。核心逻辑：不给机器写死规则，喂海量数据，让机器自动从数据里找规律、学模式，然后做预测、做判断。\n\n**深度学习（DL）：** 机器学习的进阶分支，模拟人脑多层神经元结构，搭建多层网络，自动深层提取数据特征，处理图像、语音等复杂问题。类比：普通机器学习像小学生学简单表面规律，深度学习像博士生挖掘更深层的复杂逻辑。\n\n**一句话：** AI是大目标（让机器像人），ML是实现AI的方法（让机器自己学），DL是ML的高级版本（让机器更聪明地学）。现在所有大模型（GPT等）底层全部依靠深度学习支撑。","extend":"**补充：** 关系图——AI⊃ML⊃DL层层包含；ML核心=喂数据让机器自动学规律；DL=多层神经网络自动提取深层特征。\n**易错：** 深度学习是机器学习的子集而非并列关系；传统ML依赖人工特征工程，DL自动学特征。\n**面试追问：** 大模型(GPT等)属于DL中的Transformer架构+大规模预训练；面试常让画三者包含关系并各举一例。","source":"v2.4","star":3,"bank":3},{"id":185,"code":"ML-6","category":"机器学习","question":"什么是样本、特征、标签？什么是特征向量？","answer":"**样本（Sample）：** 用来让机器学习的单条数据——表中的每一行（一个人）\n**特征（Feature）：** 样本的属性，学习的依据——年龄、身高、每周听歌时长（注意：姓名通常不作为特征）\n**标签（Label）：** 样本的结果，告诉机器学得对不对——最后一列\"是否喜欢音乐\"\n\n**特征向量：** 把一个样本的所有特征按顺序排在一起，就是该样本的特征向量（如[16, 170, 2]）。\n\n**机器学习=** 用训练集（例题）训练出一个模型（规律），然后用这个模型去预测测试集（新题）的标签。","extend":"**补充：** 样本=表中的一行(一个人)、特征=属性(年龄/身高/听歌时长)、标签=结果(是否喜欢音乐)；特征向量=[特征1,特征2,...]按序排列。\n**易错：** 姓名/ID这类唯一标识通常不作为特征；特征必须能数值化或编码。\n**面试追问：** 特征工程=让特征更有效(归一化/独热编码/构造组合特征)；训练集学规律→测试集验证泛化。","source":"v2.4","star":3,"bank":3},{"id":186,"code":"ML-7","category":"机器学习","question":"训练集和测试集的作用？为什么测试集不能参与训练？","answer":"**训练集（70%）：** 用来教机器学习的样本集合，模型主要依靠这部分数据学习规律——类比课后练习题\n**测试集（30%）：** 用来检验模型效果的样本集合，全程不参与训练，最终评估模型真实能力——类比正式期末考试\n\n**重要规则：** 拿到原始数据后，不能全部用来训练模型。就像学生备考要分练习题、模拟考、正式考试，三者分工完全不同。\n\n**为什么不能混用：** 如果测试集参与训练，模型相当于\"提前看过考试答案\"，评估结果会虚高，无法反映模型在真实新数据上的表现。","extend":"**补充：** 训练集(约70%)负责学规律、测试集(约30%)负责考试；测试集全程不参与训练，否则评估结果虚高。\n**易错：** 常见错误——用测试集反复调参/选特征，等于提前看答案；正确做法再切一份验证集(训练/验证/测试三份)。\n**面试追问：** 70/30只是好记的起点而非硬性规则——数据量少时可加大训练占比(如80/20)，数据量大时可适当降低训练占比；train_test_split默认随机划分，分类任务加stratify分层，时间序列不能随机打乱(按时间先后切)。","source":"v2.4","star":4,"bank":3},{"id":224,"code":"ML-45","category":"机器学习-逻辑回归","question":"什么是混淆矩阵？TP/TN/FP/FN 分别是什么？","answer":"**定义：** 分类评估的基础，2×2 表格（二分类），统计预测对错情况，能区分漏报和误报（准确率无法区分这两种错误）。\n\n| 真实\\预测 | 预测0 | 预测1 |\n|---|---|---|\n| 真实0 | TN 真阴性 ✓ | FP 假阳性 ✗误报 |\n| 真实1 | FN 假阴性 ✗漏报❗最严重 | TP 真阳性 ✓ |\n\n**举例（下雨）：** TP=预报下雨且真下雨；TN=预报不下雨且真不下雨；FP=预报下雨但没下（误报）；FN=预报不下雨但下了（漏报，最严重）。\n**API：** confusion_matrix(y_test, y_pred)","extend":"**补充：** 混淆矩阵2×2——TP真阳性/FP假阳性(误报)/FN假阴性(漏报)/TN真阴性；能区分误报与漏报，准确率做不到。\n**易错：** FN漏报在多数业务中最严重(如漏诊、漏报下雨)；API用confusion_matrix(y_test, y_pred)。\n**面试追问：** classification_report一次性输出精确率/召回率/F1/支持数；多分类矩阵更大但思想相同。","source":"v2.4","star":3,"bank":3},{"id":225,"code":"ML-46","category":"机器学习-逻辑回归","question":"精确率（Precision）是什么？","answer":"**公式：** Precision = TP / (TP + FP)\n**含义：** 预测为阳性（1）的样本中，真正是阳性的比例——“预报下雨的日子里，真的下雨的有多少”\n**侧重：** 不误报（减少 FP）\n**例子：** TP=45, FP=5 → 精确率 = 45/50 = 0.9，预报下雨的 50 天中有 45 天真下雨。","extend":"**补充：** Precision=TP/(TP+FP)——预测为1的样本中真正为1的比例，侧重不误报(减少FP)。\n**易错：** 精确率的分母是'预测为1'的数量；高精确率=误报少。\n**面试追问：** 垃圾邮件场景优先精确率——把正常邮件误删(FP)代价高；python用precision_score(y_test, y_pred)。","source":"v2.4","star":3,"bank":3},{"id":239,"code":"DL-11","category":"深度学习","question":"什么是词嵌入？为什么要用稠密向量而不是One-hot？","answer":"**词嵌入：** 给每个字/词配一组小数向量，意思相近的词在数字空间里靠在一起(如'爸'与'哥'距离近)。向量是模型自己从数据中学出来的。\n\n**One-hot问题：** 5000个字要5000维且只有1位是1(稀疏)；无法表达词义相似度('苹果'和'香蕉'毫无关联)；维度灾难。\n\n**稠密向量：** 每个位置都有小数(如128/256维)，能表达语义。\n\n**维度：** 新闻文本128~256；大规模英文300~512(Word2Vec经典300维)。","extend":"**面试追问：** nn.Embedding(vocab_size, embed_dim)把词编号映射为稠密向量(查表操作)；词向量是训练学出的隐性表征。\n**为什么电脑难理解文字：** 自然语言是'软语言'(同一意思无数表达、新词永远在出现、规则写不完)；词嵌入让模型自己'悟'语义。\n**流程：** 分词(jieba.lcut)→编号映射(word2idx)→Embedding→送入网络；'苹果'和'香蕉'向量距离近，'苹果'和'桌子'远。","source":"v2.4","star":4,"bank":3},{"id":246,"code":"DL-18","category":"深度学习","question":"什么是Seq2Seq？Encoder-Decoder架构是什么？","answer":"**Seq2Seq(序列到序列)：** 解决输入输出不等长的序列转换(机器翻译/文本摘要/对话系统)。核心思想='先看懂，再表达'。\n\n**架构：**\n- Encoder(编码器)：RNN/LSTM/GRU逐字读输入，最后隐藏状态=上下文向量C(输入的'摘要')\n- Decoder(解码器)：另一个RNN/LSTM/GRU，以C为初始记忆逐字生成输出\n\n**特殊标记：** <SOS>开始符(Decoder第一步输入)，<EOS>结束符(遇到就停止)。\n\n**局限：** 上下文向量C是信息瓶颈，长序列效果差→需要Attention。","extend":"**面试追问：** C=编码器最后一个隐藏状态=输入序列整体摘要；Decoder每一步结合C+上一步输出+当前状态预测下一个词概率分布。\n**应用：** 机器翻译(Google翻译2016年就用)、文本摘要(500字→20字)、图像描述(Encoder是CNN)、代码生成、语法纠错。\n**与Transformer关系：** Transformer本质是'升级版Seq2Seq'——把RNN换成注意力机制；Seq2Seq的Encoder-Decoder思想是现代NLP基石。","source":"v2.4","star":4,"bank":3},{"id":261,"code":"FS-3","category":"FastAPI","question":"FastAPI中路径参数和查询参数的区别与用法？","answer":"**路径参数(Path)：**\n- 写在URL路径里，如 /items/{item_id}\n- **必须传**，典型：商品ID、用户ID\n- 类型提示自动验证：@app.get(\"/items/{item_id}\") def read_item(item_id: int)\n\n**查询参数(Query)：**\n- 写在URL ? 后面，如 /items?page=2&size=10\n- **可选**，有默认值，典型：分页/搜索/过滤\n- 例：def get_items(page: int = 1, page_size: int = 10, q: str | None = None)\n\n**表格记忆：** 路径参数=URL路径中=必传=商品ID；查询参数=?后=可选=分页搜索。","extend":"**易错：** 路径参数必传、查询参数可选(有默认值)；路径参数顺序不能乱，/items/{item_id}中的{item_id}是占位符。\n**追问：** 类型提示int→自动验证，传abc返回422校验错误；多个查询参数用&连接。\n**代码：** `@app.get(\"/items/{item_id}\")` + `def read_item(item_id: int, page: int = 1, q: str | None = None)`。","source":"v2.4","star":4,"bank":3},{"id":262,"code":"FS-4","category":"FastAPI","question":"什么是请求体？Pydantic如何实现自动数据验证？","answer":"**请求体(Request Body)：** 前端把复杂数据(如创建用户)打包成JSON发送给后端，用POST接口接收。\n\n**Pydantic模型：**\n- 继承BaseModel定义数据格式\n- 字段类型注解=自动验证规则\n- 例：age: int | None = None 表示可选字段\n\n**自动验证流程：**\n- 客户端传JSON → Pydantic按模型解析 → 类型不对自动返回422错误\n- 字段多余/缺失也会校验\n\n**核心：** 框架根据类型注解自动完成\"验证+转换\"，不用手动写校验代码。","extend":"**代码：**\n```python\nclass UserCreate(BaseModel):\n    username: str\n    password: str\n    age: int | None = None\n@app.post(\"/users\")\ndef create_user(user: UserCreate): ...\n```\n**易错：** 请求体Content-Type是application/json；字段类型不符自动返回422；age可空用`int | None = None`。\n**追问：** Pydantic是FastAPI核心依赖，负责定义数据格式+自动验证+序列化。","source":"v2.4","star":4,"bank":3},{"id":270,"code":"FS-12","category":"FastAPI","question":"FastAPI如何集成数据库？SQLAlchemy异步ORM的连接与会话管理？","answer":"**安装：** pip install sqlalchemy aiomysql\n\n**三步配置：**\n1. 连接串：mysql+aiomysql://用户:密码@IP:端口/库名?charset=utf8\n2. 引擎：create_async_engine(URL, pool_size=10, max_overflow=10) 管理连接池\n3. 会话工厂：async_sessionmaker(bind=engine, class_=AsyncSession, expire_on_commit=False)\n\n**会话管理(依赖注入)：**\n```python\nasync def get_database():\n    async with AsyncSessionLocal() as session:\n        try:\n            yield session          # 交给接口用\n            await session.commit() # 成功提交\n        except Exception:\n            await session.rollback() # 失败回滚\n            raise\n        finally:\n            await session.close()  # 关闭释放\n```\n**模型：** DeclarativeBase + mapped_column定义表结构。","extend":"**代码：**\n```python\nASYNC_DATABASE_URL = \"mysql+aiomysql://root:pwd@127.0.0.1:3306/db?charset=utf8\"\nengine = create_async_engine(ASYNC_DATABASE_URL, pool_size=10, max_overflow=10)\nAsyncSessionLocal = async_sessionmaker(bind=engine, class_=AsyncSession, expire_on_commit=False)\n```\n**易错：** 异步驱动是mysql+aiomysql；get_database用yield+try/except实现提交/回滚/关闭。\n**追问：** 依赖注入给每个接口自动提供会话，接口无需自己管理连接。","source":"v2.4","star":4,"bank":3},{"id":272,"code":"FS-14","category":"FastAPI","question":"JWT认证的原理？FastAPI中如何实现登录鉴权？","answer":"**JWT原理：** 登录成功后后端用密钥生成令牌返回前端，前端后续请求携带令牌，后端用密钥验证——**不用把token存数据库**，适合分布式系统。\n\n**实现流程：**\n1. 配置：SECRET_KEY + ALGORITHM(HS256) + 有效期30分钟\n2. 生成：jwt.encode(payload含exp过期时间, SECRET_KEY, algorithm)\n3. 校验：jwt.decode(token, SECRET_KEY, algorithms) 过期/签名错抛异常\n4. 提取：OAuth2PasswordBearer(tokenUrl=\"token\") 自动从Authorization头取Bearer Token\n5. 依赖：get_current_user(token=Depends(oauth2_scheme)) 保护私有接口\n\n**鉴权示例：** @app.get(\"/profile\") def profile(user=Depends(get_current_user))——未登录返回401。","extend":"**易错：** SECRET_KEY生产环境放环境变量不能硬编码；jwt.decode过期/签名错抛PyJWTError→返回401；datetime.utcnow()已过时用datetime.now(timezone.utc)。\n**追问：** token有效期ACCESS_TOKEN_EXPIRE_MINUTES；OAuth2PasswordBearer自动从Authorization头提取Bearer Token。","source":"v2.4","star":4,"bank":3},{"id":274,"code":"SK-1","category":"软技能","question":"简历怎么写","answer":"面试时候技能点写法:\n\n建议:不建议“熟练使用python语言,熟悉机器学习算法,熟悉深度学习模型”,建议:了解分类、回归、聚类等机器学习算法的原理,并能够结合实际业务加以运用;掌握RNN、CNN、Transformer等深度学习模型架构和原理,并具备企业实际项目应用经验面试之前建议:\n\n1)需要大家讲简短的自我介绍(不要讲以前Java转到AI、或者是机械转AI等)\n\n我叫什么我来自于什么我之前在哪里工作我目前来到贵公司希望应聘什么职位\n\n(看到贵公司工作氛围比较好,符合我的工作环境预期)\n\n2)项目讲解都要书面化项目名称:基于Neo4j图数据库实现医疗智能对话问答系统项目描述:\n\n简要介绍下项目背景,突出为什么做,以及做之后的优势数据来源是什么:如何获取的数据(自训练还是人工标注)\n\n开发并搭建了什么类型的模型,该模型支持什么任务,模型指标是什么基于第一个版本模型的某些弊端,提出模型优化改进方法:如修改参数、清洗数据、甚至是换新的模型,改进后模型的指标对比达成业务目标(如:通过智能客服对话,减少人工成本,提升服务质量)\n\n3)项目职责(简历中写)\n\n不要出现太多的参与,只允许有1项参与多状态少动作--多写数据分析的指标任务,少写数据采集,数据导入导出日常任务:\n\n(1)训练和测试数据的搜集和清洗\n\n(2)基于业务分析,开发和搭建模型\n\n(3)模型迭代优化,优化过程包括:dif数据修正、模型结构更改等等\n\n(4)开发模型API接口,便于项目功能的服务对外使用\n\n(5)模型实现A/B测试,并部署服务","extend":"","source":"bh","star":2,"bank":3},{"id":275,"code":"SK-2","category":"软技能","question":"面试前针对项目撰写完成项目文档","answer":"建议大家准备完成自我介绍:\n\n自我介绍(参考)\n\n面试官,您好!\n\n我叫XXX,21年毕业于XXXX学校,主修专业为机械工程,本人在校期间,对人工智能方向非常感兴趣,因此在大三期间,申请进入了我校**老师的实验室,该老师的研究方向主要为:机器人与人工智能,在实验室这段时间,本人对机器学习算法以及NLP算法知识进行了系统学习和了解。21年毕业后,本人就职于**科技有限公司,主要岗位职责为:负责文本数据分析、中文分词、文本分类、NER以及知识图谱等相关NLP基础任务,主要参与项目:1)基于Neo4j图数据库搭建了一套辅助医疗诊断的智能问答系统;2)基于公司商业产品数据,实现了产品自动分类的过程。本人在工作中,态度比较端正,能够积极负责,对待同事也能够友好的相处,本人平时爱好主要为听音乐和阅读,那么以上就是本人的基本情况介绍,感谢面试官的聆听。项目介绍那我给您介绍一下最近的这个项目。这里应该写出是在什么时间什么地点基于什么场景做的这个项目,在开始介绍下面该项目是基于NLP技术的一款聊天机器人平台,其目的在于通过人工智能技术让机器像人类一样能够进行智能回复,解决现实中的各种问题。公司基于客户需求,为了方便病人快速了解所得疾病,基于Neo4j图数据库搭建了一套辅助医疗诊断的智能问答系统。本项目工作主要分为两个模块,分别为离线模块和在线模块,其中离线模块包括:1、基于BILSTM+CRF模型实现非结构化文本NER的抽取,共支持3种实体类型,其中模型指标为F1=91%,2、基于BERT+RNN完成命名实体审核任务,模型指标ACC=92%,3、设计schema,将实体以及对应关系导入到Neo4j图数据库中。以上是离线部分。在线部分为:负责主逻辑函数的开发,以及基于BERT模型实现句子主题相关服务的搭建,模型指标为ACC=96%,线上最大支持200qps。个人主要职责:1、负责非结构非结构化数据的处理:如脏数据清洗,正则过滤特殊符号等;2、负责模型的设计以及训练工作,并采用不同策略进行模型的优化,如:参数调节,结果后处理等;3、负责对话主逻辑服务的开发,借助werobot服务实现智能对话。在这里应该准备几个技术上遇到的难题,以及给出解决办法(可以将最后的遇到的问题在这里讲,根据情况做调整)\n\n技术点训练数据集以及测试集的大小是多少,是如何获得的(全是人工标注的吗)?\n\n一般数据量大小可以自己拟定,这里拟定训练集为20万条,测试集为1w;测试集人为标定训练集的获取方式:\n\n第一种回答方式:数据部⻔直接提供(已经打上标签),不需要我们负责, 第二种回答方式:半监督(自训练)方式针对第二种半监督(自训练)方式的实现过程(一般思路):\n\n1)首先人工标注1w条数据集(人工标注的数据我们一般认为准确率为100%),将标注好的数据集,分为训练集8000和测试集2000。\n\n2)利用8000训练集训练我们的基础模型如:bilstm+crf,根据训练好的模型去预测测试集,对比和人工标注的结果dif,如果准确率为96%,可以忽略dif,我们认为该模型效果不错,直接使用训练好的模型,接下面第3步\n\n3)利用第二步训练好的模型,去预测新一批数据(该部分数据为非标注数据),如新选取1w条,此时经过模型预测后,1w条新的数据已打上标签\n\n4)将第3步得到新的1w条数据和之前的8000人工标注数据合并,再次送入模型中训练,训练好的模型去预测2000条测试集,此时准确率可能为94%,如果我们定义模型准确率指标为95%为,那么此时训练集中引入了噪声,存在脏数据(也就是实体类别有标错的数据),可以根据2000条测试集的dif数据,人工筛选实体数据错误类型,对应查找训练集的数据,然后修改,修改完后重复4步骤,发现模型准确率为95%,即达标。在做NER抽取任务时,为什么BiLSTM模型后面还要加一个CRF?BiLSTM也能直接解析NER结果的在NER抽取任务中,BiLSTM模型可以用于对输入序列进行建模和特征提取,得到每个词对应的特征表示。然而,由于NER任务是一个序列标注任务,它需要考虑词之间的关系,以及如何将这些词标注为实体类别。BiLSTM模型可以得到每个位置上的词语的特征表示,但是它并不能直接捕捉到整个序列上的概率分布,也不能直接对整个序列进行标注。而这些都是CRF模型擅⻓的。CRF(条件随机场)是一个经典的序列标注模型,可以直接对整个序列进行建模,并且可以根据上下文信息、标注标签之间的相关性等因素来进行标注,从而得到更加准确的结果。因此,在NER抽取任务中,通常会将BiLSTM和CRF结合起来使用,BiLSTM用于提取特征表示,而CRF用于对整个序列进行标注,以得到最终的NER结果。","extend":"","source":"bh","star":2,"bank":3},{"id":276,"code":"SK-3","category":"软技能","question":"面试前","answer":"1)Boss上搜索对应职位与HR及技术进行简单沟通,寻求符合匹配项的职位\n\n2)沟通中根据自己做过的项目简述核心要点,更详细部分可以进一步约面试详聊\n\n3)切记:不要针对一个公司准备一个简历,要使用我们的简历和项目寻求合适公司\n\n4)语言表达清楚:思维逻辑清晰,表达流畅\n\n5)所述内容不犯错\n\n(1)不说之前公司或者自己的坏话\n\n(2)往自己擅⻓的方面说\n\n(3)如果对于熟悉的内容多聊聊业务+技术;没听过,可以说后续很快能够学会。学会查看岗位职责,包含NLP岗位核心技术,比如文本翻译、语音识别、文本分类等","extend":"","source":"bh","star":2,"bank":3},{"id":277,"code":"SK-4","category":"软技能","question":"投递简历当天没有收到面试邀约","answer":"**答案：**\n- 当天投递后一般需等待 3 天左右，先别焦虑\n- 主动到 Boss 直聘跟 HR / 技术负责人沟通，说明自己与岗位的匹配点，进一步预约面试\n- 投递后主动跟进是加分项，不是打扰；但注意频率，别刷屏","extend":"**面试追问：** 投递前先确认 JD 与简历匹配度；海投 + 精准投结合，避免只盯一家公司。","source":"bh-fixed","star":2,"bank":3},{"id":278,"code":"SK-5","category":"软技能","question":"讲解项目","answer":"**答案：** 讲项目抓住四要素：\n- **业务场景**：解决什么问题、为什么做\n- **项目架构**：整体技术架构、模块划分\n- **自己负责部分**：突出个人职责（少说「参与」，多说「负责」）\n- **优化及坑**：遇到的技术难题与解决方案（体现思考深度）","extend":"**面试追问：** 按「业务 → 架构 → 职责 → 难点」顺序讲，每段 1-2 句即可，别背稿；准备 2-3 个技术难点及解法。","source":"bh-fixed","star":2,"bank":3},{"id":279,"code":"SK-6","category":"软技能","question":"讲解知识","answer":"- 知识点是什么+原理是什么+⼯作中怎么⽤+优化是什么如何学习⼀⻔新技术或技术栈 Github的开源社区+技术博客+相关论文阅读 \n![图2](./figures/fig_234422ee16.png)\n- 应⽤主要分为三个部分，⾸先应该了解它的应⽤场景，⽐如窗⼝的⼀些使⽤场景。然后，进⼀步地我们去了解它的编程接口,最后再深入了解它的一些抽象概念。因为一个框架或一项技术,肯定有它的编程接口和抽象概念来组成它的编程模型。我们可以通过查看文档的方式来熟悉它的应用。在对应用这三个部分有了初步的了解后,我们就可以通过阅读代码的方式去了解它的一些实现了。\n\n- 实现部分也分三个阶段，⾸先从⼯作流程开始，可以通过 API 层⾯不断的下钻来了解它的⼯作流程。接下来是它整体的设计模式,通常对一些框架来说,如果能构建一个比较成熟的生态,一定是在设计模式上有一些独特的地方,使其有一个比较好的扩展性。最后是它的数据结构和算法,因为为了能够处理海量数据并达到高性能,它的数据结构和算法一定有独到之处。我们可以做些深入了解。","extend":"","source":"bh","star":2,"bank":3},{"id":280,"code":"SK-7","category":"软技能","question":"面试中关于技术选型的演变","answer":"比如:在进行NER任务时,第一个版本用的是BILSTM+CRF,但是第二个版本用了BERT+CRF,这里选用BERT的主要原因在于其更强的特征表达能力","extend":"","source":"bh","star":2,"bank":3},{"id":281,"code":"SK-8","category":"软技能","question":"面试后","answer":"1)面试官面试后会给一定反馈,及时询问反馈\n\n2)如果对岗位和公司非常感兴趣可以多问几次,可以说明自己的意愿。\n\n3)切记:面试后需要找老师沟通存在什么问题","extend":"","source":"bh","star":2,"bank":3},{"id":395,"code":"NG-4","category":"Nginx","question":"Nginx 反向代理如何配置？proxy_pass 和 proxy_set_header 的作用？","answer":"**核心就一个 proxy_pass：**\n```nginx\nserver {\n    listen 8080;\n    server_name localhost;\n    location / {\n        proxy_pass http://127.0.0.1:8000;   # 转给本地 8000 端口\n        proxy_set_header Host $host;                    # 原域名\n        proxy_set_header X-Real-IP $remote_addr;        # 用户真实 IP\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 代理链路\n    }\n}\n```\n\n**proxy_pass：** 把请求转发到目标后端地址。\n**proxy_set_header：** 把真实信息传给后端（否则后端只能看到 Nginx 的 IP）。\n- `$host`、`$remote_addr` 是 Nginx 内置变量\n- `$remote_addr` = 用户真实 IP，日志、限流都用得上\n- `X-Forwarded-For` 记录整条代理链路，追溯真实用户 IP","extend":"**易错：** 忘记配 proxy_set_header 会导致后端拿到的 IP 全是 127.0.0.1，日志无法追溯真实用户。","source":"yd","star":3,"bank":3},{"id":412,"code":"LLM-6","category":"大模型应用","question":"RAG 中向量模型如何选择？向量数据库如何对比？","answer":"**向量模型选择三要素：**\n1. **对中文的支持** —— 中文语义理解能力是否好\n2. **费用** —— API 调用成本 / 开源模型部署成本\n3. **数据安全(私有化部署)** —— 能否本地部署，敏感数据不出内网\n\n**选择流程：** 对比多个向量模型(如 BGE、M3E、text-embedding 系列等)，从上述三要素权衡，最终选一个结论。\n\n**向量数据库对比维度：**\n- 数据量(规模)\n- 检索性能(QPS、召回率)\n- 各指标对比(是否支持过滤、混合检索、多模态)\n\n**主流向量库：** Milvus、Chroma、FAISS、Qdrant、pgvector 等，小项目用轻量(Chroma/FAISS)，生产用分布式(Milvus)。","extend":"**追问：** 向量数据库专门做高维向量的\"相似度匹配 + 快速检索\"，普通关系型数据库做不到。","source":"note","star":4,"bank":3},{"id":428,"code":"DB-61","category":"MySQL","question":"数据库连接数过高(too many connections)如何排查处理？","answer":"**排查：**\n① 检查连接池配置是否过大/过小。\n② `SHOW PROCESSLIST` 查看是否有大量Sleep空闲连接未释放。\n③ 是否存在执行慢的SQL导致连接长时间占用不释放。\n\n**处理：**\n- 调大`max_connections`参数（临时缓解）。\n- 优化慢SQL缩短连接占用时间。\n- 合理配置连接池大小（通常CPU核数×2+磁盘数）。\n- 确保应用层及时关闭连接（try-finally或连接池自动回收）。\n- 设置`wait_timeout`回收长时间空闲连接。","extend":"**补充：** 连接池大小经验值=CPU核数×2+磁盘数；Sleep空闲连接过多调wait_timeout回收；应用层连接泄漏是长期隐患。\n**易错：** max_connections调大是临时缓解非根治；慢SQL占用连接时间最长才是根因。\n**面试追问：** 排查SQL——SELECT * FROM information_schema.PROCESSLIST按user/host/command分组统计；SHOW STATUS LIKE 'Threads%'看连接状态。","source":"v2.4-reimport","star":4,"bank":3},{"id":431,"code":"PYH-18","category":"并发编程","question":"请详细解释multiprocessing中Queue和Manager的区别及进程间通信？","answer":"**Queue：**\n- 基于Pipe和锁，FIFO消息传递\n- 适用简单任务分发和结果收集\n- 数据需序列化\n\n**Manager：**\n- 启动独立服务器进程管理共享对象(list/dict/Lock)，其他进程通过代理访问\n- 适用共享复杂数据结构\n- 缺点：性能较差(每次操作跨进程通信+序列化)\n\n**进程池通信：**\n- 普通Queue仅父子进程\n- 进程池需Manager().Queue()跨进程共享\n**大小建议：**\n- CPU密集→CPU核心数(避免频繁切换)\n- I/O密集→不适合多进程用多线程/协程","extend":"**补充：** multiprocessing.Queue基于Pipe+锁，进程池内跨进程共享要用Manager().Queue()；Manager启动独立服务器进程，每次操作都跨进程序列化，性能差但灵活。\n**易错：** 父进程退出前要join()子进程，否则队列数据可能丢失；进程池close()+join()优雅关闭。\n**面试追问：** 共享内存Value/Array更快但仅限C类型；Pipe适合点对点；进程池适合任务分发/结果收集。","source":"v2.4-reimport","star":4,"bank":3},{"id":432,"code":"PYH-19","category":"并发编程","question":"请解释multiprocessing中如何避免孤儿进程和僵尸进程？","answer":"**僵尸进程：** 子进程结束父进程未调wait()/join()回收(PID/退出状态)。避免：调process.join()或进程池自动管理。\n**孤儿进程：** 父进程先于子进程结束，子进程被init收养。避免：父进程在子进程结束前不退出或设守护。\n\n**multiprocessing处理：** Process须调join()回收；Pool在close()+join()自动回收；ProcessPoolExecutor的with自动shutdown。\n**注意：** Windows无孤儿进程概念但僵尸进程同样存在。","extend":"**补充：** 僵尸进程=子进程结束未回收(占用PID表项)；孤儿进程=父进程先退，子进程被init(1号)收养；进程池close()+join()自动回收。\n**易错：** 忘记join()是僵尸进程最常见原因；ProcessPoolExecutor用with自动shutdown。\n**面试追问：** Windows用spawn模式无真正孤儿概念，但僵尸(PID未回收)同样存在；Unix fork模式有写时复制(COW)。","source":"v2.4-reimport","star":4,"bank":3},{"id":433,"code":"PYH-20","category":"并发编程","question":"请说明threading.Thread和multiprocessing.Process的创建方式与关键点？","answer":"**Thread创建：** Thread(target=func,args=(1,),kwargs={},name='名',daemon=True)。start()启动、join()等待。守护线程：daemon=True主线程结束子线程立即结束。自定义：继承Thread重写run()。同进程线程共享内存(通信方便需锁)，受GIL限制。\n\n**Process创建：**\n- Process(target=func,args=(1,),name='名',daemon=True)\n- ⚠️Windows必须if __name__=='__main__':否则递归创建\n- 原因：spawn重新导入主模块→再次执行顶层代码\n- 内存完全独立(不共享)\n- 可真正并行但开销大","extend":"**补充：** Thread共享内存需锁保护；Process内存独立需IPC(Queue/Pipe/Manager)；Windows必须if __name__=='__main__'保护防止spawn递归创建进程。\n**易错：** daemon=True线程在主进程退出时立即结束(不等待)；join(timeout=...)超时后继续执行。\n**面试追问：** 自定义线程继承Thread重写run()；不要在多进程里共享全局变量(不生效)，必须显式IPC。","source":"v2.4-reimport","star":4,"bank":3},{"id":434,"code":"PY-45","category":"面向对象","question":"请解释super()在单继承和多继承中的不同表现？","answer":"**单继承：** super()直接调用父类方法扩展功能。\n**多继承：**\n- super()按MRO顺序调用下一个类方法(非简单调直接父类)\n- super()返回代理对象绑定当前实例和MRO\n- 实现\"协作式多重继承\"\n\n**常见错误：** 某父类未调super()→MRO链断裂→后续父类无法初始化。正确做法：所有父类都使用super()并传递`**`kwargs。","extend":"**补充：** super()无参形式依赖__class__闭包单元格自动推断；也可显式super(SubClass, self)。\n**易错：** super()返回代理对象而非父类实例；多继承中它按MRO找\"下一个\"类的方法，不一定是直接父类。\n**面试追问：** 协作式继承要求所有类都调用super()并透传**kwargs，否则MRO链断裂——典型错误：某父类__init__漏掉super()导致兄弟类属性缺失。","source":"v2.4-reimport","star":4,"bank":3},{"id":435,"code":"PY-46","category":"面向对象","question":"请详细解释类与对象的概念、__init__和self的作用？","answer":"**类：** 同一事物的模板(属性+方法)，类名大驼峰。\n**对象：** 模板创建的具体个体。\n**__init__：**\n- 初始化函数，实例化自动调用赋初始值\n- ⚠️只调用一次，绝对禁止手动调\n- 可设默认参数\n**self：**\n- 代表实例自身\n- 实例方法第一参数必须是self\n- 调用时Python自动传入","extend":"**易错：** __init__禁止手动调用且不能返回值(非None抛TypeError)；self是约定俗成，换名合法但强烈不建议。\n**补充：** __init__在__new__分配内存后自动调用；类本身也是对象(type的实例)。\n**面试追问：** 类定义体在import时执行一次，实例化时__init__执行；dir(实例)查看全部属性方法；hasattr/getattr/setattr动态操作属性。","source":"v2.4-reimport","star":4,"bank":3},{"id":436,"code":"PY-47","category":"面向对象","question":"请说明Python中的封装机制：公有、保护、私有？","answer":"**公有(无下划线)：** 任何地方可访问。\n**保护(_单下划线)：** 本类和子类可访问，外部语法允许但规范禁止。\n**私有(__双下划线)：**\n- 只能本类访问\n- 底层名称改写→_类名__属性名(语法拦截非加密)\n- 适用核心敏感数据\n\n**@property模式：** 将私有属性包装为属性访问，读取脱敏+修改校验。@property定义getter→@xxx.setter→@xxx.deleter。","extend":"**补充：** 名称改写发生在编译期——__x变成_类名__x，子类中实际是_父类名__x，因此\"私有\"属性不继承；通过obj._类名__x仍可访问(约定禁止)。\n**易错：** 双下划线不是加密只是改名，反编译/窥探仍能拿到；模块级_前缀变量不被from module import *导入。\n**面试追问：** 更Pythonic的做法是@property+受保护字段控制读写，双下划线留给真正不想被子类覆盖的内部实现。","source":"v2.4-reimport","star":4,"bank":3},{"id":437,"code":"PY-48","category":"Python基础","question":"请说明while循环、while-else和break/continue的作用？","answer":"**while：** 条件True时重复执行。\n**while-else：** 正常结束执行else，break退出不执行。\n**break：** 立即终止当前层循环。\n**continue：** 跳过本次剩余代码，回到开头。\n**死循环：**\n- 条件永远True→卡死\n- 必须确保变False或用break\n- 嵌套中break/continue只影响当前层","extend":"**while-else易错：** else只在循环条件变False自然结束时执行；break跳出则跳过else——经典\"搜索未找到\"模式。\n**实战：** `while True: ... if done: break`；轮询等待时用time.sleep()避免忙等占满CPU。\n**面试追问：** 嵌套循环break只退出最内层；退出多层用标志变量或把循环封装成函数return。","source":"v2.4-reimport","star":3,"bank":3},{"id":438,"code":"PY-49","category":"Python基础","question":"请说明for循环原理、range()和enumerate()的用法？","answer":"**for vs while：**\n- while条件驱动\n- for元素驱动\n**range()(惰性)：**\n- range(n)→0~n-1\n- range(start,stop)→start~stop-1\n- range(start,stop,step)→可为负\n**enumerate()：** for idx,char in enumerate(obj,start=0):同时取索引+值。\n\n**for底层：** iter(obj)→不断next()→捕获StopIteration退出。无__iter__时回退找__getitem__()。","extend":"**range细节：** range()是惰性对象不占内存，list(range(10**9))才爆内存；range支持负数步长。\n**enumerate补充：** `for i, v in enumerate(lst, start=1)`编号从1开始；zip()并行遍历多个列表。\n**面试追问：** for底层=iter()+next()+捕获StopIteration；dict直接for遍历的是键，items()才是键值对。","source":"v2.4-reimport","star":3,"bank":3},{"id":440,"code":"PD-46","category":"Pandas","question":"什么是布尔索引？什么是花式索引？","answer":"**布尔索引：** 用和数组相同形状的布尔数组当掩码（mask），通过掩码取出对应元素，返回副本\n- 生成掩码：mask = arr > 3\n- 筛选：arr[mask]\n- 二维多条件：用&、|连接，如arr[(arr2d>2) & (arr2d<7)]\n\n**花式索引：** 传入一个整数列表/整数数组指定要取的下标，不是连续切片，永远返回副本\n- 一维：arr[[0,2,4]] → 取第0、2、4个元素\n- 二维：arr2d[[0,3]]取第0、3行","extend":"**补充：** 布尔索引=掩码筛选返回副本；多维多条件用& |且每条件加括号；花式索引传整数列表/数组取指定行。\n**代码：**\n```python\narr[arr > 3]\nmask = (arr2d > 2) & (arr2d < 7)\narr2d[[0, 3]]   # 取第0、3行\n```\n**易错：** 布尔数组形状必须匹配(一维布尔对二维按行筛选)；&不是and；花式索引结果总是副本。\n**面试追问：** 条件筛选是数据分析高频操作；np.where(cond,x,y)做三目替换；布尔索引+赋值arr[arr<0]=0做数据清洗。","source":"v2.4-reimport","star":3,"bank":3},{"id":443,"code":"PD-49","category":"Pandas","question":"如何读写CSV和Excel文件？","answer":"**读取：**\n- pd.read_csv(\"data.csv\")：读CSV\n- pd.read_excel(\"data.xlsx\")：读Excel\n- read_csv的parse_dates参数：parse_dates=[\"日期\"] 把指定列直接解析成日期类型，实战中很常用\n\n**导出：**\n- df.to_csv(\"导出.csv\", index=False)：导出CSV\n- df.to_excel(\"导出.xlsx\", index=False)：导出Excel\n- index=False表示不保存行索引\n\n**其他格式：** JSON、pickle等格式偶尔也会用到，写法都是配对的一组\"读/写\"函数。","extend":"**补充：** read_csv/read_excel读取；parse_dates把指定列解析成日期类型(实战常用)；to_csv/to_excel导出(index=False不写行索引)。\n**代码：**\n```python\npd.read_csv('data.csv', parse_dates=['日期'])\ndf.to_csv('导出.csv', index=False)\n```\n**易错：** 读Excel需先pip install openpyxl；CSV默认utf-8，Windows用Excel打开乱码时可存encoding='utf-8-sig'。\n**面试追问：** read_csv常用参数——sep分隔符、usecols选列、dtype指定类型、nrows只读前N行预览；JSON/pickle配对读写函数。","source":"v2.4-reimport","star":3,"bank":3},{"id":444,"code":"LNX-23","category":"Linux","question":"su和su -的区别？","answer":"**su 用户名称：** 切换用户，只能获得执行权限，不能获得该用户的环境变量。\n**su - 用户名称：** 切换到用户并获得该用户的环境变量及执行权限（加载用户的完整登录环境）。\n\n**使用建议：**\n- 需要完整root环境时用 su -\n- 临时执行命令用 su root\n\n**exit：** 退出当前用户回到原用户。\n\n**推荐实践：** 相比频繁切换root，更推荐使用sudo临时获取root权限，降低误操作风险。","extend":"**补充：** su只切换身份不加载目标用户环境变量；su -切换并
